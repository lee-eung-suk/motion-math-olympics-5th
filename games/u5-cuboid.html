      <button class="ghost-btn" id="homeBtn2">🎲 보드로</button>
    </div>

</div>

<script type="module">
import {
  HighScore, requestWakeLock, SoundKit, FileAudioLoop,
  HandTracker, ClipRecorder, downloadBlob,
  drawMirroredVideo, fitCanvasToScreen, isHandRaised, getCursors,
  AutoDifficulty, levelFromUrl, medalFor,
  scheduleAutoRecording, ComboShot, drawPhotoOverlay,
  ScreenShake, InputMode, PointerInput, StartGate,
  startCamera, formatFileTimestamp, fluidPx, showSoundHint,
  drawVignette, spawnConfetti, updateConfetti, drawConfetti,
} from "../js/engine.js?v=2";
import {
  CUTE, LANE_COLORS, bob, drawSticker, drawStickerRect, drawChunkyText,
  spawnSparkles, updateSparkles, drawSparkles, makeDrifters, drawDrifters,
  drawBunting, drawGloveCursor, drawLevelStars, drawCuteBanner,
} from "../js/cute.js?v=5";
import {
  PARTY, CHARACTERS, Board, Party, drawPartyBackdrop, drawCrowd, drawMascot,
  showRuleCard, renderPodium, irisTransition,
} from "../js/party.js?v=1";
requestWakeLock();

const UNIT = "f5";
const TITLE = "전개도 베이스런";
const RECORD_SUFFIX = "번 홈인";
const MEDALS = { bronze: 3, silver: 5, gold: 8 };
const CHAR = CHARACTERS[UNIT];
const mode = InputMode.get();

const video = document.getElementById("video");
const canvas = document.getElementById("gameCanvas");
let dims = fitCanvasToScreen(canvas);
let drifters = makeDrifters(12, dims.w, dims.h);
window.addEventListener("resize", () => {
  dims = fitCanvasToScreen(canvas);
  drifters = makeDrifters(12, dims.w, dims.h);
});

const sound = new SoundKit();
const bgm = new FileAudioLoop("../assets/sounds/subbgm.mp3", 0.32);
const isMuted = () => localStorage.getItem("smo_muted") === "1";
const party = new Party({ unit: UNIT, sound, isMuted });

function goHome() { bgm.stop(); irisTransition(() => { location.href = "../index.html"; }); }
document.getElementById("homeBtn").addEventListener("click", goHome);
document.getElementById("homeBtn2").addEventListener("click", goHome);

function randInt(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// ---------------------------------------------------------------------------
// 전개도를 접었을 때 어느 면이 어디로 가는지 실제로 계산한다.
// 종이 위를 한 칸씩 굴러가는 주사위라고 생각하고, 각 칸에서 "바닥에 닿는 면"의
// 3차원 방향을 따라간다. 두 칸의 방향이 정반대면 마주 보는 면, 수직이면 만나는 면이다.
// 덕분에 십자형뿐 아니라 계단형 같은 낯선 전개도도 정확히 채점할 수 있다.
// ---------------------------------------------------------------------------
const neg = (v) => [-v[0], -v[1], -v[2]];
const key = (v) => v.join(",");

function foldNet(cells) {
  const map = new Map(cells.map((c, i) => [`${c[0]},${c[1]}`, i]));
  const state = new Array(cells.length).fill(null);
  state[0] = { R: [1, 0, 0], U: [0, 1, 0], D: [0, 0, -1] };
  const queue = [0];
  while (queue.length) {
    const i = queue.shift();
    const [c, r] = cells[i];
    const s = state[i];
    const moves = [
      [[c + 1, r], { R: neg(s.D), U: s.U, D: s.R }],
      [[c - 1, r], { R: s.D, U: s.U, D: neg(s.R) }],
      [[c, r - 1], { R: s.R, U: neg(s.D), D: s.U }],
      [[c, r + 1], { R: s.R, U: s.D, D: neg(s.U) }],
    ];
    for (const [pos, ns] of moves) {
      const j = map.get(`${pos[0]},${pos[1]}`);
      if (j === undefined || state[j]) continue;
      state[j] = ns;
      queue.push(j);
    }
  }
  if (state.some((s) => !s)) return null;                       // 떨어져 있는 칸이 있다
  const dirs = state.map((s) => key(s.D));
  if (new Set(dirs).size !== 6) return null;                    // 두 면이 겹친다 = 전개도가 아니다
  return state.map((s) => s.D);
}

// 후보 전개도들 — 접기 계산으로 실제 직육면체가 되는 것만 남긴다
const RAW_NETS = {
  1: [
    [[1, 0], [0, 1], [1, 1], [2, 1], [3, 1], [1, 2]],   // 십자형
    [[2, 0], [0, 1], [1, 1], [2, 1], [3, 1], [2, 2]],
    [[1, 0], [1, 1], [0, 2], [1, 2], [2, 2], [3, 2]],
  ],
  3: [
    [[0, 0], [1, 0], [1, 1], [2, 1], [2, 2], [3, 2]],   // 계단형
    [[0, 0], [0, 1], [1, 1], [2, 1], [2, 2], [3, 2]],
    [[1, 0], [2, 0], [0, 1], [1, 1], [2, 1], [0, 2]],
    [[0, 0], [1, 0], [1, 1], [1, 2], [2, 2], [3, 2]],
  ],
};
const NETS = { 1: [], 3: [] };
for (const lv of [1, 3]) {
  for (const cells of RAW_NETS[lv]) {
    const dirs = foldNet(cells);
    if (dirs) NETS[lv].push({ cells, dirs });
  }
}
if (NETS[3].length === 0) NETS[3] = NETS[1];

const FACE_NAMES = ["가", "나", "다", "라", "마", "바"];

// ⭐1·3단계: 전개도에서 조건에 맞는 면 찾기
function genNetRound(level) {
  const pool = NETS[level === 1 ? 1 : 3];
  const net = pool[Math.floor(Math.random() * pool.length)];
  const n = net.cells.length;
  const star = randInt(0, n - 1);
  const opposite = net.dirs.findIndex((d, i) => i !== star && key(d) === key(neg(net.dirs[star])));

  // 보기 4개: 정답(마주 보는 면) + 나머지 중 3개
  const others = [...Array(n).keys()].filter((i) => i !== star && i !== opposite);
  const options = shuffle([opposite, ...shuffle(others).slice(0, 3)]);
  const askPerp = level === 3 && Math.random() < 0.5;
  return {
    type: "net", net, star, options,
    answer: opposite,
    question: askPerp
      ? `${FACE_NAMES[star]} 면과 만나지 않는 면은?`
      : `${FACE_NAMES[star]} 면과 마주 보는 면은?`,
    hint: askPerp
      ? "한 면과 만나지 않는 면은 마주 보는 면 하나뿐이에요"
      : "접었을 때 서로 닿지 않고 나란히 놓이는 면이에요",
    labels: options.map((i) => FACE_NAMES[i]),
  };
}

// ⭐2단계: 겨냥도를 보고 수 세기
const COUNT_Q = [
  { q: "직육면체의 면은 모두 몇 개?", a: 6, hint: "위·아래, 앞·뒤, 양옆" },
  { q: "직육면체의 모서리는 모두 몇 개?", a: 12, hint: "면과 면이 만나는 선이에요" },
  { q: "직육면체의 꼭짓점은 모두 몇 개?", a: 8, hint: "모서리가 만나는 점이에요" },
  { q: "겨냥도에서 보이지 않는 모서리는 몇 개?", a: 3, hint: "점선으로 그린 모서리를 세어요" },
  { q: "겨냥도에서 보이지 않는 꼭짓점은 몇 개?", a: 1, hint: "뒤쪽에 숨은 점이에요" },
  { q: "겨냥도에서 보이는 면은 몇 개?", a: 3, hint: "앞에서 볼 때 보이는 면이에요" },
  { q: "서로 평행한 면은 몇 쌍?", a: 3, hint: "마주 보는 면끼리 한 쌍" },
  { q: "한 면과 수직인 면은 몇 개?", a: 4, hint: "마주 보는 면 하나만 빼고 다 만나요" },
  { q: "한 모서리와 평행한 모서리는 몇 개?", a: 3, hint: "같은 방향으로 뻗은 모서리를 세어요" },
];
function genCountRound() {
  const pick = COUNT_Q[Math.floor(Math.random() * COUNT_Q.length)];
  const opts = new Set([pick.a]);
  while (opts.size < 4) {
    const cand = pick.a + randInt(-4, 5);
    if (cand >= 1 && cand !== pick.a) opts.add(cand);
  }
  const options = shuffle([...opts]);
  return {
    type: "count", question: pick.q, hint: pick.hint,
    answer: pick.a, options, labels: options.map(String),
  };
}

function genRound(level) {
  return level === 2 ? genCountRound() : genNetRound(level);
}

const handTracker = new HandTracker();
let pointerInput = null;

async function init() {
  if (!isMuted()) bgm.play(showSoundHint);
  if (mode === "motion") {
    try {
      await startCamera(video, { width: 640, height: 480 });
      if (!isMuted()) bgm.play(showSoundHint);
    } catch (e) {
      document.getElementById("loadingText").textContent = "⚠️ 카메라를 찾을 수 없어요. 카메라 권한을 확인해주세요.";
      return;
    }
    document.getElementById("loadingText").textContent = "AI 모델을 불러오는 중…";
    await handTracker.init(1);
  } else {
    pointerInput = new PointerInput(canvas);
  }
  document.getElementById("loadingPanel").style.display = "none";

  await showRuleCard({
    unit: UNIT,
    title: "전개도 베이스런",
    lines: [
      "왼쪽 <b>전개도(겨냥도)</b>를 보고 문제의 답을 찾아요.",
      "답이 적힌 <b>베이스</b>에 손을 대면 네모곰이 다이아몬드를 돌아 <b>홈인</b>해요!",
      "틀린 베이스를 밟으면 <b>아웃</b>이에요. 점수가 깎이지는 않아요.",
      "⭐⭐⭐단계에서는 <b>낯선 모양의 전개도</b>가 나와요.",
    ],
  });

  document.getElementById("raiseIcon").textContent = mode === "motion" ? "🙋" : "👆";
  document.getElementById("raiseText").textContent = mode === "motion" ? "손을 들어 주세요!" : "화면을 터치(클릭)하면 시작!";
  document.getElementById("raisePanel").style.display = "flex";
  state = "raise";
  requestAnimationFrame(loop);
}

let state = "loading";
const holdFill = document.getElementById("holdFill");
const startGate = new StartGate(mode, holdFill);

let autoDiff, count, playEndAt;
let round, bases, roundAt, resolving, dwell = [], run = null, resultMark = null;
let confetti = [], sparks = [];
const shake = new ScreenShake();
let recorder, comboShot, fallbackShot, autoRec, recordedBlob = null;
const recIndicator = document.getElementById("recIndicator");
let cursors = [];

// 다이아몬드: 홈(아래) → 1루(오른쪽) → 2루(위) → 3루(왼쪽) → 홈
const BASE_NAMES = ["1루", "2루", "3루", "홈"];
function diamond() {
  const { w, h } = dims;
  const cx = w * 0.70, cy = h * 0.63;
  const rx = Math.min(w * 0.19, h * 0.30), ry = Math.min(w * 0.15, h * 0.26);
  return { cx, cy, rx, ry };
}
function basePos(i) {
  const d = diamond();
  // 0=1루(오른쪽) 1=2루(위) 2=3루(왼쪽) 3=홈(아래)
  const pts = [
    { x: d.cx + d.rx, y: d.cy },
    { x: d.cx, y: d.cy - d.ry },
    { x: d.cx - d.rx, y: d.cy },
    { x: d.cx, y: d.cy + d.ry },
  ];
  return pts[i];
}
const baseR = () => fluidPx(dims, 40, { min: 30, max: 56 });

function layoutBases() {
  bases = round.options.map((opt, i) => ({
    i, label: round.labels[i],
    faceIdx: round.type === "net" ? opt : null,
    value: opt,
    ...basePos(i),
  }));
  dwell = bases.map(() => 0);
}

function newRound() {
  round = genRound(autoDiff.level);
  layoutBases();
  resolving = false;
  run = null; resultMark = null;
  roundAt = performance.now();
}

function startCountdown() {
  state = "countdown";
  document.getElementById("countdownPanel").style.display = "flex";
  const numEl = document.getElementById("countNum");
  let n = 3;
  numEl.textContent = n;
  if (!isMuted()) sound.countBeep();
  const iv = setInterval(() => {
    n--;
    if (n <= 0) {
      clearInterval(iv);
      document.getElementById("countdownPanel").style.display = "none";
      if (!isMuted()) sound.go();
      beginPlay();
    } else {
      numEl.textContent = n;
      if (!isMuted()) sound.countBeep();
    }
  }, 700);
}

function beginPlay() {
  state = "playing";
  const prev = HighScore.get(UNIT);
  autoDiff = new AutoDifficulty(levelFromUrl(AutoDifficulty.startLevelFromHighScore(prev)));
  count = 0;
  party.reset();
  confetti = []; sparks = [];
  playEndAt = performance.now() + 60000;
  newRound();

  recorder = new ClipRecorder(canvas, sound, 24);
  recorder.prepare();
  comboShot = new ComboShot(canvas);
  fallbackShot = new ComboShot(canvas);
  autoRec = scheduleAutoRecording(recorder, {
    onStartVisual: () => {
      recIndicator.style.display = "flex";
      setTimeout(() => { if (!comboShot.captured) fallbackShot.capture(canvas); }, 1500);
    },
    onEndVisual: () => { recIndicator.style.display = "none"; },
    onDone: (blob) => { recordedBlob = blob; },
    fallbackMs: 8000,
  });
}

function pickBase(b) {
  if (resolving) return;
  resolving = true;
  const ok = b.value === round.answer;
  resultMark = { base: b, ok, at: performance.now() };
  if (ok) {
    // 홈인! 곰이 다이아몬드를 한 바퀴 돈다
    run = { start: performance.now(), dur: 1500 };
    count++;
    party.correct(b.x, b.y - baseR() * 1.4, { base: 10, elapsedMs: performance.now() - roundAt });
    if (party.combo > 0 && party.combo === party.maxCombo) comboShot.capture(canvas);
    autoDiff.reportCorrect();
    autoRec.trigger();
    shake.trigger(7, 180);
    spawnSparkles(sparks, b.x, b.y, 24, ["#fff", PARTY.gold, CUTE.green]);
    const d = diamond();
    spawnConfetti(confetti, d.cx, d.cy + d.ry, 40);
    setTimeout(() => { if (state === "playing") newRound(); }, 1700);
  } else {
    party.wrong(b.x, b.y - baseR() * 1.4, "아웃! 다시 봐요");
    autoDiff.reportWrong();
    shake.trigger(4, 150);
    setTimeout(() => { if (state === "playing") newRound(); }, 1500);
  }
}

function endGame() {
  state = "result";
  const { medal, label } = medalFor(count, MEDALS);
  const prev = HighScore.get(UNIT);
  const best = Math.max(count, prev ? prev.count : 0);
  if (!prev || count >= prev.count) {
    HighScore.set(UNIT, { count, bestLevel: autoDiff.level, label: `${medal} ${count}${RECORD_SUFFIX}`, at: Date.now() });
  }
  const earnedStar = medal !== "🏅";
  Board.finishGame(UNIT, { coins: party.coins, earnedStar });
  renderPodium({ unit: UNIT, medal, label, coins: party.coins, maxCombo: party.maxCombo, count, suffix: RECORD_SUFFIX, best });

  document.getElementById("statCount").textContent = count + "번";
  document.getElementById("statBest").textContent = best + "번";
  document.getElementById("statCombo").textContent = "🔥" + party.maxCombo;

  const shot = comboShot.captured ? comboShot : fallbackShot;
  const previewVideo = document.getElementById("previewVideo");
  const saveVideoBtn = document.getElementById("saveVideoBtn");
  if (recordedBlob) {
    previewVideo.src = URL.createObjectURL(recordedBlob);
    previewVideo.style.display = "block";
    saveVideoBtn.style.display = "inline-block";
  }
  document.getElementById("savePhotoBtn").onclick = async () => {
    const blob = await shot.toBlob((c, w, h) => drawPhotoOverlay(c, w, h, { title: TITLE, record: count + RECORD_SUFFIX, medal }));
    downloadBlob(blob, `수학체육올림픽5_전개도베이스런_${formatFileTimestamp()}.png`);
  };
  document.getElementById("saveVideoBtn").onclick = () => {
    if (recordedBlob) downloadBlob(recordedBlob, `수학체육올림픽5_전개도베이스런_${formatFileTimestamp()}.${recorder.extension}`);
  };
  document.getElementById("resultPanel").style.display = "flex";
  if (!isMuted()) sound.success();
}

document.getElementById("retryBtn").addEventListener("click", () => {
  document.getElementById("resultPanel").style.display = "none";
  document.getElementById("raisePanel").style.display = "flex";
  startGate.since = 0; startGate.ready = false; holdFill.style.width = "0%";
  state = "raise";
});

document.getElementById("raisePanel").addEventListener("click", () => {
  if (state === "raise" && mode !== "motion") goReady();
});

function goReady() {
  state = "ready";
  document.getElementById("raisePanel").style.display = "none";
  document.getElementById("readyPanel").style.display = "flex";
  if (!isMuted()) sound.click();
  setTimeout(() => {
    document.getElementById("readyPanel").style.display = "none";
    startCountdown();
  }, 500);
}

function loop(tsMs) {
  requestAnimationFrame(loop);
  if (mode === "motion" && video.readyState < 2) return;
  const { ctx, w, h } = dims;
  ctx.save();
  shake.apply(ctx);
  if (mode === "motion") drawMirroredVideo(ctx, video, w, h);
  else drawPartyBackdrop(ctx, dims);
  drawDrifters(ctx, drifters, dims, 1 / 60);
  drawBunting(ctx, dims);
  drawCrowd(ctx, dims, party.cheerUntil);

  let result = null;
  if (mode === "motion") {
    result = handTracker.detect(video, tsMs);
    if (state === "raise") {
      let raised = false;
      if (result && result.landmarks) for (const lm of result.landmarks) if (isHandRaised(lm)) raised = true;
      if (startGate.update(tsMs, raised)) goReady();
    }
  }
  cursors = getCursors(mode, result, w, h, video, pointerInput);

  if (state === "playing") stepGame();

  for (const c of cursors) drawGloveCursor(ctx, c.x, c.y, fluidPx(dims, 44, { min: 32, max: 62 }));
  ctx.restore();
}

// 겨냥도 — 보이지 않는 모서리는 점선으로
function drawCuboid(ctx, cx, cy, W, H, D, opts = {}) {
  const x0 = cx - W / 2, y0 = cy - H / 2 + D / 2;
  const ox = D * 0.62, oy = -D * 0.52;
  const F = [[x0, y0], [x0 + W, y0], [x0 + W, y0 - H], [x0, y0 - H]];
  const B = F.map(([x, y]) => [x + ox, y + oy]);
  ctx.save();
  ctx.lineJoin = "round";
  // 보이는 면(위·앞·오른쪽)을 옅게 칠한다
  ctx.fillStyle = "rgba(255,207,63,0.35)";
  ctx.beginPath(); ctx.moveTo(...F[0]); for (const p of F.slice(1)) ctx.lineTo(...p); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "rgba(255,169,77,0.35)";
  ctx.beginPath(); ctx.moveTo(...F[3]); ctx.lineTo(...F[2]); ctx.lineTo(...B[2]); ctx.lineTo(...B[3]); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "rgba(255,143,199,0.3)";
  ctx.beginPath(); ctx.moveTo(...F[1]); ctx.lineTo(...F[2]); ctx.lineTo(...B[2]); ctx.lineTo(...B[1]); ctx.closePath(); ctx.fill();

  const lw = opts.lineWidth ?? Math.max(2.5, W * 0.02);
  ctx.strokeStyle = CUTE.ink; ctx.lineWidth = lw;
  // 보이는 모서리 9개
  ctx.beginPath();
  ctx.moveTo(...F[0]); for (const p of F.slice(1)) ctx.lineTo(...p); ctx.closePath();
  ctx.moveTo(...B[1]); ctx.lineTo(...B[2]); ctx.lineTo(...B[3]);
  ctx.moveTo(...F[1]); ctx.lineTo(...B[1]);
  ctx.moveTo(...F[2]); ctx.lineTo(...B[2]);
  ctx.moveTo(...F[3]); ctx.lineTo(...B[3]);
  ctx.stroke();
  // 보이지 않는 모서리 3개 (뒤쪽 왼쪽 아래 꼭짓점에 모인다)
  ctx.save();
  ctx.setLineDash([6, 5]);
  ctx.lineWidth = lw * 0.8;
  ctx.strokeStyle = "rgba(34,48,92,0.6)";
  ctx.beginPath();
  ctx.moveTo(...B[0]); ctx.lineTo(...B[1]);
  ctx.moveTo(...B[0]); ctx.lineTo(...B[3]);
  ctx.moveTo(...B[0]); ctx.lineTo(...F[0]);
  ctx.stroke();
  ctx.restore();
  ctx.restore();
}

function drawPanel(ctx, remain) {
  const { w, h } = dims;
  const px = w * 0.03, py = h * 0.30;
  const pw = w * 0.38, ph = h * 0.62;
  drawStickerRect(ctx, px + pw / 2, py + ph / 2, pw, ph, fluidPx(dims, 20, { min: 13, max: 28 }), CUTE.cream, {
    lineWidth: fluidPx(dims, 5, { min: 3.5, max: 7 }), drop: fluidPx(dims, 6, { min: 4, max: 9 }),
  });

  if (round.type === "count") {
    drawCuboid(ctx, px + pw / 2, py + ph * 0.52, pw * 0.52, ph * 0.34, Math.min(pw, ph) * 0.24);
    drawChunkyText(ctx, "겨냥도", px + pw / 2, py + ph * 0.9, fluidPx(dims, 16, { min: 11, max: 21 }), CUTE.ink, { outlineWidth: 0.1, outline: CUTE.cream });
    return;
  }

  // 전개도 — 칸마다 이름과 색을 붙이고, 기준 면에는 ★을 단다
  const cells = round.net.cells;
  const cols = Math.max(...cells.map((c) => c[0])) + 1;
  const rows = Math.max(...cells.map((c) => c[1])) + 1;
  const cell = Math.min((pw * 0.86) / cols, (ph * 0.72) / rows);
  const ox = px + pw / 2 - (cols * cell) / 2;
  const oy = py + ph * 0.52 - (rows * cell) / 2;
  cells.forEach(([c, r], i) => {
    const x = ox + c * cell + cell / 2;
    const y = oy + r * cell + cell / 2;
    const isStar = i === round.star;
    const shown = round.options.includes(i) || isStar;
    drawStickerRect(ctx, x, y, cell * 0.96, cell * 0.96, cell * 0.16,
      isStar ? PARTY.gold : LANE_COLORS[i % LANE_COLORS.length], {
        lineWidth: Math.max(2.5, cell * 0.07), drop: cell * 0.05,
      });
    drawChunkyText(ctx, FACE_NAMES[i], x, y, cell * 0.42, "#fff",
      { outline: CUTE.ink, outlineWidth: Math.max(2.5, cell * 0.09) });
    if (isStar) {
      ctx.save();
      ctx.font = `${cell * 0.34}px sans-serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("⭐", x + cell * 0.32, y - cell * 0.32);
      ctx.restore();
    }
  });

  // 정답을 맞히면 전개도가 접혀 직육면체가 되는 걸 보여 준다 — 이 종목의 하이라이트
  if (resultMark && resultMark.ok) {
    const t = Math.min(1, (performance.now() - resultMark.at) / 900);
    ctx.save();
    ctx.globalAlpha = t;
    drawCuboid(ctx, px + pw / 2, py + ph * 0.52, pw * 0.46 * t, ph * 0.30 * t, Math.min(pw, ph) * 0.22 * t);
    ctx.restore();
    if (t > 0.9) {
      drawChunkyText(ctx, "이렇게 접혀요!", px + pw / 2, py + ph * 0.9,
        fluidPx(dims, 17, { min: 12, max: 23 }), "#fff", { outline: CUTE.green, outlineWidth: fluidPx(dims, 5, { min: 3.5, max: 7 }) });
    }
  }
}

function stepGame() {
  const { ctx, w, h } = dims;
  const dt = 1 / 60;
  const remain = Math.max(0, playEndAt - performance.now());
  if (remain <= 0) { endGame(); return; }
  const now = performance.now();
  const armed = now - roundAt > 800;
  const R = baseR();

  // ── 판정: 베이스 위에 손이 잠깐(0.32초) 머물면 밟은 것으로 본다 ──
  if (!resolving && armed) {
    // 여러 베이스가 판정 범위에 걸치면 가장 가까운 하나만 센다
    let best = null, bd = Infinity;
    for (const c of cursors) {
      for (const b of bases) {
        const d = Math.hypot(c.x - b.x, c.y - b.y);
        if (d < R && d < bd) { bd = d; best = b; }
      }
    }
    bases.forEach((b, i) => {
      dwell[i] = best === b ? dwell[i] + dt * 1000 : Math.max(0, dwell[i] - dt * 800);
      if (dwell[i] > 320) pickBase(b);
    });
  }

  // ── 다이아몬드 ──────────────────────────────────────────
  const d = diamond();
  ctx.save();
  ctx.fillStyle = "rgba(140,233,154,0.4)";
  ctx.beginPath();
  ctx.moveTo(d.cx, d.cy - d.ry * 1.35);
  ctx.lineTo(d.cx + d.rx * 1.35, d.cy);
  ctx.lineTo(d.cx, d.cy + d.ry * 1.35);
  ctx.lineTo(d.cx - d.rx * 1.35, d.cy);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.9)";
  ctx.lineWidth = fluidPx(dims, 5, { min: 3.5, max: 7 });
  ctx.beginPath();
  for (let i = 0; i < 4; i++) {
    const p = basePos(i), q = basePos((i + 1) % 4);
    ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y);
  }
  ctx.stroke();
  ctx.restore();

  // 베이스
  bases.forEach((b, i) => {
    const isHit = resultMark && resultMark.base === b;
    const fill = isHit ? (resultMark.ok ? CUTE.green : CUTE.red) : CUTE.cream;
    drawStickerRect(ctx, b.x, b.y, R * 1.7, R * 1.7, R * 0.28, fill, {
      lineWidth: fluidPx(dims, 4, { min: 3, max: 6 }), drop: fluidPx(dims, 5, { min: 3, max: 8 }),
    });
    drawChunkyText(ctx, b.label, b.x, b.y, R * 0.72, isHit ? "#fff" : CUTE.ink,
      { outline: isHit ? CUTE.ink : "#ffffff", outlineWidth: Math.max(3, R * 0.16) });
    ctx.save();
    ctx.fillStyle = "rgba(34,48,92,0.6)";
    ctx.font = `900 ${fluidPx(dims, 12, { min: 9, max: 16 })}px sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(BASE_NAMES[i], b.x, b.y + R * 1.12);
    ctx.restore();
    if (dwell[i] > 0 && !resolving) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(b.x, b.y, R * 1.05, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(1, dwell[i] / 320));
      ctx.strokeStyle = PARTY.gold; ctx.lineWidth = fluidPx(dims, 6, { min: 4, max: 9 });
      ctx.lineCap = "round"; ctx.stroke();
      ctx.restore();
    }
  });

  // 네모곰 — 평소엔 홈에서 방망이를 들고, 홈인할 땐 베이스를 한 바퀴 돈다
  const br = fluidPx(dims, 24, { min: 18, max: 33 });
  let bearPos = { x: basePos(3).x, y: basePos(3).y + R * 1.9 };
  if (run) {
    const t = Math.min(1, (performance.now() - run.start) / run.dur);
    const seg = Math.min(3, Math.floor(t * 4));
    const local = t * 4 - seg;
    const from = seg === 0 ? basePos(3) : basePos(seg - 1);
    const to = basePos(seg);
    bearPos = {
      x: from.x + (to.x - from.x) * local,
      y: from.y + (to.y - from.y) * local - Math.sin(Math.PI * local) * br * 0.9,
    };
    if (t >= 1) run = null;
  }
  drawMascot(ctx, bearPos.x, bearPos.y, br, CHAR, party.currentMood(remain));

  drawPanel(ctx, remain);

  const hudBottom = party.drawHud(ctx, dims, { remainMs: remain, count, suffix: "번" });
  drawCuteBanner(ctx, dims, [
    { text: round.question, size: 25, chunky: true, color: PARTY.gold },
    { text: round.hint, size: 14, color: CUTE.ink },
  ], fluidPx, { top: hudBottom });

  party.update(dt);
  confetti = updateConfetti(confetti, dt); drawConfetti(ctx, confetti);
  sparks = updateSparkles(sparks, dt); drawSparkles(ctx, sparks);
  party.drawFx(ctx, dims);
  party.drawFeverFrame(ctx, dims);

  drawVignette(ctx, w, h, 0.16);
  drawLevelStars(ctx, dims, autoDiff.level, fluidPx);
}

init();
</script>
