function randInt(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// ---------------------------------------------------------------------------
// 전개도를 접어 각 칸이 입체의 어느 방향을 향하는지 구한다.
// 이 방향 벡터만 있으면 "마주 보는 면"과 "이웃한 면"을 바로 판정할 수 있다.
// ---------------------------------------------------------------------------
const neg = (v) => [-v[0], -v[1], -v[2]];
const key = (v) => v.join(",");

function foldNet(cells) {
  const map = new Map(cells.map((c, i) => [`${c[0]},${c[1]}`, i]));
  const state = new Array(cells.length).fill(null);
  state[0] = { R: [1, 0, 0], U: [0, 1, 0], D: [0, 0, -1] };
  const queue = [0];
  while (queue.length) {
    const i = queue.shift();
    const [c, r] = cells[i];
    const s = state[i];
    const moves = [
      [[c + 1, r], { R: neg(s.D), U: s.U, D: s.R }],
      [[c - 1, r], { R: s.D, U: s.U, D: neg(s.R) }],
      [[c, r - 1], { R: s.R, U: neg(s.D), D: s.U }],
      [[c, r + 1], { R: s.R, U: s.D, D: neg(s.U) }],
    ];
    for (const [pos, ns] of moves) {
      const j = map.get(`${pos[0]},${pos[1]}`);
      if (j === undefined || state[j]) continue;
      state[j] = ns;
      queue.push(j);
    }
  }
  if (state.some((s) => !s)) return null;
  const dirs = state.map((s) => key(s.D));
  if (new Set(dirs).size !== 6) return null;
  return state.map((s) => s.D);
}

// 전개도가 곧 문제이므로 같은 그림이 반복되지 않도록 넉넉히 갖춰 둔다.
// 모두 실제로 접히는지 foldNet으로 확인한 것들이다.
// easy — 가로 4줄 위아래에 한 칸씩 붙은 십자 계열(위·아래 칸이 가까워 접기 쉽다)
// hard — 위·아래 칸이 멀리 떨어졌거나 계단 모양이라 머릿속에서 접기 어렵다
const RAW_NETS = {
  easy: [
    [[0, 0], [0, 1], [1, 1], [2, 1], [3, 1], [0, 2]],
    [[0, 0], [0, 1], [1, 1], [2, 1], [3, 1], [1, 2]],
    [[1, 0], [0, 1], [1, 1], [2, 1], [3, 1], [0, 2]],
    [[1, 0], [0, 1], [1, 1], [2, 1], [3, 1], [1, 2]],   // 십자형
    [[1, 0], [0, 1], [1, 1], [2, 1], [3, 1], [2, 2]],
    [[2, 0], [0, 1], [1, 1], [2, 1], [3, 1], [1, 2]],
    [[2, 0], [0, 1], [1, 1], [2, 1], [3, 1], [2, 2]],
    [[2, 0], [0, 1], [1, 1], [2, 1], [3, 1], [3, 2]],
    [[3, 0], [0, 1], [1, 1], [2, 1], [3, 1], [2, 2]],
    [[3, 0], [0, 1], [1, 1], [2, 1], [3, 1], [3, 2]],
  ],
  hard: [
    [[0, 0], [0, 1], [1, 1], [2, 1], [3, 1], [2, 2]],
    [[0, 0], [0, 1], [1, 1], [2, 1], [3, 1], [3, 2]],
    [[1, 0], [0, 1], [1, 1], [2, 1], [3, 1], [3, 2]],
    [[2, 0], [0, 1], [1, 1], [2, 1], [3, 1], [0, 2]],
    [[3, 0], [0, 1], [1, 1], [2, 1], [3, 1], [0, 2]],
    [[3, 0], [0, 1], [1, 1], [2, 1], [3, 1], [1, 2]],
    [[0, 0], [1, 0], [1, 1], [2, 1], [2, 2], [3, 2]],   // 계단형
    [[0, 0], [0, 1], [1, 1], [2, 1], [2, 2], [3, 2]],
    [[0, 0], [1, 0], [1, 1], [2, 1], [3, 1], [3, 2]],
    [[0, 0], [1, 0], [2, 0], [2, 1], [3, 1], [4, 1]],
  ],
};
const NETS = { easy: [], hard: [] };
for (const k of ["easy", "hard"]) {
  for (const cells of RAW_NETS[k]) {
    const dirs = foldNet(cells);
    if (dirs) NETS[k].push({ cells, dirs });
  }
}
if (!NETS.hard.length) NETS.hard = NETS.easy;

const FACE_NAMES = ["가", "나", "다", "라", "마", "바"];

// 마주 보는 면 = 방향 벡터가 정반대인 면
function oppositeOf(net, i) {
  return net.dirs.findIndex((d, j) => j !== i && key(d) === key(neg(net.dirs[i])));
}

// ---------------------------------------------------------------------------
// 문제 만들기 — 답은 언제나 한글 한 글자라, 학생은 카드를 하나만 치면 된다.
// ---------------------------------------------------------------------------
function genQuestion(level, net) {
  const all = [0, 1, 2, 3, 4, 5];
  if (level <= 2) {
    const a = randInt(0, 5);
    const answer = oppositeOf(net, a);
    return {
      marks: [a],
      answer,
      faces: shuffle(all.filter((i) => i !== a)),
      text: level === 1
        ? `⭐ '${FACE_NAMES[a]}' 면과 마주 보는 면은?`
        : `⭐ '${FACE_NAMES[a]}' 면과 이웃하지 않은 면은?`,
      hint: level === 1
        ? "접었을 때 서로 닿지 않고 정반대에 오는 면이에요"
        : "이웃하지 않은 면이 곧 마주 보는 면이에요",
      speed: level === 1 ? 15 : 22,
    };
  }
  // ⭐3 — 세 면이 한 꼭짓점에서 만나려면 셋이 서로 이웃해야 한다.
  // 'a'와 'b'를 주면 둘 다와 이웃한 면은 정확히 두 개(서로 마주 보는 짝)뿐이므로,
  // 그중 하나만 카드로 내놓아 정답이 하나가 되게 한다.
  for (let t = 0; t < 200; t++) {
    const a = randInt(0, 5);
    const oa = oppositeOf(net, a);
    const pool = all.filter((i) => i !== a && i !== oa);
    const b = pool[randInt(0, pool.length - 1)];
    const ob = oppositeOf(net, b);
    const both = all.filter((i) => i !== a && i !== oa && i !== b && i !== ob);
    if (both.length !== 2) continue;
    const answer = both[randInt(0, 1)];
    return {
      marks: [a, b],
      answer,
      faces: shuffle([answer, oa, ob, b]),
      text: `⭐ '${FACE_NAMES[a]}'·'${FACE_NAMES[b]}' 면과 한 꼭짓점에서 만나는 면은?`,
      hint: "세 면이 한 점에서 만나려면 셋 다 서로 이웃해야 해요",
      speed: 30,
    };
  }
  const a = randInt(0, 5);
  return {
    marks: [a], answer: oppositeOf(net, a), faces: shuffle(all.filter((i) => i !== a)),
    text: `⭐ '${FACE_NAMES[a]}' 면과 마주 보는 면은?`,
    hint: "접었을 때 정반대에 오는 면이에요", speed: 26,
  };
}

        : "정답 카드를 <b>클릭(터치)해서 잠깐 누르면</b> 펀치! 카드가 터져요.",

let state = "loading";
const holdFill = document.getElementById("holdFill");
const startGate = new StartGate(mode, holdFill);

let autoDiff, count, playEndAt;
let net, q, roundAt, resolving;
let cards = [];
let aimIdx = -1, aimSince = 0, lockUntil = 0;
let punch = null;            // 주먹이 꽂힌 자리 — 충격파와 파편을 그린다
let shards = [];             // 부서진 카드 조각
let confetti = [], sparks = [];
const shake = new ScreenShake();
let recorder, comboShot, fallbackShot, autoRec, recordedBlob = null;
const recIndicator = document.getElementById("recIndicator");
let cursors = [];
let lastFrameAt = 0;

const AIM_MS = 260;   // 이만큼 카드 위에 머무르면 펀치 — 지나가다 잘못 맞는 것을 막는다

// 카드를 겹치지 않게 늘어놓고, 각자 천천히 떠다닐 속도를 준다
function placeCards(faces) {
  const { w, h } = dims;
  const zx = w * 0.37, zy = h * 0.26, zw = w * 0.58, zh = h * 0.54;
  const r = Math.max(26, Math.min(w, h) * 0.085);
  const n = faces.length;
  const cols = n <= 3 ? n : Math.ceil(n / 2);
  const rows = Math.ceil(n / cols);
  const speed = q ? q.speed : 18;
  cards = faces.map((face, i) => {
    const c = i % cols, rr = Math.floor(i / cols);
    const ang = Math.random() * Math.PI * 2;
    return {
      face, r,
      x: zx + zw * ((c + 0.5) / cols),
      y: zy + zh * ((rr + 0.5) / rows),
      vx: Math.cos(ang) * speed,
      vy: Math.sin(ang) * speed,
      pop: 0, bad: 0, gone: false,
    };
  });
}

function updateCards(dt) {
  const { w, h } = dims;
  const zx = w * 0.35, zy = h * 0.24, zw = w * 0.62, zh = h * 0.58;
  for (const c of cards) {
    if (c.gone) continue;
    c.x += c.vx * dt; c.y += c.vy * dt;
    if (c.x < zx + c.r) { c.x = zx + c.r; c.vx = Math.abs(c.vx); }
    if (c.x > zx + zw - c.r) { c.x = zx + zw - c.r; c.vx = -Math.abs(c.vx); }
    if (c.y < zy + c.r) { c.y = zy + c.r; c.vy = Math.abs(c.vy); }
    if (c.y > zy + zh - c.r) { c.y = zy + zh - c.r; c.vy = -Math.abs(c.vy); }
    if (c.pop > 0) c.pop = Math.max(0, c.pop - dt * 2.4);
    if (c.bad > 0) { c.bad = Math.max(0, c.bad - dt * 2.0); c.vx *= 0.94; c.vy *= 0.94; }
  }

  // 카드끼리 겹치면 어느 것을 치는지 알 수 없다 — 서로 밀어내고 튕기게 한다
  for (let i = 0; i < cards.length; i++) {
    for (let j = i + 1; j < cards.length; j++) {
      const a = cards[i], b = cards[j];
      if (a.gone || b.gone) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy) || 0.001;
      const min = (a.r + b.r) * 1.15;
      if (d >= min) continue;
      const ux = dx / d, uy = dy / d;
      const push = (min - d) / 2;
      a.x -= ux * push; a.y -= uy * push;
      b.x += ux * push; b.y += uy * push;
      // 서로 다가오는 중일 때만 속도를 반사한다 (겹친 채 떠는 것을 막는다)
      const rel = (b.vx - a.vx) * ux + (b.vy - a.vy) * uy;
      if (rel < 0) {
        a.vx += rel * ux; a.vy += rel * uy;
        b.vx -= rel * ux; b.vy -= rel * uy;
      }
    }
  }
}

function newRound() {
  const pool = autoDiff.level === 1 ? NETS.easy : (autoDiff.level === 3 ? NETS.hard : NETS.easy.concat(NETS.hard));
  net = pool[Math.floor(Math.random() * pool.length)];
  q = genQuestion(autoDiff.level, net);
  placeCards(q.faces);
  resolving = false;
  aimIdx = -1;
  punch = null;
  shards = [];
  roundAt = performance.now();
}

function startCountdown() {
  state = "countdown";
  document.getElementById("countdownPanel").style.display = "flex";
  const numEl = document.getElementById("countNum");
  let n = 3;
  numEl.textContent = n;
  if (!isMuted()) sound.countBeep();
  const iv = setInterval(() => {
    n--;
    if (n <= 0) {
      clearInterval(iv);
      document.getElementById("countdownPanel").style.display = "none";
      if (!isMuted()) sound.go();
      beginPlay();
    } else {
      numEl.textContent = n;
      if (!isMuted()) sound.countBeep();
    }
  }, 700);
}

function beginPlay() {
  state = "playing";
  const prev = HighScore.get(UNIT);
  autoDiff = new AutoDifficulty(levelFromUrl(AutoDifficulty.startLevelFromHighScore(prev)));
  count = 0;
  party.reset();
  confetti = []; sparks = [];
  playEndAt = performance.now() + 60000;
  lastFrameAt = 0;
  lockUntil = 0;
  newRound();

  recorder = new ClipRecorder(canvas, sound, 24);
  recorder.prepare();
  comboShot = new ComboShot(canvas);
  fallbackShot = new ComboShot(canvas);
  autoRec = scheduleAutoRecording(recorder, {
    onStartVisual: () => {
      recIndicator.style.display = "flex";
      setTimeout(() => { if (!comboShot.captured) fallbackShot.capture(canvas); }, 1500);
    },
    onEndVisual: () => { recIndicator.style.display = "none"; },
    onDone: (blob) => { recordedBlob = blob; },
    fallbackMs: 8000,
  });
}

// 주먹이 꽂히는 순간 — 충격파, 파편, 번쩍임
function hitFx(card, ok) {
  punch = { x: card.x, y: card.y, r: card.r, at: performance.now(), ok };
  const color = LANE_COLORS[card.face % LANE_COLORS.length];
  const n = ok ? 10 : 5;
  for (let i = 0; i < n; i++) {
    const a = (Math.PI * 2 * i) / n + Math.random() * 0.5;
    const sp = (ok ? 260 : 150) * (0.6 + Math.random() * 0.7);
    shards.push({
      x: card.x, y: card.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 90,
      rot: Math.random() * Math.PI, spin: (Math.random() - 0.5) * 12,
      size: card.r * (0.30 + Math.random() * 0.26), color, life: 620, maxLife: 620,
    });
  }
}

function updateShards(dt) {
  for (const s of shards) {
    s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 900 * dt;
    s.rot += s.spin * dt; s.life -= dt * 1000;
  }
  shards = shards.filter((s) => s.life > 0);
}

function drawShards(ctx) {
  ctx.save();
  for (const s of shards) {
    const k = Math.max(0, s.life / s.maxLife);
    ctx.globalAlpha = k;
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.rot);
    ctx.fillStyle = s.color;
    ctx.strokeStyle = CUTE.ink;
    ctx.lineWidth = Math.max(1.5, s.size * 0.16);
    ctx.beginPath();
    ctx.rect(-s.size / 2, -s.size / 2, s.size, s.size);
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

// 충격파 링 + 방사선 + "쾅!"
function drawPunch(ctx, now) {
  if (!punch) return;
  const t = (now - punch.at) / 460;
  if (t >= 1) { punch = null; return; }
  const e = Math.max(0, Math.min(1, t));
  ctx.save();
  ctx.globalAlpha = (1 - e) * 0.9;

  // 충격파 링 두 겹
  [1, 0.62].forEach((k, i) => {
    ctx.beginPath();
    ctx.arc(punch.x, punch.y, punch.r * (0.6 + e * 2.4 * k), 0, Math.PI * 2);
    ctx.strokeStyle = punch.ok ? (i ? "#fff" : PARTY.gold) : CUTE.orangeDark;
    ctx.lineWidth = Math.max(3, punch.r * 0.22 * (1 - e));
    ctx.stroke();
  });

  // 방사선
  const lines = punch.ok ? 10 : 6;
  ctx.strokeStyle = punch.ok ? PARTY.gold : CUTE.orangeDark;
  ctx.lineWidth = Math.max(2.5, punch.r * 0.14 * (1 - e));
  ctx.lineCap = "round";
  for (let i = 0; i < lines; i++) {
    const a = (Math.PI * 2 * i) / lines;
    const r0 = punch.r * (0.7 + e * 1.5);
    const r1 = r0 + punch.r * 0.7 * (1 - e);
    ctx.beginPath();
    ctx.moveTo(punch.x + Math.cos(a) * r0, punch.y + Math.sin(a) * r0);
    ctx.lineTo(punch.x + Math.cos(a) * r1, punch.y + Math.sin(a) * r1);
    ctx.stroke();
  }
  ctx.restore();

  // 타격 글자 — 튀어나왔다가 사라진다
  if (e < 0.75) {
    const pop = 1 + Math.sin(Math.min(1, e / 0.35) * Math.PI * 0.5) * 0.5;
    ctx.save();
    ctx.globalAlpha = 1 - e / 0.75;
    drawChunkyText(ctx, punch.ok ? "쾅!" : "빗나감!", punch.x, punch.y - punch.r * 1.5,
      punch.r * (punch.ok ? 0.9 : 0.6) * pop, "#fff",
      { outline: punch.ok ? PARTY.gold : CUTE.orangeDark, outlineWidth: Math.max(4, punch.r * 0.2) });
    ctx.restore();
  }
}

function succeed(card) {
  resolving = true;
  count++;
  card.pop = 1;
  card.gone = true;
  hitFx(card, true);
  party.correct(card.x, card.y, { base: 11, elapsedMs: performance.now() - roundAt });
  if (party.combo > 0 && party.combo === party.maxCombo) comboShot.capture(canvas);
  autoDiff.reportCorrect();
  autoRec.trigger();
  shake.trigger(9, 220);
  if (!isMuted()) sound.shot();
  spawnSparkles(sparks, card.x, card.y, 30, ["#fff", PARTY.gold, CUTE.green, CUTE.green]);
  spawnSparkles(sparks, card.x - 40, card.y - 40, 10, [PARTY.gold, CUTE.green]);
  spawnSparkles(sparks, card.x + 40, card.y - 40, 10, [PARTY.gold, CUTE.green]);
  spawnSparkles(sparks, card.x - 40, card.y + 40, 10, [PARTY.gold, CUTE.green]);
  spawnSparkles(sparks, card.x + 40, card.y + 40, 10, [PARTY.gold, CUTE.green]);
  if (party.combo > 0 && party.combo % 5 === 0) {
    spawnConfetti(confetti, card.x, card.y, 44);
    if (!isMuted()) sound.fever();
  }
  setTimeout(() => { if (state === "playing") newRound(); }, 780);
}

// 틀린 카드는 튕겨 나가고 잠깐 다시 못 치게 한다 — 마구 휘둘러 찍는 것을 막는다
function missed(card) {
  card.bad = 1;
  hitFx(card, false);
  const ang = Math.random() * Math.PI * 2;
  card.vx = Math.cos(ang) * 170;
  card.vy = Math.sin(ang) * 170;
  party.wrong(card.x, card.y, "다시 봐요!");
  autoDiff.reportWrong();
  shake.trigger(6, 160);
  if (!isMuted()) sound.wrong();
  lockUntil = performance.now() + 550;
  aimIdx = -1;
}

function endGame() {
  state = "result";
  const { medal, label } = medalFor(count, MEDALS);
  const prev = HighScore.get(UNIT);
  const best = Math.max(count, prev ? prev.count : 0);
  if (!prev || count >= prev.count) {
    HighScore.set(UNIT, { count, bestLevel: autoDiff.level, label: `${medal} ${count}${RECORD_SUFFIX}`, at: Date.now() });
  }
  renderPodium({ unit: UNIT, medal, label, coins: party.coins, maxCombo: party.maxCombo, count, suffix: RECORD_SUFFIX, best });

  document.getElementById("statCount").textContent = count + "개";
  document.getElementById("statBest").textContent = best + "개";
  document.getElementById("statCombo").textContent = "🔥" + party.maxCombo;

  const shot = comboShot.captured ? comboShot : fallbackShot;
  const previewVideo = document.getElementById("previewVideo");
  const saveVideoBtn = document.getElementById("saveVideoBtn");
  if (recordedBlob) {
    previewVideo.src = URL.createObjectURL(recordedBlob);
    previewVideo.style.display = "block";
    saveVideoBtn.style.display = "inline-block";
  }
  document.getElementById("savePhotoBtn").onclick = async () => {
    const blob = await shot.toBlob((c, w, h) => drawPhotoOverlay(c, w, h, { title: TITLE, record: count + RECORD_SUFFIX, medal }));
    downloadBlob(blob, `수학체육올림픽5_전개도펀치_${formatFileTimestamp()}.png`);
  };
  document.getElementById("saveVideoBtn").onclick = () => {
    if (recordedBlob) downloadBlob(recordedBlob, `수학체육올림픽5_전개도펀치_${formatFileTimestamp()}.${recorder.extension}`);
  };
  document.getElementById("resultPanel").style.display = "flex";
  if (!isMuted()) sound.success();
}

document.getElementById("retryBtn").addEventListener("click", () => {
  document.getElementById("resultPanel").style.display = "none";
  document.getElementById("raisePanel").style.display = "flex";
  startGate.since = 0; startGate.ready = false; holdFill.style.width = "0%";
  state = "raise";
});

document.getElementById("raisePanel").addEventListener("click", () => {
  if (state === "raise" && mode !== "motion") goReady();
});

function goReady() {
  state = "ready";
  document.getElementById("raisePanel").style.display = "none";
  document.getElementById("readyPanel").style.display = "flex";
  if (!isMuted()) sound.click();
  setTimeout(() => {
    document.getElementById("readyPanel").style.display = "none";
    startCountdown();
  }, 500);
}

// ── 펀치 판정: 카드 위에 손을 잠깐 얹으면 친다 ──
function detectPunch(now) {
  if (resolving || now < lockUntil) { aimIdx = -1; return; }
  const p = cursors[0];
  if (!p) { aimIdx = -1; return; }
  let idx = -1;
  for (let i = 0; i < cards.length; i++) {
    const c = cards[i];
    if (c.gone || c.bad > 0.3) continue;
    if (Math.hypot(p.x - c.x, p.y - c.y) < c.r * 1.05) { idx = i; break; }
  }
  if (idx !== aimIdx) { aimIdx = idx; aimSince = now; return; }
  if (idx < 0 || now - aimSince < AIM_MS) return;
  const card = cards[idx];
  aimIdx = -1;
  if (card.face === q.answer) succeed(card);
  else missed(card);
}

// ── 전개도 (왼쪽 판) ──
function drawNet(ctx) {
  const { w, h } = dims;
  const px = w * 0.025, py = h * 0.30;
  const pw = w * 0.30, ph = h * 0.54;
  drawStickerRect(ctx, px + pw / 2, py + ph / 2, pw, ph, fluidPx(dims, 18, { min: 12, max: 26 }), CUTE.cream, {
    lineWidth: fluidPx(dims, 4.5, { min: 3, max: 6.5 }), drop: fluidPx(dims, 5, { min: 3.5, max: 8 }),
  });
  const cells = net.cells;
  const cols = Math.max(...cells.map((c) => c[0])) + 1;
  const rows = Math.max(...cells.map((c) => c[1])) + 1;
  const cell = Math.min((pw * 0.8) / cols, (ph * 0.62) / rows);
  const ox = px + pw / 2 - (cols * cell) / 2;
  const oy = py + ph * 0.55 - (rows * cell) / 2;
  drawChunkyText(ctx, "전개도", px + pw / 2, py + ph * 0.13,
    fluidPx(dims, 17, { min: 12, max: 23 }), CUTE.ink, { outline: CUTE.cream, outlineWidth: 3 });
  const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 320);
  cells.forEach(([c, r], i) => {
    const x = ox + c * cell + cell / 2;
    const y = oy + r * cell + cell / 2;
    const marked = q.marks.includes(i);
    drawStickerRect(ctx, x, y, cell * 0.94, cell * 0.94, cell * 0.16,
      marked ? PARTY.gold : LANE_COLORS[i % LANE_COLORS.length], {
        lineWidth: Math.max(2.2, cell * (marked ? 0.10 + pulse * 0.04 : 0.07)), drop: cell * 0.05,
      });
    drawChunkyText(ctx, FACE_NAMES[i], x, y, cell * 0.4, "#fff",
      { outline: CUTE.ink, outlineWidth: Math.max(2.5, cell * 0.09) });
    if (marked) {
      ctx.save();
      ctx.font = `${cell * 0.3}px sans-serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("⭐", x + cell * 0.32, y - cell * 0.32);
      ctx.restore();
    }
  });
}

// ── 떠다니는 한글 카드 ──
function drawCards(ctx, now) {
  for (let i = 0; i < cards.length; i++) {
    const c = cards[i];
    if (c.gone && c.pop <= 0) continue;
    ctx.save();
    let scale = 1;
    if (c.pop > 0) scale = 1 + (1 - c.pop) * 1.4;          // 터지며 커진다
    if (c.bad > 0) ctx.globalAlpha = 0.45 + c.bad * 0.3;
    const wob = Math.sin(now / 460 + i) * c.r * 0.05;      // 살짝 흔들리며 떠 있다
    ctx.globalAlpha *= c.pop > 0 ? c.pop : 1;
    const rr = c.r * scale;
    const color = c.bad > 0 ? CUTE.orangeDark : LANE_COLORS[c.face % LANE_COLORS.length];
    drawStickerRect(ctx, c.x, c.y + wob, rr * 1.7, rr * 1.7, rr * 0.34, color, {
      lineWidth: Math.max(3, rr * 0.11), drop: rr * 0.1,
    });
    drawChunkyText(ctx, FACE_NAMES[c.face], c.x, c.y + wob, rr * 0.86, "#fff",
      { outline: CUTE.ink, outlineWidth: Math.max(3, rr * 0.16) });

    // 조준 링 — 얼마나 더 있으면 펀치가 나가는지 보여 준다
    if (i === aimIdx && !c.gone) {
      const t = Math.min(1, (now - aimSince) / AIM_MS);
      ctx.beginPath();
      ctx.arc(c.x, c.y + wob, rr * 1.25, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * t);
      ctx.strokeStyle = PARTY.gold;
      ctx.lineWidth = Math.max(4, rr * 0.16);
      ctx.lineCap = "round";
      ctx.stroke();
    }
    ctx.restore();
  }
}

function loop(tsMs) {
  requestAnimationFrame(loop);
  if (mode === "motion" && video.readyState < 2) return;
  const { ctx, w, h } = dims;
  ctx.save();
  shake.apply(ctx);
  if (mode === "motion") drawMirroredVideo(ctx, video, w, h);
  else drawPartyBackdrop(ctx, dims);
  drawDrifters(ctx, drifters, dims, 1 / 60);
  drawBunting(ctx, dims);
  drawCrowd(ctx, dims, party.cheerUntil);

  let result = null;
  if (mode === "motion") {
    result = handTracker.detect(video, tsMs);
    if (state === "raise") {
      let raised = false;
      if (result && result.landmarks) for (const lm of result.landmarks) if (isHandRaised(lm)) raised = true;
      if (startGate.update(tsMs, raised)) goReady();
    }
  }
  cursors = getCursors(mode, result, w, h, video, pointerInput);

  if (state === "playing") stepGame();

  // 때린 직후에는 주먹이 잠깐 커진다 — 친 느낌을 손끝에서 확인시켜 준다
  const hitK = punch ? Math.max(0, 1 - (performance.now() - punch.at) / 220) : 0;
  const gsize = fluidPx(dims, 44, { min: 32, max: 62 }) * (1 + hitK * 0.45);
  for (const c of cursors) drawGloveCursor(ctx, c.x, c.y, gsize, { active: aimIdx >= 0 || hitK > 0 });
  ctx.restore();
}

function stepGame() {
  const { ctx, w, h } = dims;
  // 홀드·게이지는 프레임 수가 아니라 실제 흐른 시간으로 쌓아야 한다.
  // 느린 기기에서 프레임이 떨어지면 제한 시간만 실시간으로 흐르고 게이지는 안 차서 불리해진다.
  const dt = lastFrameAt ? Math.min(0.06, (performance.now() - lastFrameAt) / 1000) : 1 / 60;
  lastFrameAt = performance.now();
  const remain = Math.max(0, playEndAt - performance.now());
  if (remain <= 0) { endGame(); return; }
  const now = performance.now();

  updateCards(dt);
  updateShards(dt);
  if (now - roundAt > 400) detectPunch(now);

  drawNet(ctx);
  drawCards(ctx, now);
  drawShards(ctx);
  drawPunch(ctx, now);

  // 네모곰
  const br = fluidPx(dims, 23, { min: 17, max: 31 });
  drawMascot(ctx, w * 0.06, h * 0.90, br, CHAR, party.currentMood(remain));

  const hudBottom = party.drawHud(ctx, dims, { remainMs: remain, count, suffix: "개" });

  drawCuteBanner(ctx, dims, [
    { text: q.text.replace(/[<>]/g, ""), size: 24, chunky: true, color: PARTY.gold },
    { text: q.hint, size: 14, color: CUTE.ink },
  ], fluidPx, { top: hudBottom });

  drawChunkyText(ctx, mode === "motion" ? "정답 카드에 손을 올려요!" : "정답 카드를 눌러요!",
    w * 0.64, h * 0.94, fluidPx(dims, 16, { min: 12, max: 22 }), "#fff",
    { outline: CUTE.ink, outlineWidth: fluidPx(dims, 5, { min: 3.5, max: 7 }) });

  party.update(dt);
  confetti = updateConfetti(confetti, dt); drawConfetti(ctx, confetti);
  sparks = updateSparkles(sparks, dt); drawSparkles(ctx, sparks);
  party.drawFx(ctx, dims);
  party.drawFeverFrame(ctx, dims);

  drawVignette(ctx, w, h, 0.16);
  drawLevelStars(ctx, dims, autoDiff.level, fluidPx);
}

init();
</script>
