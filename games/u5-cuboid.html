<script type="module">
import {
  HighScore, requestWakeLock, SoundKit, FileAudioLoop,
  HandTracker, ClipRecorder, downloadBlob,
  drawMirroredVideo, fitCanvasToScreen, isHandRaised, getCursors,
  AutoDifficulty, levelFromUrl, medalFor,
  scheduleAutoRecording, ComboShot, drawPhotoOverlay,
  ScreenShake, InputMode, PointerInput, StartGate, SmoothedPoint,
  startCamera, formatFileTimestamp, fluidPx, showSoundHint,
  drawVignette, spawnConfetti, updateConfetti, drawConfetti,
} from "../js/engine.js?v=2";
import {
  CUTE, LANE_COLORS, bob, drawSticker, drawStickerRect, drawChunkyText,

} from "../js/cute.js?v=6";
import {

  showRuleCard, renderPodium, irisTransition,
} from "../js/party.js?v=2";
requestWakeLock();

const UNIT = "f5";
const TITLE = "상자 굴리기";
const RECORD_SUFFIX = "루 진루";
const MEDALS = { bronze: 5, silver: 9, gold: 14 };
const CHAR = CHARACTERS[UNIT];
const mode = InputMode.get();

const video = document.getElementById("video");
const canvas = document.getElementById("gameCanvas");
let dims = fitCanvasToScreen(canvas);
let drifters = makeDrifters(10, dims.w, dims.h);
window.addEventListener("resize", () => {
  dims = fitCanvasToScreen(canvas);
  drifters = makeDrifters(10, dims.w, dims.h);
});

const sound = new SoundKit();
const bgm = new FileAudioLoop("../assets/sounds/subbgm.mp3", 0.32);
const isMuted = () => localStorage.getItem("smo_muted") === "1";
const party = new Party({ unit: UNIT, sound, isMuted });

function goHome() { bgm.stop(); irisTransition(() => { location.href = "../index.html"; }); }
document.getElementById("homeBtn").addEventListener("click", goHome);
document.getElementById("homeBtn2").addEventListener("click", goHome);

function randInt(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }

// ---------------------------------------------------------------------------
// 전개도를 접어 각 칸이 입체의 어느 면이 되는지 계산한다.
// 종이 위를 굴러가는 주사위로 보고, 각 칸에서 "바닥에 닿는 면"의 3차원 방향을 따라간다.
// ---------------------------------------------------------------------------
const neg = (v) => [-v[0], -v[1], -v[2]];
const key = (v) => v.join(",");

function foldNet(cells) {
  const map = new Map(cells.map((c, i) => [`${c[0]},${c[1]}`, i]));
  const state = new Array(cells.length).fill(null);
  state[0] = { R: [1, 0, 0], U: [0, 1, 0], D: [0, 0, -1] };
  const queue = [0];
  while (queue.length) {
    const i = queue.shift();
    const [c, r] = cells[i];
    const s = state[i];
    const moves = [
      [[c + 1, r], { R: neg(s.D), U: s.U, D: s.R }],
      [[c - 1, r], { R: s.D, U: s.U, D: neg(s.R) }],
      [[c, r - 1], { R: s.R, U: neg(s.D), D: s.U }],
      [[c, r + 1], { R: s.R, U: s.D, D: neg(s.U) }],
    ];
    for (const [pos, ns] of moves) {
      const j = map.get(`${pos[0]},${pos[1]}`);
      if (j === undefined || state[j]) continue;
      state[j] = ns;
      queue.push(j);
    }
  }
  if (state.some((s) => !s)) return null;
  const dirs = state.map((s) => key(s.D));
  if (new Set(dirs).size !== 6) return null;
  return state.map((s) => s.D);
}

const RAW_NETS = {
  easy: [
    [[1, 0], [0, 1], [1, 1], [2, 1], [3, 1], [1, 2]],   // 십자형
    [[2, 0], [0, 1], [1, 1], [2, 1], [3, 1], [2, 2]],
    [[1, 0], [1, 1], [0, 2], [1, 2], [2, 2], [3, 2]],
  ],
  hard: [
    [[0, 0], [1, 0], [1, 1], [2, 1], [2, 2], [3, 2]],   // 계단형
    [[0, 0], [0, 1], [1, 1], [2, 1], [2, 2], [3, 2]],
    [[1, 0], [2, 0], [0, 1], [1, 1], [2, 1], [0, 2]],
    [[0, 0], [1, 0], [1, 1], [1, 2], [2, 2], [3, 2]],
  ],
};
const NETS = { easy: [], hard: [] };
for (const k of ["easy", "hard"]) {
  for (const cells of RAW_NETS[k]) {
    const dirs = foldNet(cells);
    if (dirs) NETS[k].push({ cells, dirs });
  }
}
if (!NETS.hard.length) NETS.hard = NETS.easy;

const FACE_NAMES = ["가", "나", "다", "라", "마", "바"];
const POS_LABEL = { top: "위", front: "앞", bottom: "바닥" };

// 전개도의 D벡터로 처음 자세를 정한다
const DIR_TO_POS = {
  "0,0,-1": "front", "0,0,1": "back",
  "0,1,0": "top", "0,-1,0": "bottom",
  "1,0,0": "right", "-1,0,0": "left",
};
function initialOrient(net) {
  const o = {};
  net.dirs.forEach((d, i) => { o[DIR_TO_POS[key(d)]] = i; });
  return o;
}

// 손을 휘두른 방향으로 90° 구른다
function roll(o, dir) {
  if (dir === "right") return { ...o, front: o.left, right: o.front, back: o.right, left: o.back };
  if (dir === "left") return { ...o, front: o.right, left: o.front, back: o.left, right: o.back };
  if (dir === "up") return { ...o, top: o.front, back: o.top, bottom: o.back, front: o.bottom };
  return { ...o, front: o.top, top: o.back, back: o.bottom, bottom: o.front };
}

function genGoal(level, net) {
  const n = net.cells.length;
  const star = randInt(0, n - 1);
  const opposite = net.dirs.findIndex((d, i) => i !== star && key(d) === key(neg(net.dirs[star])));
  if (level === 1) {
    return {
      star, goals: [{ pos: "top", face: star }],
      text: `⭐ ${FACE_NAMES[star]} 면이 <위>로 오게 굴려요`,
      hint: "손을 휘두르면 그 방향으로 상자가 굴러요",
    };
  }
  if (level === 2) {
    let second = randInt(0, n - 1);
    while (second === star || second === opposite) second = randInt(0, n - 1);
    return {
      star, goals: [{ pos: "front", face: star }, { pos: "top", face: second }],
      text: `⭐ ${FACE_NAMES[star]} 면은 <앞>, ${FACE_NAMES[second]} 면은 <위>로!`,
      hint: "두 조건을 동시에 맞춰야 해요",
    };
  }
  return {
    star, goals: [{ pos: "bottom", face: opposite }],
    text: `⭐ ${FACE_NAMES[star]} 면과 <마주 보는 면>을 바닥으로!`,
    hint: "마주 보는 면을 바닥에 놓으면 ⭐는 자연히 위로 와요",
  };
}

const handTracker = new HandTracker();
let pointerInput = null;

async function init() {
  if (!isMuted()) bgm.play(showSoundHint);
  if (mode === "motion") {
    try {
      await startCamera(video, { width: 640, height: 480 });
      if (!isMuted()) bgm.play(showSoundHint);
    } catch (e) {
      document.getElementById("loadingText").textContent = "⚠️ 카메라를 찾을 수 없어요. 카메라 권한을 확인해주세요.";
      return;
    }
    document.getElementById("loadingText").textContent = "AI 모델을 불러오는 중…";
    await handTracker.init(1);
  } else {
    pointerInput = new PointerInput(canvas);
  }
  document.getElementById("loadingPanel").style.display = "none";

  await showRuleCard({
    unit: UNIT,
    title: "상자 굴리기",
    lines: [
      mode === "motion"
        ? "손을 <b>좌·우·위·아래로 휘두르면</b> 상자가 그 방향으로 굴러요."
        : "화면을 <b>드래그(스와이프)</b>하면 상자가 그 방향으로 굴러요.",
      "화면에서 상자의 앞·위·오른쪽 세 면이 보여요. 조건에 맞는 <b>면을 제자리에</b> 놓아야 해요.",
      "각 면에 <b>색상과 글자(가, 나, 다, 라, 마, 바)</b>가 있어요. 둘 다 맞춰야 정답!",
      "성공하면 <b>1루씩 진루</b>하고, <b>4루를 돌면 홈인</b>이 됩니다!",
    ],
  });

  document.getElementById("raiseIcon").textContent = mode === "motion" ? "🙋" : "👆";
  document.getElementById("raiseText").textContent = mode === "motion" ? "손을 들어 주세요!" : "화면을 터치(클릭)하면 시작!";
  document.getElementById("raisePanel").style.display = "flex";
  state = "raise";
  requestAnimationFrame(loop);
}

let state = "loading";
const holdFill = document.getElementById("holdFill");
const startGate = new StartGate(mode, holdFill);

let autoDiff, count, playEndAt;
let net, orient, goal, roundAt, resolving, base = 0;
let rollAnim = null, lastRollAt = 0;
let trail = [];
const smooth = new SmoothedPoint(3);
let confetti = [], sparks = [];
const shake = new ScreenShake();
let recorder, comboShot, fallbackShot, autoRec, recordedBlob = null;
const recIndicator = document.getElementById("recIndicator");
let cursors = [];
let lastFrameAt = 0;

function newRound(keepBase) {
  const pool = autoDiff.level === 3 ? NETS.hard : NETS.easy;
  net = pool[Math.floor(Math.random() * pool.length)];
  orient = initialOrient(net);
  goal = genGoal(autoDiff.level, net);
  // 시작하자마자 정답이면 재미가 없으니 몇 번 굴려 흩어 놓는다
  const dirs = ["left", "right", "up", "down"];
  for (let i = 0; i < 5; i++) orient = roll(orient, dirs[randInt(0, 3)]);
  if (goalMet()) for (let i = 0; i < 3; i++) orient = roll(orient, dirs[randInt(0, 3)]);
  resolving = false;
  roundAt = performance.now();
  rollAnim = null; trail = []; smooth.reset();
  if (!keepBase) base = base;
}

function goalMet() { return goal.goals.every((g) => orient[g.pos] === g.face); }

function startCountdown() {
  state = "countdown";
  document.getElementById("countdownPanel").style.display = "flex";
  const numEl = document.getElementById("countNum");
  let n = 3;
  numEl.textContent = n;
  if (!isMuted()) sound.countBeep();
  const iv = setInterval(() => {
    n--;
    if (n <= 0) {
      clearInterval(iv);
      document.getElementById("countdownPanel").style.display = "none";
      if (!isMuted()) sound.go();
      beginPlay();
    } else {
      numEl.textContent = n;
      if (!isMuted()) sound.countBeep();
    }
  }, 700);
}

function beginPlay() {
  state = "playing";
  const prev = HighScore.get(UNIT);
  autoDiff = new AutoDifficulty(levelFromUrl(AutoDifficulty.startLevelFromHighScore(prev)));
  count = 0; base = 0;
  party.reset();
  confetti = []; sparks = [];
  playEndAt = performance.now() + 60000;
  lastFrameAt = 0;
  newRound();

  recorder = new ClipRecorder(canvas, sound, 24);
  recorder.prepare();
  comboShot = new ComboShot(canvas);
  fallbackShot = new ComboShot(canvas);
  autoRec = scheduleAutoRecording(recorder, {
    onStartVisual: () => {
      recIndicator.style.display = "flex";
      setTimeout(() => { if (!comboShot.captured) fallbackShot.capture(canvas); }, 1500);
    },
    onEndVisual: () => { recIndicator.style.display = "none"; },
    onDone: (blob) => { recordedBlob = blob; },
    fallbackMs: 8000,
  });
}

function succeed() {
  resolving = true;
  count++;
  base++;
  const { w, h } = dims;
  const cx = w * 0.62, cy = h * 0.55;
  party.correct(cx, cy, { base: 11, elapsedMs: performance.now() - roundAt });
  if (party.combo > 0 && party.combo === party.maxCombo) comboShot.capture(canvas);
  autoDiff.reportCorrect();
  autoRec.trigger();
  shake.trigger(8, 200);
  // 강화된 파티클 효과
  spawnSparkles(sparks, cx, cy, 32, ["#fff", PARTY.gold, CUTE.green, CUTE.green]);
  spawnSparkles(sparks, cx - 50, cy - 50, 12, [PARTY.gold, CUTE.green]);
  spawnSparkles(sparks, cx + 50, cy - 50, 12, [PARTY.gold, CUTE.green]);
  spawnSparkles(sparks, cx - 50, cy + 50, 12, [PARTY.gold, CUTE.green]);
  spawnSparkles(sparks, cx + 50, cy + 50, 12, [PARTY.gold, CUTE.green]);
  const homeRun = base >= 4;
  if (homeRun) {
    base = 0;
    spawnConfetti(confetti, cx, cy, 48);
    if (!isMuted()) sound.fever();
  }
  setTimeout(() => { if (state === "playing") newRound(true); }, homeRun ? 1300 : 850);
}

function endGame() {
  state = "result";
  const { medal, label } = medalFor(count, MEDALS);
  const prev = HighScore.get(UNIT);
  const best = Math.max(count, prev ? prev.count : 0);
  if (!prev || count >= prev.count) {
    HighScore.set(UNIT, { count, bestLevel: autoDiff.level, label: `${medal} ${count}${RECORD_SUFFIX}`, at: Date.now() });
  }
  renderPodium({ unit: UNIT, medal, label, coins: party.coins, maxCombo: party.maxCombo, count, suffix: RECORD_SUFFIX, best });

  document.getElementById("statCount").textContent = count + "루";
  document.getElementById("statBest").textContent = best + "루";
  document.getElementById("statCombo").textContent = "🔥" + party.maxCombo;

  const shot = comboShot.captured ? comboShot : fallbackShot;
  const previewVideo = document.getElementById("previewVideo");
  const saveVideoBtn = document.getElementById("saveVideoBtn");
  if (recordedBlob) {
    previewVideo.src = URL.createObjectURL(recordedBlob);
    previewVideo.style.display = "block";
    saveVideoBtn.style.display = "inline-block";
  }
  document.getElementById("savePhotoBtn").onclick = async () => {
    const blob = await shot.toBlob((c, w, h) => drawPhotoOverlay(c, w, h, { title: TITLE, record: count + RECORD_SUFFIX, medal }));
    downloadBlob(blob, `수학체육올림픽5_상자굴리기_${formatFileTimestamp()}.png`);
  };
  document.getElementById("saveVideoBtn").onclick = () => {
    if (recordedBlob) downloadBlob(recordedBlob, `수학체육올림픽5_상자굴리기_${formatFileTimestamp()}.${recorder.extension}`);
  };
  document.getElementById("resultPanel").style.display = "flex";
  if (!isMuted()) sound.success();
}

document.getElementById("retryBtn").addEventListener("click", () => {
  document.getElementById("resultPanel").style.display = "none";
  document.getElementById("raisePanel").style.display = "flex";
  startGate.since = 0; startGate.ready = false; holdFill.style.width = "0%";
  state = "raise";
});

document.getElementById("raisePanel").addEventListener("click", () => {
  if (state === "raise") goReady();
});

function goReady() {
  state = "ready";
  document.getElementById("raisePanel").style.display = "none";
  document.getElementById("readyPanel").style.display = "flex";
  if (!isMuted()) sound.click();
  setTimeout(() => {
    document.getElementById("readyPanel").style.display = "none";
    startCountdown();
  }, 500);
}

// ── 스와이프 감지: 짧은 시간 안에 한 방향으로 크게 움직이면 한 번 구른다 ──
function detectSwipe(now) {
  const active = mode === "motion"
    ? cursors.length > 0
    : (pointerInput && pointerInput.down && pointerInput.points.length > 0);
  if (!active) { trail = []; return; }
  const raw = mode === "motion" ? cursors[0] : pointerInput.points[0];
  const p = smooth.push(raw.x, raw.y);
  trail.push({ t: now, x: p.x, y: p.y });
  while (trail.length && now - trail[0].t > 220) trail.shift();
  if (trail.length < 3) return;
  if (now - lastRollAt < 420) return;               // 한 번 구른 뒤엔 잠깐 쉰다

  const o = trail[0];
  const dx = p.x - o.x, dy = p.y - o.y;
  const thX = dims.w * 0.085, thY = dims.h * 0.10;
  let dir = null;
  if (Math.abs(dx) > Math.abs(dy)) { if (Math.abs(dx) > thX) dir = dx > 0 ? "right" : "left"; }
  else if (Math.abs(dy) > thY) dir = dy > 0 ? "down" : "up";
  if (!dir) return;

  orient = roll(orient, dir);
  rollAnim = { dir, at: now };
  lastRollAt = now;
  trail = []; smooth.reset();
  if (!isMuted()) sound.pop();
  if (goalMet()) succeed();
}

// ── 겨냥도 그리기: 앞·위·오른쪽 세 면이 보인다 ──
function drawBox(ctx, cx, cy, size) {
  const W = size * 1.05, H = size * 0.85, D = size * 0.42;
  const ox = D * 0.62, oy = -D * 0.52;

  // 구르는 순간 살짝 눌렸다 펴진다
  let sx = 1, sy = 1;
  if (rollAnim) {
    const t = Math.min(1, (performance.now() - rollAnim.at) / 220);
    const k = Math.sin(Math.PI * t) * 0.16;
    if (rollAnim.dir === "left" || rollAnim.dir === "right") { sx = 1 - k; sy = 1 + k; }
    else { sx = 1 + k; sy = 1 - k; }
    if (t >= 1) rollAnim = null;
  }
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(sx, sy);
  ctx.translate(-cx, -cy);

  const x0 = cx - W / 2, y0 = cy + H / 2;
  const F = [[x0, y0], [x0 + W, y0], [x0 + W, y0 - H], [x0, y0 - H]];
  const B = F.map(([x, y]) => [x + ox, y + oy]);

  const faceFill = (i) => (i === goal.star ? PARTY.gold : LANE_COLORS[i % LANE_COLORS.length]);
  const poly = (pts, fill) => {
    ctx.beginPath();
    ctx.moveTo(...pts[0]);
    for (const p of pts.slice(1)) ctx.lineTo(...p);
    ctx.closePath();
    ctx.fillStyle = fill; ctx.fill();
    ctx.strokeStyle = CUTE.ink; ctx.lineWidth = Math.max(2.5, size * 0.035); ctx.stroke();
  };
  const label = (pts, i, scale = 1) => {
    const mx = pts.reduce((s, p) => s + p[0], 0) / pts.length;
    const my = pts.reduce((s, p) => s + p[1], 0) / pts.length;
    const fs = size * 0.34 * scale;
    drawChunkyText(ctx, FACE_NAMES[i], mx, my, fs, "#fff",
      { outline: CUTE.ink, outlineWidth: Math.max(3, fs * 0.2) });
    if (i === goal.star) {
      ctx.save();
      ctx.font = `${size * 0.26}px sans-serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("⭐", mx, my - size * 0.28);
      ctx.restore();
    }
  };

  // 오른쪽 → 위 → 앞 순으로 그려야 앞면이 위에 온다
  const right = [F[1], F[2], B[2], B[1]];
  const top = [F[3], F[2], B[2], B[3]];
  poly(right, faceFill(orient.right));
  poly(top, faceFill(orient.top));
  poly(F, faceFill(orient.front));
  label(right, orient.right, 0.62);   // 옆면은 좁으니 작게
  label(top, orient.top, 0.62);       // 윗면도 눌려 보이므로 작게
  label(F, orient.front);

  // 보이지 않는 모서리 (뒤쪽 왼쪽 아래 꼭짓점에 모인다)
  ctx.save();
  ctx.setLineDash([5, 4]);
  ctx.lineWidth = Math.max(1.8, size * 0.022);
  ctx.strokeStyle = "rgba(34,48,92,0.5)";
  ctx.beginPath();
  ctx.moveTo(...B[0]); ctx.lineTo(...B[1]);
  ctx.moveTo(...B[0]); ctx.lineTo(...B[3]);
  ctx.moveTo(...B[0]); ctx.lineTo(...F[0]);
  ctx.stroke();
  ctx.restore();
  ctx.restore();

  // 바닥에 있는 면은 보이지 않으므로 아래에 이름표로 알려 준다
  drawChunkyText(ctx, `바닥: ${FACE_NAMES[orient.bottom]}`, cx, cy + H / 2 + size * 0.42,
    size * 0.24, "#fff", { outline: CUTE.ink, outlineWidth: Math.max(3, size * 0.06) });
}

// ── 전개도 (왼쪽 판) ──
function drawNet(ctx) {
  const { w, h } = dims;
  const px = w * 0.025, py = h * 0.34;
  const pw = w * 0.30, ph = h * 0.50;
  drawStickerRect(ctx, px + pw / 2, py + ph / 2, pw, ph, fluidPx(dims, 18, { min: 12, max: 26 }), CUTE.cream, {
    lineWidth: fluidPx(dims, 4.5, { min: 3, max: 6.5 }), drop: fluidPx(dims, 5, { min: 3.5, max: 8 }),
  });
  const cells = net.cells;
  const cols = Math.max(...cells.map((c) => c[0])) + 1;
  const rows = Math.max(...cells.map((c) => c[1])) + 1;
  const cell = Math.min((pw * 0.8) / cols, (ph * 0.62) / rows);
  const ox = px + pw / 2 - (cols * cell) / 2;
  const oy = py + ph * 0.55 - (rows * cell) / 2;
  drawChunkyText(ctx, "전개도", px + pw / 2, py + ph * 0.13,
    fluidPx(dims, 17, { min: 12, max: 23 }), CUTE.ink, { outline: CUTE.cream, outlineWidth: 3 });
  cells.forEach(([c, r], i) => {
    const x = ox + c * cell + cell / 2;
    const y = oy + r * cell + cell / 2;
    const isStar = i === goal.star;
    drawStickerRect(ctx, x, y, cell * 0.94, cell * 0.94, cell * 0.16,
      isStar ? PARTY.gold : LANE_COLORS[i % LANE_COLORS.length], {
        lineWidth: Math.max(2.2, cell * 0.07), drop: cell * 0.05,
      });
    drawChunkyText(ctx, FACE_NAMES[i], x, y, cell * 0.4, "#fff",
      { outline: CUTE.ink, outlineWidth: Math.max(2.5, cell * 0.09) });
    if (isStar) {
      ctx.save();
      ctx.font = `${cell * 0.3}px sans-serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("⭐", x + cell * 0.3, y - cell * 0.3);
      ctx.restore();
    }
  });
}

function loop(tsMs) {
  requestAnimationFrame(loop);
  if (mode === "motion" && video.readyState < 2) return;
  const { ctx, w, h } = dims;
  ctx.save();
  shake.apply(ctx);
  if (mode === "motion") drawMirroredVideo(ctx, video, w, h);
  else drawPartyBackdrop(ctx, dims);
  drawDrifters(ctx, drifters, dims, 1 / 60);
  drawBunting(ctx, dims);
  drawCrowd(ctx, dims, party.cheerUntil);

  let result = null;
  if (mode === "motion") {
    result = handTracker.detect(video, tsMs);
    if (state === "raise") {
      let raised = false;
      if (result && result.landmarks) for (const lm of result.landmarks) if (isHandRaised(lm)) raised = true;
      if (startGate.update(tsMs, raised)) goReady();
    }
  }
  cursors = getCursors(mode, result, w, h, video, pointerInput);

  if (state === "playing") stepGame();

  for (const c of cursors) drawGloveCursor(ctx, c.x, c.y, fluidPx(dims, 44, { min: 32, max: 62 }), { active: !!rollAnim });
  ctx.restore();
}

function stepGame() {
  const { ctx, w, h } = dims;
  // 홀드·게이지는 프레임 수가 아니라 실제 흐른 시간으로 쌓아야 한다.
  // 느린 기기에서 프레임이 떨어지면 제한 시간만 실시간으로 흐르고 게이지는 안 차서 불리해진다.
  const dt = lastFrameAt ? Math.min(0.06, (performance.now() - lastFrameAt) / 1000) : 1 / 60;
  lastFrameAt = performance.now();
  const remain = Math.max(0, playEndAt - performance.now());
  if (remain <= 0) { endGame(); return; }
  const now = performance.now();

  if (!resolving && now - roundAt > 600) detectSwipe(now);

  drawNet(ctx);

  // 다이아몬드 진루 표시
  const dx = w * 0.88, dy = h * 0.42, dr = Math.min(w * 0.055, h * 0.09);
  const pts = [[dx, dy + dr], [dx + dr, dy], [dx, dy - dr], [dx - dr, dy]];  // 홈,1,2,3
  ctx.save();
  ctx.strokeStyle = "rgba(255,255,255,0.85)";
  ctx.lineWidth = fluidPx(dims, 3, { min: 2, max: 4.5 });
  ctx.beginPath();
  pts.forEach((p, i) => (i === 0 ? ctx.moveTo(...p) : ctx.lineTo(...p)));
  ctx.closePath(); ctx.stroke();
  ctx.restore();
  pts.forEach((p, i) => {
    const reached = i > 0 && i <= base;
    drawSticker(ctx, p[0], p[1], dr * 0.28, reached ? PARTY.gold : CUTE.cream, { lineWidth: 2.5 });
  });
  drawChunkyText(ctx, `${base}루`, dx, dy + dr * 1.9, fluidPx(dims, 15, { min: 11, max: 20 }), "#fff",
    { outline: CUTE.ink, outlineWidth: 4 });

  // 상자
  const size = Math.min(w * 0.17, h * 0.26);
  drawBox(ctx, w * 0.60, h * 0.58, size);

  // 네모곰
  const br = fluidPx(dims, 23, { min: 17, max: 31 });
  drawMascot(ctx, w * 0.88, h * 0.72, br, CHAR, party.currentMood(remain));

  // 조작 안내 — 상자 아래 "바닥: X" 이름표보다 더 아래에 둔다
  drawChunkyText(ctx, mode === "motion" ? "손을 휙 휘둘러 굴려요!" : "드래그해서 굴려요!",
    w * 0.60, h * 0.90, fluidPx(dims, 16, { min: 12, max: 22 }), "#fff",
    { outline: CUTE.ink, outlineWidth: fluidPx(dims, 5, { min: 3.5, max: 7 }) });

  // 목표 진행도 표시
  const metCount = goal.goals.filter((g) => orient[g.pos] === g.face).length;
  const totalCount = goal.goals.length;
  let progressText = goal.text.replace(/[<>]/g, "");
  if (totalCount > 1) progressText += ` (${metCount}/${totalCount})`;

  const hudBottom = party.drawHud(ctx, dims, { remainMs: remain, count, suffix: "루" });

  // 진행도에 따라 색상 변경
  let progressColor = PARTY.gold;
  if (metCount === totalCount) progressColor = CUTE.green;
  else if (metCount > 0) progressColor = "#ffd700";

  drawCuteBanner(ctx, dims, [
    { text: progressText, size: 24, chunky: true, color: progressColor },
    { text: goal.hint, size: 14, color: CUTE.ink },
  ], fluidPx, { top: hudBottom });

  party.update(dt);
  confetti = updateConfetti(confetti, dt); drawConfetti(ctx, confetti);
  sparks = updateSparkles(sparks, dt); drawSparkles(ctx, sparks);
  party.drawFx(ctx, dims);
  party.drawFeverFrame(ctx, dims);

  drawVignette(ctx, w, h, 0.16);
  drawLevelStars(ctx, dims, autoDiff.level, fluidPx);
}

init();
</script>
