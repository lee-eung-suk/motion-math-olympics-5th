<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>소수 멀리뛰기 · 종목 4</title>
<link rel="stylesheet" href="../css/style.css?v=8">
</head>
<body>

<div class="game-stage">
  <video id="video" playsinline muted style="display:none"></video>
  <canvas id="gameCanvas"></canvas>

  <div class="hud">
    <div class="rec" id="recIndicator" style="display:none"><span class="dot"></span>REC</div>
    <button class="home-btn" id="homeBtn">🏠</button>
  </div>

  <div class="overlay-panel" id="loadingPanel">
    <h2>🏃 소수 멀리뛰기</h2>
    <p id="loadingText">준비 중…</p>
  </div>

  <div class="overlay-panel" id="rulePanel" style="display:none">
    <div class="rule-card">
      <div class="rule-head">
        <div class="rule-char">🏃</div>
        <div>
          <div class="rule-name"></div>
          <h2 class="rule-title">소수 멀리뛰기</h2>
        </div>
      </div>
      <p class="rule-cheer"></p>
      <ul class="rule-list"></ul>
      <div class="rule-timer"><div class="rule-timer-fill"></div></div>
      <button class="rule-go">좋아, 시작!</button>
    </div>
  </div>

  <div class="overlay-panel" id="raisePanel" style="display:none">
    <div class="raise-icon" id="raiseIcon">🙋</div>
    <h2 id="raiseText">손을 들어 주세요!</h2>
    <div class="hold-bar"><div class="hold-fill" id="holdFill"></div></div>
  </div>

  <div class="overlay-panel ready-flash" id="readyPanel" style="display:none">
    <h2>✋ 좋아요! 준비됐어요</h2>
  </div>

  <div class="overlay-panel" id="countdownPanel" style="display:none">
    <div class="countdown-num" id="countNum">3</div>
  </div>

  <div class="overlay-panel" id="resultPanel" style="display:none">
    <div id="podium"></div>
    <div class="result-stats">
      <div class="stat-box"><div class="num" id="statCount">0번</div><div class="label">성공한 도약</div></div>
      <div class="stat-box"><div class="num" id="statBest">0번</div><div class="label">최고 기록</div></div>
      <div class="stat-box"><div class="num" id="statCombo">0</div><div class="label">최고 콤보</div></div>
    </div>
    <video class="preview" id="previewVideo" controls playsinline style="display:none"></video>
    <div class="action-row">
      <button class="ghost-btn" id="savePhotoBtn">📸 사진</button>
      <button class="ghost-btn" id="saveVideoBtn" style="display:none">🎬 3초 영상</button>
      <button class="big-btn" id="retryBtn">🔁 한 번 더</button>
      <button class="ghost-btn" id="homeBtn2">🏠 종목 선택</button>
    </div>
  </div>
</div>

<script type="module">
import {
  HighScore, requestWakeLock, SoundKit, FileAudioLoop,
  ClipRecorder, downloadBlob,
  drawMirroredVideo, fitCanvasToScreen, getCursors,
  PoseTracker, PoseMotion, posePoints, poseVisible, isArmRaised, POSE, toMirroredCanvas,
  AutoDifficulty, levelFromUrl, medalFor,
  scheduleAutoRecording, ComboShot, drawPhotoOverlay,
  ScreenShake, InputMode, PointerInput, StartGate,
  startCamera, formatFileTimestamp, fluidPx, showSoundHint,
  drawVignette, spawnConfetti, updateConfetti, drawConfetti,
} from "../js/engine.js?v=4";
import {
  CUTE, LANE_COLORS, bob, drawSticker, drawStickerRect, drawChunkyText,
  spawnSparkles, updateSparkles, drawSparkles, makeDrifters, drawDrifters,
  drawBunting, drawGloveCursor, drawLevelStars, drawCuteBanner,
} from "../js/cute.js?v=7";
import {
  PARTY, CHARACTERS, Party, drawPartyBackdrop, drawCrowd, drawAthlete as drawPlayer,
  showRuleCard, renderPodium, irisTransition,
} from "../js/party.js?v=2";
requestWakeLock();

const UNIT = "f4";
const TITLE = "소수 멀리뛰기";
const RECORD_SUFFIX = "번 성공";
const MEDALS = { bronze: 5, silver: 9, gold: 14 };
const CHAR = CHARACTERS[UNIT];
const mode = InputMode.get();

const video = document.getElementById("video");
const canvas = document.getElementById("gameCanvas");
let dims = fitCanvasToScreen(canvas);
let drifters = makeDrifters(10, dims.w, dims.h);
window.addEventListener("resize", () => {
  dims = fitCanvasToScreen(canvas);
  drifters = makeDrifters(10, dims.w, dims.h);

});

const sound = new SoundKit();
const bgm = new FileAudioLoop("../assets/sounds/subbgm.mp3", 0.32);
const isMuted = () => localStorage.getItem("smo_muted") === "1";
const party = new Party({ unit: UNIT, sound, isMuted });

function goHome() { bgm.stop(); irisTransition(() => { location.href = "../index.html"; }); }
document.getElementById("homeBtn").addEventListener("click", goHome);
document.getElementById("homeBtn2").addEventListener("click", goHome);

function randInt(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// 0.60 → "0.6", 1.00 → "1" 처럼 교과서에서 쓰는 모양으로 다듬는다
function fmt(v) {
  let s = (Math.round(v * 1000) / 1000).toFixed(2);
  if (s.includes(".")) s = s.replace(/0+$/, "").replace(/\.$/, "");
  return s;
}

// ---------------------------------------------------------------------------
// 문제 만들기 — 소수의 곱셈에서 학생이 가장 많이 틀리는 곳은 "소수점의 자리"다.
// 그래서 오답 보기를 소수점만 어긋난 수로 깔아 둔다.
// 부동소수점 오차를 피하려고 정수로 곱한 뒤 마지막에만 나눈다.
// ---------------------------------------------------------------------------
// 뛸 수 있는 거리 범위 — 답이 이 안에 들어오도록 문제를 만든다
const MIND = 0.5, MAXD = 3.0;

function genRound(level) {
  for (let t = 0; t < 400; t++) {
    let ai, bi, scale, aText, bText;
    if (level === 1) {
      // (소수 한 자리) × (자연수)
      ai = randInt(2, 9); bi = randInt(2, 9); scale = 10;
      aText = fmt(ai / 10); bText = String(bi);
    } else if (level === 2) {
      // (소수 한 자리) × (소수 한 자리)
      ai = randInt(2, 9); bi = randInt(11, 39); scale = 100;
      aText = fmt(ai / 10); bText = fmt(bi / 10);
    } else {
      ai = randInt(12, 28); bi = randInt(11, 25); scale = 100;
      aText = fmt(ai / 10); bText = fmt(bi / 10);
    }
    const answer = (ai * bi) / scale;
    if (answer < MIND || answer > MAXD) continue;
    // 눈금에 적히는 수와 실제 값이 어긋나지 않게, 두 자리로 적어도 그대로 되읽히는 답만 쓴다
    if (Math.abs(parseFloat(fmt(answer)) - answer) > 1e-9) continue;
    return {
      aText, bText, answer,
      question: `${aText} × ${bText} = ?`,
      hint: level === 1
        ? "소수점 아래 자리 수를 세어 곱의 소수점을 찍어요"
        : "두 수의 소수점 아래 자리 수를 더한 만큼 곱에도 찍어요",
      // 허용 오차는 답에 비례 — 큰 수일수록 구역도 넓어져 체감 난이도가 일정하다
      tol: answer * (level === 1 ? 0.15 : level === 2 ? 0.13 : 0.11),
    };
  }
  return { aText: "0.5", bText: "4", answer: 2, question: "0.5 × 4 = ?",
           hint: "소수점 아래 자리 수를 세어 곱의 소수점을 찍어요", tol: 0.3 };
}

const poseTracker = new PoseTracker();
const motion = new PoseMotion();
let pointerInput = null;

async function init() {
  if (!isMuted()) bgm.play(showSoundHint);
  if (mode === "motion") {
    try {
      await startCamera(video, { width: 640, height: 480 });
      if (!isMuted()) bgm.play(showSoundHint);
    } catch (e) {
      document.getElementById("loadingText").textContent = "⚠️ 카메라를 찾을 수 없어요. 카메라 권한을 확인해주세요.";
      return;
    }
    document.getElementById("loadingText").textContent = "전신 인식 모델을 불러오는 중…";
    await poseTracker.init();
  } else {
    pointerInput = new PointerInput(canvas);
  }
  document.getElementById("loadingPanel").style.display = "none";

  await showRuleCard({
    unit: UNIT,
    title: "소수 멀리뛰기",
    lines: [
      "위에 <b>소수의 곱셈</b> 문제가 나와요. 답을 계산해요.",
      mode === "motion"
        ? "<b>무릎을 굽혀 웅크릴수록</b> 멀리 뛰어요. 지금 뛰면 닿을 자리가 <b>금색 눈금</b>으로 보여요."
        : "모래밭 위에서 <b>좌우로 움직여</b> 뛸 거리를 맞춰요.",
      mode === "motion"
        ? "계산한 거리에 맞췄으면 <b>힘껏 점프!</b> 보기는 없어요 — <b>뛴 거리가 곧 답</b>이에요."
        : "거리를 맞췄으면 <b>화면을 눌러</b> 도약!",
      "맞으면 선수가 <b>멋지게 착지</b>하고 심판이 깃발을 들어요.",
      "오답 매트는 <b>소수점만 살짝 어긋난 수</b>예요. 자리 수를 잘 세어 보세요!",
    ],
  });

  document.getElementById("raiseIcon").textContent = mode === "motion" ? "🙋" : "👆";
  document.getElementById("raiseText").textContent = mode === "motion" ? "손을 들어 주세요!" : "화면을 터치(클릭)하면 시작!";
  document.getElementById("raisePanel").style.display = "flex";
  state = "raise";
  requestAnimationFrame(loop);
}

let state = "loading";
const holdFill = document.getElementById("holdFill");
const startGate = new StartGate(mode, holdFill);

let autoDiff, count, playEndAt;
let round = null, roundAt, resolving;
let lockUntil = 0;
let poseLm = null;        // 이번 프레임의 전신 랜드마크
let power = 0;            // 0~1 — 웅크린 깊이. 이게 곧 뛸 거리가 된다
let standY = null;        // 똑바로 섰을 때의 어깨 높이(기준선)
let landed = null;        // 이번에 착지한 거리
let jumpPower = 1;        // 도약 연출용 배율
let crouch = 0;
let jump = null, flag = 0;
let confetti = [], sparks = [];
const shake = new ScreenShake();
let recorder, comboShot, fallbackShot, autoRec, recordedBlob = null;
const recIndicator = document.getElementById("recIndicator");
let cursors = [];
let lastFrameAt = 0;

// 어깨 너비의 이만큼 솟구치면 "뛰었다"고 본다. 서서 점프하면 어깨가, 앉아서 하면 두 팔이 솟는다.
const JUMP_POWER = 0.17;
// 어깨가 이만큼(어깨 너비 대비) 내려가면 최대 파워 — 깊게 앉을수록 멀리 뛴다
const CROUCH_FULL = 0.55;

// 모래밭 영역 — 눈금자가 이 위에 깔린다
function pit() {
  const { w, h } = dims;
  return { x: w * 0.26, y: h * 0.62, w: w * 0.70, h: h * 0.24 };
}
// 거리(m) → 화면 x
function dToX(d) {
  const p = pit();
  return p.x + (Math.max(0, Math.min(MAXD, d)) / MAXD) * p.w;
}
// 지금 웅크린 깊이로 예상되는 착지 거리
function predicted() { return MIND + power * (MAXD - MIND); }

function newRound() {
  round = genRound(autoDiff.level);
  resolving = false;
  jump = null;
  flag = 0;
  jumpPower = 1;
  crouch = 0;
  power = 0;
  landed = null;
  standY = null;
  motion.reset();
  roundAt = performance.now();
}

function startCountdown() {
  state = "countdown";
  document.getElementById("countdownPanel").style.display = "flex";
  const numEl = document.getElementById("countNum");
  let n = 3;
  numEl.textContent = n;
  if (!isMuted()) sound.countBeep();
  const iv = setInterval(() => {
    n--;
    if (n <= 0) {
      clearInterval(iv);
      document.getElementById("countdownPanel").style.display = "none";
      if (!isMuted()) sound.go();
      beginPlay();
    } else {
      numEl.textContent = n;
      if (!isMuted()) sound.countBeep();
    }
  }, 700);
}

function beginPlay() {
  state = "playing";
  const prev = HighScore.get(UNIT);
  autoDiff = new AutoDifficulty(levelFromUrl(AutoDifficulty.startLevelFromHighScore(prev)));
  count = 0;
  party.reset();
  confetti = []; sparks = [];
  playEndAt = performance.now() + 60000;
  lastFrameAt = 0;
  lockUntil = 0;
  newRound();

  recorder = new ClipRecorder(canvas, sound, 24);
  recorder.prepare();
  comboShot = new ComboShot(canvas);
  fallbackShot = new ComboShot(canvas);
  autoRec = scheduleAutoRecording(recorder, {
    onStartVisual: () => {
      recIndicator.style.display = "flex";
      setTimeout(() => { if (!comboShot.captured) fallbackShot.capture(canvas); }, 1500);
    },
    onEndVisual: () => { recIndicator.style.display = "none"; },
    onDone: (blob) => { recordedBlob = blob; },
    fallbackMs: 8000,
  });
}

// 도움닫기 → 도약 — 고른 매트로 선수가 포물선을 그리며 날아간다
function launch(ok) {
  const { w, h } = dims;
  const pt = pit();
  jump = { fromX: dToX(0), fromY: pt.y - pt.h * 0.1, toX: dToX(landed), toY: pt.y + pt.h * 0.42,
           at: performance.now(), ok, power: jumpPower };
  if (!isMuted()) sound.swoosh();
}

function succeed() {
  resolving = true;
  count++;
  const pt = pit(); const lx = dToX(landed), ly = pt.y + pt.h * 0.42;
  launch(true);
  autoDiff.reportCorrect();
  autoRec.trigger();
  setTimeout(() => {
    if (state !== "playing") return;
    party.correct(lx, ly, { base: 11, elapsedMs: performance.now() - roundAt });
    if (party.combo > 0 && party.combo === party.maxCombo) comboShot.capture(canvas);
    shake.trigger(9, 220);
    flag = 1;
    if (!isMuted()) sound.hit("perfect");
    // 모래가 튀어 오른다
    spawnSparkles(sparks, lx, ly, 26, ["#f2e3b8", "#e8d49a", "#fff"]);
    spawnSparkles(sparks, lx - 45, ly - 10, 12, ["#f2e3b8", PARTY.gold]);
    spawnSparkles(sparks, lx + 45, ly - 10, 12, ["#f2e3b8", PARTY.gold]);
    if (party.combo > 0 && party.combo % 5 === 0) {
      spawnConfetti(confetti, lx, ly - 60, 44);
      if (!isMuted()) sound.fever();
    }
  }, 620);
  setTimeout(() => { if (state === "playing") newRound(); }, 1450);
}

function missed() {
  resolving = true;
  const pt = pit(); const lx = dToX(landed), ly = pt.y + pt.h * 0.42;
  launch(false);
  autoDiff.reportWrong();
  lockUntil = performance.now() + 1400;
  setTimeout(() => {
    if (state !== "playing") return;
    party.wrong(lx, ly, "자리 수를 세어 봐요!");
    shake.trigger(6, 170);
    flag = -1;
    if (!isMuted()) sound.wrong();
    spawnSparkles(sparks, lx, ly, 14, ["#f2e3b8", CUTE.orangeDark]);
  }, 620);
  setTimeout(() => { if (state === "playing") newRound(); }, 1450);
}

function endGame() {
  state = "result";
  const { medal, label } = medalFor(count, MEDALS);
  const prev = HighScore.get(UNIT);
  const best = Math.max(count, prev ? prev.count : 0);
  if (!prev || count >= prev.count) {
    HighScore.set(UNIT, { count, bestLevel: autoDiff.level, label: `${medal} ${count}${RECORD_SUFFIX}`, at: Date.now() });
  }
  renderPodium({ unit: UNIT, medal, label, coins: party.coins, maxCombo: party.maxCombo, count, suffix: RECORD_SUFFIX, best });

  document.getElementById("statCount").textContent = count + "번";
  document.getElementById("statBest").textContent = best + "번";
  document.getElementById("statCombo").textContent = "🔥" + party.maxCombo;

  const shot = comboShot.captured ? comboShot : fallbackShot;
  const previewVideo = document.getElementById("previewVideo");
  const saveVideoBtn = document.getElementById("saveVideoBtn");
  if (recordedBlob) {
    previewVideo.src = URL.createObjectURL(recordedBlob);
    previewVideo.style.display = "block";
    saveVideoBtn.style.display = "inline-block";
  }
  document.getElementById("savePhotoBtn").onclick = async () => {
    const blob = await shot.toBlob((c, w, h) => drawPhotoOverlay(c, w, h, { title: TITLE, record: count + RECORD_SUFFIX, medal }));
    downloadBlob(blob, `수학체육올림픽5_소수멀리뛰기_${formatFileTimestamp()}.png`);
  };
  document.getElementById("saveVideoBtn").onclick = () => {
    if (recordedBlob) downloadBlob(recordedBlob, `수학체육올림픽5_소수멀리뛰기_${formatFileTimestamp()}.${recorder.extension}`);
  };
  document.getElementById("resultPanel").style.display = "flex";
  if (!isMuted()) sound.success();
}

document.getElementById("retryBtn").addEventListener("click", () => {
  document.getElementById("resultPanel").style.display = "none";
  document.getElementById("raisePanel").style.display = "flex";
  startGate.since = 0; startGate.ready = false; holdFill.style.width = "0%";
  state = "raise";
});

document.getElementById("raisePanel").addEventListener("click", () => {
  if (state === "raise" && mode !== "motion") goReady();
});

function goReady() {
  state = "ready";
  document.getElementById("raisePanel").style.display = "none";
  document.getElementById("readyPanel").style.display = "flex";
  if (!isMuted()) sound.click();
  setTimeout(() => {
    document.getElementById("readyPanel").style.display = "none";
    startCountdown();
  }, 500);
}

// ── 조준: 웅크린 깊이가 곧 뛸 거리 ─────────────────────────────────────────
// 보기 중에서 고르는 게 아니라, 몸을 얼마나 낮추느냐가 그대로 답이 된다.
function updatePower() {
  if (resolving) return;
  if (mode !== "motion") {
    // 터치·마우스: 모래밭 위 좌우 위치가 곧 거리
    const p = cursors[0];
    if (p) {
      const pt = pit();
      power = Math.max(0, Math.min(1, ((p.x - pt.x) / pt.w * MAXD - MIND) / (MAXD - MIND)));
    }
    return;
  }
  const f = motion.last;
  if (!f) return;
  // 처음 몇 프레임의 어깨 높이를 "똑바로 선 상태"로 삼는다
  if (standY === null) { standY = f.sc.y; return; }
  standY = Math.min(standY, f.sc.y);                 // 더 높이 선 적이 있으면 그쪽을 기준으로
  const drop = (f.sc.y - standY) / f.unit;           // 어깨가 내려간 정도 (어깨 너비 단위)
  power = Math.max(0, Math.min(1, drop / CROUCH_FULL));
  crouch = power;
}

// ── 도약: 웅크렸다가 솟구치면 그 세기로 날아간다 ──
function detectJump(now) {
  if (resolving || now < lockUntil) return;
  if (mode !== "motion") {
    if (pointerInput && pointerInput.consumeJustDown()) leap(1);
    return;
  }
  const j = motion.jump();
  if (j && j.power > JUMP_POWER) leap(j.power / JUMP_POWER);
}

function leap(boost) {
  const dist = predicted();
  landed = Math.round(dist * 100) / 100;
  jumpPower = Math.max(1, Math.min(2.2, boost));
  motion.reset();
  crouch = 0;
  if (Math.abs(landed - round.answer) <= round.tol) succeed();
  else missed();
}

// ── 도움닫기 트랙과 모래밭 ──
function drawField(ctx) {
  const { w, h } = dims;
  const p = pit();

  ctx.save();
  ctx.fillStyle = "#c96f4a";
  ctx.fillRect(0, h * 0.70, p.x, h * 0.10);
  ctx.strokeStyle = "rgba(255,255,255,0.7)";
  ctx.lineWidth = fluidPx(dims, 2.5, { min: 2, max: 4 });
  ctx.setLineDash([12, 10]);
  ctx.beginPath();
  ctx.moveTo(0, h * 0.75); ctx.lineTo(p.x, h * 0.75);
  ctx.stroke();
  ctx.setLineDash([]);
  // 발구름판
  ctx.fillStyle = "#f7f3e6";
  ctx.fillRect(p.x - w * 0.035, h * 0.70, w * 0.035, h * 0.10);
  ctx.restore();

  // 모래밭
  drawStickerRect(ctx, p.x + p.w / 2, p.y + p.h / 2, p.w, p.h,
    fluidPx(dims, 14, { min: 10, max: 20 }), "#f0e0b6",
    { lineWidth: fluidPx(dims, 4, { min: 3, max: 6 }), drop: fluidPx(dims, 4, { min: 3, max: 7 }) });
}

// ── 모래밭 눈금자 + 정답 구역 + 예상 착지점 ──
function drawRuler(ctx, now) {
  const pt = pit();
  const baseY = pt.y + pt.h * 0.42;

  // 눈금
  ctx.save();
  ctx.strokeStyle = CUTE.ink;
  ctx.lineWidth = fluidPx(dims, 3, { min: 2, max: 4.5 });
  ctx.beginPath(); ctx.moveTo(dToX(0), baseY); ctx.lineTo(dToX(MAXD), baseY); ctx.stroke();
  const fs = fluidPx(dims, 14, { min: 10, max: 19 });
  for (let d = 0; d <= MAXD + 1e-9; d += 0.1) {
    const big = Math.abs(d * 2 - Math.round(d * 2)) < 1e-9;      // 0.5 단위는 길게
    const x = dToX(d);
    ctx.beginPath();
    ctx.moveTo(x, baseY);
    ctx.lineTo(x, baseY + (big ? fs * 0.9 : fs * 0.45));
    ctx.lineWidth = big ? fluidPx(dims, 2.6, { min: 2, max: 3.6 }) : fluidPx(dims, 1.4, { min: 1, max: 2 });
    ctx.stroke();
    if (big) {
      ctx.fillStyle = CUTE.ink;
      ctx.font = `900 ${fs}px sans-serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "top";
      ctx.fillText(fmt(d), x, baseY + fs * 1.1);
    }
  }
  ctx.restore();

  // 결과가 나온 뒤에만 정답 구역을 펼쳐 보여 준다 (미리 보이면 답을 알려 주는 셈)
  if (landed !== null) {
    const x0 = dToX(round.answer - round.tol), x1 = dToX(round.answer + round.tol);
    ctx.save();
    ctx.fillStyle = "rgba(81,207,102,0.30)";
    ctx.fillRect(x0, baseY - pt.h * 0.30, x1 - x0, pt.h * 0.30);
    ctx.strokeStyle = CUTE.greenDark;
    ctx.lineWidth = fluidPx(dims, 3, { min: 2, max: 4.5 });
    ctx.strokeRect(x0, baseY - pt.h * 0.30, x1 - x0, pt.h * 0.30);
    const ax = dToX(round.answer);
    drawChunkyText(ctx, `정답 ${fmt(round.answer)}`, ax, baseY - pt.h * 0.42,
      fluidPx(dims, 17, { min: 13, max: 23 }), "#fff",
      { outline: CUTE.greenDark, outlineWidth: fluidPx(dims, 5, { min: 3.5, max: 7 }) });
    // 내가 착지한 자리
    const mx = dToX(landed);
    drawSticker(ctx, mx, baseY, fluidPx(dims, 11, { min: 8, max: 15 }),
      Math.abs(landed - round.answer) <= round.tol ? CUTE.green : CUTE.red, { lineWidth: 3 });
    drawChunkyText(ctx, `${fmt(landed)} m`, mx, baseY + pt.h * 0.62,
      fluidPx(dims, 16, { min: 12, max: 21 }), "#fff",
      { outline: CUTE.ink, outlineWidth: fluidPx(dims, 5, { min: 3.5, max: 7 }) });
    ctx.restore();
    return;
  }

  // 아직 안 뛰었으면 — 지금 뛰면 닿을 자리를 실시간으로 보여 준다
  const px = dToX(predicted());
  const pulse = 0.5 + 0.5 * Math.sin(now / 170);
  ctx.save();
  ctx.setLineDash([8, 6]);
  ctx.strokeStyle = PARTY.gold;
  ctx.lineWidth = fluidPx(dims, 3.5, { min: 2.5, max: 5 });
  ctx.beginPath(); ctx.moveTo(px, baseY - pt.h * 0.55); ctx.lineTo(px, baseY); ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
  drawSticker(ctx, px, baseY - pt.h * 0.55, fluidPx(dims, 10 + pulse * 2, { min: 8, max: 16 }), PARTY.gold, { lineWidth: 3 });
  drawChunkyText(ctx, `${fmt(Math.round(predicted() * 100) / 100)} m`, px, baseY - pt.h * 0.75,
    fluidPx(dims, 20, { min: 15, max: 27 }), "#fff",
    { outline: CUTE.ink, outlineWidth: fluidPx(dims, 6, { min: 4, max: 8 }) });

  // 파워 게이지 — 얼마나 웅크렸는지
  const gy = pt.y - pt.h * 0.42, gw = pt.w * 0.55, gh = fluidPx(dims, 14, { min: 10, max: 20 });
  const gx = pt.x + (pt.w - gw) / 2;
  drawStickerRect(ctx, gx + gw / 2, gy, gw, gh, gh / 2, "rgba(255,255,255,0.75)", { lineWidth: 2.5, drop: 2, gloss: false });
  ctx.save();
  ctx.fillStyle = power > 0.72 ? PARTY.gold : power > 0.38 ? CUTE.orangeDark : CUTE.red;
  ctx.beginPath();
  ctx.roundRect(gx, gy - gh / 2, gw * power, gh, gh / 2);
  ctx.fill();
  ctx.restore();
}

// ── 선수 — 평소엔 트랙에서 대기, 도약하면 포물선을 그리며 날아간다 ──
function drawAthlete(ctx, now, remain) {
  const { w, h } = dims;
  const r = fluidPx(dims, 26, { min: 19, max: 36 });
  let x = w * 0.13, y = h * 0.74, spin = 0;
  if (jump) {
    const t = Math.min(1, (now - jump.at) / 620);
    x = jump.fromX + (jump.toX - jump.fromX) * t;
    y = jump.fromY + (jump.toY - jump.fromY) * t - Math.sin(Math.PI * t) * h * 0.26 * (jump.power || 1);
    spin = t * Math.PI * (jump.ok ? 2 : 0.6);
  } else {
    y += Math.sin(now / 260) * r * 0.10 + crouch * r * 0.5;   // 제자리에서 통통, 웅크리면 내려앉는다
  }
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(spin);
  ctx.translate(-x, -y);
  drawPlayer(ctx, x, y, r, CHAR, party.currentMood(remain));
  ctx.restore();
}

// ── 심판 깃발 ──
function drawJudge(ctx) {
  const { w, h } = dims;
  const r = fluidPx(dims, 20, { min: 15, max: 28 });
  const jx = w * 0.955, jy = h * 0.50;
  drawSticker(ctx, jx, jy, r, CUTE.cream, { lineWidth: Math.max(2.5, r * 0.14) });
  ctx.save();
  ctx.font = `${r * 1.1}px sans-serif`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("👨‍⚖️", jx, jy);
  if (flag !== 0) {
    ctx.font = `${r * 1.3}px sans-serif`;
    ctx.fillText(flag > 0 ? "🚩" : "🏳️", jx, jy - r * 1.5);
  }
  ctx.restore();
}

function loop(tsMs) {
  requestAnimationFrame(loop);
  if (mode === "motion" && video.readyState < 2) return;
  const { ctx, w, h } = dims;
  ctx.save();
  shake.apply(ctx);
  if (mode === "motion") drawMirroredVideo(ctx, video, w, h);
  else drawPartyBackdrop(ctx, dims);
  drawDrifters(ctx, drifters, dims, 1 / 60);
  drawBunting(ctx, dims);
  drawCrowd(ctx, dims, party.cheerUntil);

  let result = null;
  poseLm = null;
  if (mode === "motion") {
    result = poseTracker.detect(video, tsMs);
    poseLm = posePoints(result);
    motion.push(tsMs, poseLm, w, h, video);
    if (state === "raise") {
      if (startGate.update(tsMs, isArmRaised(poseLm))) goReady();
    }
  }
  cursors = getCursors(mode, result, w, h, video, pointerInput);

  if (state === "playing") stepGame();

  // 손목 위치를 표시해 준다 — 내 손이 어디로 인식되는지 보이면 조준이 쉬워진다
  if (mode === "motion") {
    const f = motion.last;
    if (f) {
      const r = fluidPx(dims, 26, { min: 18, max: 36 });
      const aimHand = (f.lw.y < f.rw.y) ? "lw" : "rw";
      for (const k of ["lw", "rw"]) {
        drawSticker(ctx, f[k].x, f[k].y, k === aimHand ? r : r * 0.7,
          k === aimHand ? PARTY.gold : "rgba(255,255,255,0.75)", { lineWidth: Math.max(3, r * 0.14) });
      }
    } else if (state === "playing") {
      drawChunkyText(ctx, "카메라에 몸이 보이게 한 걸음 물러서 주세요!", w * 0.5, h * 0.5,
        fluidPx(dims, 22, { min: 16, max: 30 }), "#fff",
        { outline: CUTE.ink, outlineWidth: fluidPx(dims, 6, { min: 4, max: 8 }) });
    }
  } else {
    for (const c of cursors) drawGloveCursor(ctx, c.x, c.y, fluidPx(dims, 44, { min: 32, max: 62 }), { active: power > 0.1 });
  }
  ctx.restore();
}

function stepGame() {
  const { ctx, w, h } = dims;
  // 홀드·게이지는 프레임 수가 아니라 실제 흐른 시간으로 쌓아야 한다.
  // 느린 기기에서 프레임이 떨어지면 제한 시간만 실시간으로 흐르고 게이지는 안 차서 불리해진다.
  const dt = lastFrameAt ? Math.min(0.06, (performance.now() - lastFrameAt) / 1000) : 1 / 60;
  lastFrameAt = performance.now();
  const remain = Math.max(0, playEndAt - performance.now());
  if (remain <= 0) { endGame(); return; }
  const now = performance.now();

  updatePower();
  if (now - roundAt > 300) detectJump(now);

  drawField(ctx);
  drawRuler(ctx, now);
  drawAthlete(ctx, now, remain);
  drawJudge(ctx);

  const hudBottom = party.drawHud(ctx, dims, { remainMs: remain, count, suffix: "번" });

  drawCuteBanner(ctx, dims, [
    { text: round.question, size: 30, chunky: true, color: PARTY.gold },
    { text: round.hint, size: 14, color: CUTE.ink },
  ], fluidPx, { top: hudBottom });

  const guide = mode === "motion"
    ? (power > 0.12 ? "🏃 좋아요! 그대로 힘껏 점프!" : "무릎을 굽혀 웅크릴수록 멀리 뛰어요")
    : "모래밭 위에서 좌우로 움직여 거리를 맞추고 눌러요!";
  drawChunkyText(ctx, guide, w * 0.5, h * 0.95, fluidPx(dims, 16, { min: 12, max: 22 }),
    power > 0.12 ? PARTY.gold : "#fff",
    { outline: CUTE.ink, outlineWidth: fluidPx(dims, 5, { min: 3.5, max: 7 }) });

  party.update(dt);
  confetti = updateConfetti(confetti, dt); drawConfetti(ctx, confetti);
  sparks = updateSparkles(sparks, dt); drawSparkles(ctx, sparks);
  party.drawFx(ctx, dims);
  party.drawFeverFrame(ctx, dims);

  drawVignette(ctx, w, h, 0.16);
  drawLevelStars(ctx, dims, autoDiff.level, fluidPx);
}

init();
</script>
