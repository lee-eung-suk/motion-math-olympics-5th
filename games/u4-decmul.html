<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>소수 매트 맞추기 · 종목 4</title>
<link rel="stylesheet" href="../css/style.css?v=6">
</head>
<body>

<div class="game-stage">
  <video id="video" playsinline muted style="display:none"></video>
  <canvas id="gameCanvas"></canvas>

  <div class="hud">
    <div class="rec" id="recIndicator" style="display:none"><span class="dot"></span>REC</div>
    <button class="home-btn" id="homeBtn">🏠</button>
  </div>

  <div class="overlay-panel" id="loadingPanel">
    <h2>📐 소수 매트 만들기</h2>
    <p id="loadingText">준비 중…</p>
  </div>

  <div class="overlay-panel" id="rulePanel" style="display:none">
    <div class="rule-card">
      <div class="rule-head">
        <div class="rule-char">🦊</div>
        <div>
          <div class="rule-name">재보</div>
          <h2 class="rule-title">소수 매트 맞추기</h2>
        </div>
      </div>
      <p class="rule-cheer"></p>
      <ul class="rule-list"></ul>
      <div class="rule-timer"><div class="rule-timer-fill"></div></div>
      <button class="rule-go">좋아, 시작!</button>
    </div>
  </div>

  <div class="overlay-panel" id="raisePanel" style="display:none">
    <div class="raise-icon" id="raiseIcon">🙌</div>
    <h2 id="raiseText">두 손을 들어 주세요!</h2>
    <div class="hold-bar"><div class="hold-fill" id="holdFill"></div></div>
  </div>

  <div class="overlay-panel ready-flash" id="readyPanel" style="display:none">
    <h2>✋ 좋아요! 준비됐어요</h2>
  </div>

  <div class="overlay-panel" id="countdownPanel" style="display:none">
    <div class="countdown-num" id="countNum">3</div>
  </div>

  <div class="overlay-panel" id="resultPanel" style="display:none">
    <div id="podium"></div>
    <div class="result-stats">
      <div class="stat-box"><div class="num" id="statCount">0개</div><div class="label">만든 매트</div></div>
      <div class="stat-box"><div class="num" id="statBest">0개</div><div class="label">최고 기록</div></div>
      <div class="stat-box"><div class="num" id="statCombo">0</div><div class="label">최고 콤보</div></div>
    </div>
    <video class="preview" id="previewVideo" controls playsinline style="display:none"></video>
    <div class="action-row">
      <button class="ghost-btn" id="savePhotoBtn">📸 사진</button>
      <button class="ghost-btn" id="saveVideoBtn" style="display:none">🎬 3초 영상</button>
      <button class="big-btn" id="retryBtn">🔁 한 번 더</button>
      <button class="ghost-btn" id="homeBtn2">🏠 종목 선택</button>
    </div>
  </div>
</div>

<script type="module">
import {
  HighScore, requestWakeLock, SoundKit, FileAudioLoop,
  HandTracker, ClipRecorder, downloadBlob,
  drawMirroredVideo, fitCanvasToScreen, isHandRaised, getCursors,
  AutoDifficulty, levelFromUrl, medalFor,
  scheduleAutoRecording, ComboShot, drawPhotoOverlay,
  ScreenShake, InputMode, PointerInput, StartGate,
  startCamera, formatFileTimestamp, fluidPx, showSoundHint,
  drawVignette, spawnConfetti, updateConfetti, drawConfetti,
} from "../js/engine.js?v=2";
import {
  CUTE, bob, drawSticker, drawStickerRect, drawChunkyText,
  spawnSparkles, updateSparkles, drawSparkles, makeDrifters, drawDrifters,
  drawBunting, drawGloveCursor, drawLevelStars, drawCuteBanner,
} from "../js/cute.js?v=6";
import {
  PARTY, CHARACTERS, Party, HandPair, drawTwoHandHint,
  drawPartyBackdrop, drawCrowd, drawMascot,
  showRuleCard, renderPodium, irisTransition,
} from "../js/party.js?v=2";
requestWakeLock();

const UNIT = "f4";
const TITLE = "소수 매트 만들기";
const RECORD_SUFFIX = "개 완성";
const MEDALS = { bronze: 3, silver: 6, gold: 9 };
const CHAR = CHARACTERS[UNIT];
const mode = InputMode.get();

const video = document.getElementById("video");
const canvas = document.getElementById("gameCanvas");
let dims = fitCanvasToScreen(canvas);
let drifters = makeDrifters(10, dims.w, dims.h);
window.addEventListener("resize", () => {
  dims = fitCanvasToScreen(canvas);
  drifters = makeDrifters(10, dims.w, dims.h);
});

const sound = new SoundKit();
const bgm = new FileAudioLoop("../assets/sounds/subbgm.mp3", 0.32);
const isMuted = () => localStorage.getItem("smo_muted") === "1";
const party = new Party({ unit: UNIT, sound, isMuted });
const hands = new HandPair();

function goHome() { bgm.stop(); irisTransition(() => { location.href = "../index.html"; }); }
document.getElementById("homeBtn").addEventListener("click", goHome);
document.getElementById("homeBtn2").addEventListener("click", goHome);

function randInt(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }

// 격자: 가로 3.0 m(30칸) × 세로 2.0 m(20칸), 한 칸 = 0.1 m
const COLS = 30, ROWS = 20, CELL_M = 0.1;
const r1 = (v) => Math.round(v * 10) / 10;
const r2 = (v) => Math.round(v * 100) / 100;

// ---------------------------------------------------------------------------
// 문제 만들기 — 정답 직사각형의 크기를 sample.a, sample.b로 미리 정한다.
// 학생은 그 크기를 보고 손으로 만들어서 맞춰야 한다.
// ---------------------------------------------------------------------------
function genRound(level) {
  for (let t = 0; t < 400; t++) {
    let a, b;
    if (level === 1) {
      // (소수)×(자연수) — 한 변이 자연수라 계산이 간단하다
      a = r1(randInt(2, 15) / 10);
      b = randInt(1, 2);
    } else if (level === 2) {
      // (소수 한 자리)×(소수 한 자리) — 곱이 소수 두 자리가 된다
      a = r1(randInt(3, 20) / 10);
      b = r1(randInt(3, 15) / 10);
    } else {
      a = r1(randInt(8, 28) / 10);
      b = r1(randInt(6, 18) / 10);
    }
    if (a > COLS * CELL_M || b > ROWS * CELL_M) continue;
    const area = r2(a * b);
    if (area < 0.1 || area > 3.0) continue;
    return {
      area,
      sample: { a, b },
      hint: level === 1 ? "소수 한 자리 × 자연수" : "0.1 × 0.1 = 0.01 — 소수점 아래 자리 수를 더해요",
    };
  }
  return { area: 0.56, sample: { a: 0.7, b: 0.8 }, hint: "0.1 × 0.1 = 0.01" };
}

const handTracker = new HandTracker();
let pointerInput = null;
let pressPt = null;

// 드래그를 시작한 "누른 그 지점"을 이벤트 시점에 직접 기록해 둔다.
// 프레임 사이에 누르고 떼는 빠른 동작에서도 매트의 첫 꼭짓점을 놓치지 않는다.
function bindPressPoint() {
  const rec = (cx, cy) => {
    const r = canvas.getBoundingClientRect();
    pressPt = { x: cx - r.left, y: cy - r.top };
  };
  canvas.addEventListener("mousedown", (e) => rec(e.clientX, e.clientY));
  canvas.addEventListener("touchstart", (e) => {
    if (e.touches[0]) rec(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
}

async function init() {
  if (!isMuted()) bgm.play(showSoundHint);
  if (mode === "motion") {
    try {
      await startCamera(video, { width: 640, height: 480 });
      if (!isMuted()) bgm.play(showSoundHint);
    } catch (e) {
      document.getElementById("loadingText").textContent = "⚠️ 카메라를 찾을 수 없어요. 카메라 권한을 확인해주세요.";
      return;
    }
    document.getElementById("loadingText").textContent = "AI 모델을 불러오는 중…";
    await handTracker.init(2);
  } else {
    pointerInput = new PointerInput(canvas);
    bindPressPoint();
  }
  document.getElementById("loadingPanel").style.display = "none";

  await showRuleCard({
    unit: UNIT,
    title: "소수 매트 맞추기",
    lines: [
      mode === "motion"
        ? "<b>양손이 매트의 두 꼭짓점</b>이에요. 손을 벌리면 직사각형 매트가 그려져요."
        : "화면을 <b>드래그</b>하면 직사각형 매트가 그려져요.",
      "<b>금색 목표 직사각형</b>과 같은 크기를 만들어야 해요.",
      "한 칸은 <b>0.1 m</b>이에요. 반 칸(<b>±0.05 m</b>)의 오차는 괜찮아요.",
      "목표 크기와 같으면 <b>0.6초 그대로</b> 있어요 → 매트 완성!",
    ],
  });

  document.getElementById("raiseIcon").textContent = mode === "motion" ? "🙌" : "👆";
  document.getElementById("raiseText").textContent = mode === "motion" ? "두 손을 들어 주세요!" : "화면을 터치(클릭)하면 시작!";
  document.getElementById("raisePanel").style.display = "flex";
  state = "raise";
  requestAnimationFrame(loop);
}

let state = "loading";
const holdFill = document.getElementById("holdFill");
const startGate = new StartGate(mode, holdFill);

let autoDiff, count, playEndAt;
let round, roundAt, resolving, hold = 0, resultMark = null;
let rect = null;                     // { ax, ay, bx, by } — 격자 칸 단위(정수)
let anchor = null, wasDown = false;  // 마우스 드래그용
let confetti = [], sparks = [];
const shake = new ScreenShake();
let recorder, comboShot, fallbackShot, autoRec, recordedBlob = null;
const recIndicator = document.getElementById("recIndicator");
let cursors = [];
let lastFrameAt = 0;

function grid() {
  const { w, h } = dims;
  const availW = w * 0.88, availH = h * 0.58;
  const cell = Math.min(availW / COLS, availH / ROWS);
  const gw = cell * COLS, gh = cell * ROWS;
  return { cell, gw, gh, ox: (w - gw) / 2, oy: h * 0.36 };
}
const toCol = (x) => { const g = grid(); return Math.max(0, Math.min(COLS, Math.round((x - g.ox) / g.cell))); };
const toRow = (y) => { const g = grid(); return Math.max(0, Math.min(ROWS, Math.round((y - g.oy) / g.cell))); };

function newRound() {
  round = genRound(autoDiff.level);
  roundAt = performance.now();
  resolving = false; hold = 0; resultMark = null;
  rect = null; anchor = null; wasDown = false;
}

function startCountdown() {
  state = "countdown";
  document.getElementById("countdownPanel").style.display = "flex";
  const numEl = document.getElementById("countNum");
  let n = 3;
  numEl.textContent = n;
  if (!isMuted()) sound.countBeep();
  const iv = setInterval(() => {
    n--;
    if (n <= 0) {
      clearInterval(iv);
      document.getElementById("countdownPanel").style.display = "none";
      if (!isMuted()) sound.go();
      beginPlay();
    } else {
      numEl.textContent = n;
      if (!isMuted()) sound.countBeep();
    }
  }, 700);
}

function beginPlay() {
  state = "playing";
  const prev = HighScore.get(UNIT);
  autoDiff = new AutoDifficulty(levelFromUrl(AutoDifficulty.startLevelFromHighScore(prev)));
  count = 0;
  party.reset();
  hands.reset();
  confetti = []; sparks = [];
  playEndAt = performance.now() + 60000;
  lastFrameAt = 0;
  newRound();

  recorder = new ClipRecorder(canvas, sound, 24);
  recorder.prepare();
  comboShot = new ComboShot(canvas);
  fallbackShot = new ComboShot(canvas);
  autoRec = scheduleAutoRecording(recorder, {
    onStartVisual: () => {
      recIndicator.style.display = "flex";
      setTimeout(() => { if (!comboShot.captured) fallbackShot.capture(canvas); }, 1500);
    },
    onEndVisual: () => { recIndicator.style.display = "none"; },
    onDone: (blob) => { recordedBlob = blob; },
    fallbackMs: 8000,
  });
}

function sides() {
  if (!rect) return null;
  const a = r1(Math.abs(rect.bx - rect.ax) * CELL_M);
  const b = r1(Math.abs(rect.by - rect.ay) * CELL_M);
  return { a, b, area: r2(a * b) };
}

// 목표 크기와 학생이 만든 크기를 비교 (오차범위 ±0.05m)
function matchesTarget(studentSides, targetSides) {
  if (!studentSides || !targetSides) return false;
  const tolerance = 0.05;
  const sa = studentSides.a, sb = studentSides.b;
  const ta = targetSides.a, tb = targetSides.b;

  // 두 변이 순서대로 일치 또는 90도 회전해서 일치
  const straightMatch = Math.abs(sa - ta) <= tolerance && Math.abs(sb - tb) <= tolerance;
  const rotatedMatch = Math.abs(sa - tb) <= tolerance && Math.abs(sb - ta) <= tolerance;

  return straightMatch || rotatedMatch;
}

function confirmMat(s) {
  resolving = true;
  const g = grid();
  const cx = g.ox + ((rect.ax + rect.bx) / 2) * g.cell;
  const cy = g.oy + ((rect.ay + rect.by) / 2) * g.cell;
  resultMark = { ...s, ok: true, at: performance.now() };
  count++;
  party.correct(cx, cy, { base: 12, elapsedMs: performance.now() - roundAt });
  if (party.combo > 0 && party.combo === party.maxCombo) comboShot.capture(canvas);
  autoDiff.reportCorrect();
  autoRec.trigger();
  shake.trigger(6, 160);
  spawnSparkles(sparks, cx, cy, 26, ["#fff", PARTY.gold, CUTE.green]);
  spawnConfetti(confetti, cx, cy, 32);
  setTimeout(() => { if (state === "playing") newRound(); }, 1400);
}

// 시간이 다 되면 실패 — 지금 만든 매트의 넓이를 알려 줘서 왜 아닌지 보게 한다
function timeUp() {
  resolving = true;
  const s = sides();
  const g = grid();
  const cx = rect ? g.ox + ((rect.ax + rect.bx) / 2) * g.cell : dims.w / 2;
  const cy = rect ? g.oy + ((rect.ay + rect.by) / 2) * g.cell : dims.h * 0.6;
  // 매트를 아예 안 만들었으면 "0 × 0" 같은 이상한 안내 대신 아무것도 보여주지 않는다
  resultMark = s && s.a > 0 && s.b > 0 ? { ...s, ok: false, at: performance.now() } : null;
  party.wrong(cx, cy, "다시 계산해요!");
  autoDiff.reportWrong();
  setTimeout(() => { if (state === "playing") newRound(); }, 1600);
}

function endGame() {
  state = "result";
  const { medal, label } = medalFor(count, MEDALS);
  const prev = HighScore.get(UNIT);
  const best = Math.max(count, prev ? prev.count : 0);
  if (!prev || count >= prev.count) {
    HighScore.set(UNIT, { count, bestLevel: autoDiff.level, label: `${medal} ${count}${RECORD_SUFFIX}`, at: Date.now() });
  }
  renderPodium({ unit: UNIT, medal, label, coins: party.coins, maxCombo: party.maxCombo, count, suffix: RECORD_SUFFIX, best });

  document.getElementById("statCount").textContent = count + "개";
  document.getElementById("statBest").textContent = best + "개";
  document.getElementById("statCombo").textContent = "🔥" + party.maxCombo;

  const shot = comboShot.captured ? comboShot : fallbackShot;
  const previewVideo = document.getElementById("previewVideo");
  const saveVideoBtn = document.getElementById("saveVideoBtn");
  if (recordedBlob) {
    previewVideo.src = URL.createObjectURL(recordedBlob);
    previewVideo.style.display = "block";
    saveVideoBtn.style.display = "inline-block";
  }
  document.getElementById("savePhotoBtn").onclick = async () => {
    const blob = await shot.toBlob((c, w, h) => drawPhotoOverlay(c, w, h, { title: TITLE, record: count + RECORD_SUFFIX, medal }));
    downloadBlob(blob, `수학체육올림픽5_소수매트_${formatFileTimestamp()}.png`);
  };
  document.getElementById("saveVideoBtn").onclick = () => {
    if (recordedBlob) downloadBlob(recordedBlob, `수학체육올림픽5_소수매트_${formatFileTimestamp()}.${recorder.extension}`);
  };
  document.getElementById("resultPanel").style.display = "flex";
  if (!isMuted()) sound.success();
}

document.getElementById("retryBtn").addEventListener("click", () => {
  document.getElementById("resultPanel").style.display = "none";
  document.getElementById("raisePanel").style.display = "flex";
  startGate.since = 0; startGate.ready = false; holdFill.style.width = "0%";
  state = "raise";
});

document.getElementById("raisePanel").addEventListener("click", () => {
  if (state === "raise" && mode !== "motion") goReady();
});

function goReady() {
  state = "ready";
  document.getElementById("raisePanel").style.display = "none";
  document.getElementById("readyPanel").style.display = "flex";
  if (!isMuted()) sound.click();
  setTimeout(() => {
    document.getElementById("readyPanel").style.display = "none";
    startCountdown();
  }, 500);
}

function loop(tsMs) {
  requestAnimationFrame(loop);
  if (mode === "motion" && video.readyState < 2) return;
  const { ctx, w, h } = dims;
  ctx.save();
  shake.apply(ctx);
  if (mode === "motion") drawMirroredVideo(ctx, video, w, h);
  else drawPartyBackdrop(ctx, dims);
  drawDrifters(ctx, drifters, dims, 1 / 60);
  drawBunting(ctx, dims);
  drawCrowd(ctx, dims, party.cheerUntil);

  let result = null;
  if (mode === "motion") {
    result = handTracker.detect(video, tsMs);
    if (state === "raise") {
      let raised = 0;
      if (result && result.landmarks) for (const lm of result.landmarks) if (isHandRaised(lm)) raised++;
      if (startGate.update(tsMs, raised >= 2)) goReady();
    }
  }
  cursors = getCursors(mode, result, w, h, video, pointerInput);
  hands.update(cursors);

  if (state === "playing") stepGame();

  for (const c of cursors) drawGloveCursor(ctx, c.x, c.y, fluidPx(dims, 42, { min: 30, max: 58 }), { active: hold > 0 });
  ctx.restore();
}

// ── 입력: 두 손이 직사각형의 대각 꼭짓점. 격자 교차점에 딱 붙는다(스냅) ──
function updateRect() {
  if (mode === "motion") {
    if (hands.both) {
      rect = { ax: toCol(hands.left.x), ay: toRow(hands.left.y), bx: toCol(hands.right.x), by: toRow(hands.right.y) };
    }
    return;
  }
  const pts = pointerInput ? pointerInput.points : [];
  if (pts.length >= 2) {
    const s = [...pts].sort((a, b) => a.x - b.x);
    rect = { ax: toCol(s[0].x), ay: toRow(s[0].y), bx: toCol(s[s.length - 1].x), by: toRow(s[s.length - 1].y) };
    anchor = null;
    return;
  }
  // 누르는 순간을 consumeJustDown으로 걸어 둬야, 누르고 떼는 게 한 프레임에 다 일어나도 놓치지 않는다
  const justDown = pointerInput ? pointerInput.consumeJustDown() : false;
  const down = pointerInput && pointerInput.down && pts.length === 1;
  if (justDown && (pressPt || pts.length)) {
    const p = pressPt || pts[0];
    anchor = { c: toCol(p.x), r: toRow(p.y) };
    wasDown = true;
  }
  if (wasDown && anchor && pts.length) {
    rect = { ax: anchor.c, ay: anchor.r, bx: toCol(pts[0].x), by: toRow(pts[0].y) };
  }
  if (!down) wasDown = false;
}

function stepGame() {
  const { ctx, w, h } = dims;
  // 홀드·게이지는 프레임 수가 아니라 실제 흐른 시간으로 쌓아야 한다.
  // 느린 기기에서 프레임이 떨어지면 제한 시간만 실시간으로 흐르고 게이지는 안 차서 불리해진다.
  const dt = lastFrameAt ? Math.min(0.06, (performance.now() - lastFrameAt) / 1000) : 1 / 60;
  lastFrameAt = performance.now();
  const remain = Math.max(0, playEndAt - performance.now());
  if (remain <= 0) { endGame(); return; }
  const now = performance.now();
  const armed = now - roundAt > 700;
  const g = grid();

  if (!resolving) {
    updateRect();
    const s = sides();
    const match = matchesTarget(s, round.sample);
    hold = match && armed ? hold + dt * 1000 : Math.max(0, hold - dt * 900);
    if (hold > 600) confirmMat(s);
    else if (now - roundAt > 14000) timeUp();
  }

  // ── 격자 ────────────────────────────────────────────────
  ctx.save();
  ctx.fillStyle = "rgba(255,253,243,0.82)";
  ctx.fillRect(g.ox, g.oy, g.gw, g.gh);
  // 0.1 m 잔격자
  ctx.strokeStyle = "rgba(34,48,92,0.22)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let c = 0; c <= COLS; c++) { ctx.moveTo(g.ox + c * g.cell, g.oy); ctx.lineTo(g.ox + c * g.cell, g.oy + g.gh); }
  for (let r = 0; r <= ROWS; r++) { ctx.moveTo(g.ox, g.oy + r * g.cell); ctx.lineTo(g.ox + g.gw, g.oy + r * g.cell); }
  ctx.stroke();
  // 0.5 m 굵은 격자 + 눈금 숫자
  ctx.strokeStyle = "rgba(34,48,92,0.55)";
  ctx.lineWidth = fluidPx(dims, 2.2, { min: 1.6, max: 3.2 });
  ctx.beginPath();
  for (let c = 0; c <= COLS; c += 5) { ctx.moveTo(g.ox + c * g.cell, g.oy); ctx.lineTo(g.ox + c * g.cell, g.oy + g.gh); }
  for (let r = 0; r <= ROWS; r += 5) { ctx.moveTo(g.ox, g.oy + r * g.cell); ctx.lineTo(g.ox + g.gw, g.oy + r * g.cell); }
  ctx.stroke();
  ctx.fillStyle = CUTE.ink;
  ctx.font = `900 ${fluidPx(dims, 12, { min: 9, max: 16 })}px sans-serif`;
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  for (let c = 0; c <= COLS; c += 5) ctx.fillText((c * CELL_M).toFixed(1), g.ox + c * g.cell, g.oy + g.gh + 3);
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  for (let r = 0; r <= ROWS; r += 5) ctx.fillText(((ROWS - r) * CELL_M).toFixed(1), g.ox - 4, g.oy + r * g.cell);
  ctx.strokeStyle = CUTE.ink;
  ctx.lineWidth = fluidPx(dims, 3.5, { min: 2.5, max: 5 });
  ctx.strokeRect(g.ox, g.oy, g.gw, g.gh);
  ctx.restore();

  // ── 목표 직사각형 (금색 반투명) ────────────────────────────
  const targetCols = Math.round(round.sample.a / CELL_M);
  const targetRows = Math.round(round.sample.b / CELL_M);
  const targetX = g.ox + (COLS / 2 - targetCols / 2) * g.cell;
  const targetY = g.oy + (ROWS / 2 - targetRows / 2) * g.cell;
  const targetW = targetCols * g.cell;
  const targetH = targetRows * g.cell;
  ctx.save();
  ctx.fillStyle = "rgba(255,200,0,0.22)";
  ctx.fillRect(targetX, targetY, targetW, targetH);
  ctx.strokeStyle = PARTY.gold;
  ctx.lineWidth = fluidPx(dims, 2.8, { min: 1.8, max: 4 });
  ctx.setLineDash([8, 4]);
  ctx.strokeRect(targetX, targetY, targetW, targetH);
  ctx.setLineDash([]);
  ctx.restore();

  // ── 내가 만든 매트 ──────────────────────────────────────
  const s = sides();
  if (rect && s) {
    const x = g.ox + Math.min(rect.ax, rect.bx) * g.cell;
    const y = g.oy + Math.min(rect.ay, rect.by) * g.cell;
    const rw = Math.abs(rect.bx - rect.ax) * g.cell;
    const rh = Math.abs(rect.by - rect.ay) * g.cell;
    const ok = resultMark ? resultMark.ok : matchesTarget(s, round.sample);
    ctx.save();
    ctx.fillStyle = ok ? "rgba(81,207,102,0.42)" : "rgba(255,207,63,0.38)";
    ctx.fillRect(x, y, rw, rh);
    ctx.strokeStyle = ok ? CUTE.greenDark : CUTE.orangeDark;
    ctx.lineWidth = fluidPx(dims, 4.5, { min: 3, max: 6.5 });
    ctx.strokeRect(x, y, rw, rh);
    ctx.restore();

    // 두 변의 길이 — 넓이는 알려주지 않는다. 곱은 학생이 한다.
    const fs = fluidPx(dims, 19, { min: 14, max: 26 });
    drawChunkyText(ctx, `${s.a.toFixed(1)} m`, x + rw / 2, y - fs * 0.9, fs, "#fff",
      { outline: CUTE.ink, outlineWidth: Math.max(4, fs * 0.24) });
    ctx.save();
    ctx.translate(x - fs * 0.9, y + rh / 2);
    ctx.rotate(-Math.PI / 2);
    drawChunkyText(ctx, `${s.b.toFixed(1)} m`, 0, 0, fs, "#fff",
      { outline: CUTE.ink, outlineWidth: Math.max(4, fs * 0.24) });
    ctx.restore();

    // 맞으면 0.01 칸이 반짝이며 채워진다 — 왜 그 넓이인지 눈으로 세어 볼 수 있다
    if (resultMark && resultMark.ok) {
      const t = Math.min(1, (now - resultMark.at) / 700);
      ctx.save();
      ctx.globalAlpha = t * 0.7;
      ctx.fillStyle = PARTY.gold;
      const nc = Math.abs(rect.bx - rect.ax), nr = Math.abs(rect.by - rect.ay);
      const total = nc * nr;
      const shown = Math.floor(total * t);
      for (let i = 0; i < shown; i++) {
        const c = i % nc, r = Math.floor(i / nc);
        ctx.fillRect(x + c * g.cell + 1, y + r * g.cell + 1, g.cell - 2, g.cell - 2);
      }
      ctx.restore();
      drawChunkyText(ctx, `${s.a} × ${s.b} = ${s.area} m²`, x + rw / 2, y + rh + fs * 1.2, fs * 1.1, PARTY.gold,
        { outline: CUTE.ink, outlineWidth: Math.max(4, fs * 0.26) });
    }
    if (resultMark && !resultMark.ok) {
      drawChunkyText(ctx, `${s.a} × ${s.b} = ${s.area} m² 였어요`, x + rw / 2, y + rh + fs * 1.2, fs, "#fff",
        { outline: CUTE.red, outlineWidth: Math.max(4, fs * 0.24) });
    }

    // 목표에 맞으면 유지 게이지가 찬다
    if (hold > 0 && !resolving) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(x + rw / 2, y + rh / 2, Math.min(rw, rh) * 0.32 + fluidPx(dims, 14, { min: 10, max: 20 }),
        -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(1, hold / 600));
      ctx.strokeStyle = PARTY.gold; ctx.lineWidth = fluidPx(dims, 7, { min: 5, max: 10 });
      ctx.lineCap = "round"; ctx.stroke();
      ctx.restore();
    }
  }

  // 재보 — 격자 오른쪽 위에서 지켜본다 (왼쪽은 세로 눈금 숫자 자리)
  const fr = fluidPx(dims, 22, { min: 17, max: 30 });
  drawMascot(ctx, g.ox + g.gw + fr * 1.2, g.oy + fr * 0.6, fr, CHAR, party.currentMood(remain));

  const hudBottom = party.drawHud(ctx, dims, { remainMs: remain, count, suffix: "개" });
  drawCuteBanner(ctx, dims, [
    { text: `${round.sample.a} m × ${round.sample.b} m 크기를 맞춰요!`, size: 26, chunky: true, color: PARTY.gold },
    { text: `(반 칸 오차는 괜찮아요)`, size: 14, color: CUTE.ink },
  ], fluidPx, { top: hudBottom });

  if (mode === "motion" && !hands.both) drawTwoHandHint(ctx, dims, fluidPx);

  party.update(dt);
  confetti = updateConfetti(confetti, dt); drawConfetti(ctx, confetti);
  sparks = updateSparkles(sparks, dt); drawSparkles(ctx, sparks);
  party.drawFx(ctx, dims);
  party.drawFeverFrame(ctx, dims);

  drawVignette(ctx, w, h, 0.14);
  drawLevelStars(ctx, dims, autoDiff.level, fluidPx);
}

init();
</script>
</body>
