<script type="module">
import {
  HighScore, requestWakeLock, SoundKit, FileAudioLoop,
  ClipRecorder, downloadBlob,
  drawMirroredVideo, fitCanvasToScreen, getCursors,
  PoseTracker, PoseMotion, posePoints, poseVisible, isArmRaised, POSE, toMirroredCanvas,
  AutoDifficulty, levelFromUrl, medalFor,
  scheduleAutoRecording, ComboShot, drawPhotoOverlay,
  ScreenShake, InputMode, PointerInput, StartGate,
  startCamera, formatFileTimestamp, fluidPx, showSoundHint,
  drawVignette, spawnConfetti, updateConfetti, drawConfetti,
} from "../js/engine.js?v=4";
import {
  CUTE, LANE_COLORS, bob, drawSticker, drawStickerRect, drawChunkyText,
  spawnSparkles, updateSparkles, drawSparkles, makeDrifters, drawDrifters,
  drawBunting, drawGloveCursor, drawLevelStars, drawCuteBanner,
} from "../js/cute.js?v=7";
import {
  PARTY, CHARACTERS, Party, drawPartyBackdrop, drawCrowd, drawMascot,
  showRuleCard, renderPodium, irisTransition,
} from "../js/party.js?v=2";
requestWakeLock();

const UNIT = "f4";
const TITLE = "소수 멀리뛰기";
const RECORD_SUFFIX = "번 성공";
const MEDALS = { bronze: 5, silver: 9, gold: 14 };
const CHAR = CHARACTERS[UNIT];
const mode = InputMode.get();

const video = document.getElementById("video");
const canvas = document.getElementById("gameCanvas");
let dims = fitCanvasToScreen(canvas);
let drifters = makeDrifters(10, dims.w, dims.h);
window.addEventListener("resize", () => {
  dims = fitCanvasToScreen(canvas);
  drifters = makeDrifters(10, dims.w, dims.h);
  if (round) layoutMats();
});

const sound = new SoundKit();
const bgm = new FileAudioLoop("../assets/sounds/subbgm.mp3", 0.32);
const isMuted = () => localStorage.getItem("smo_muted") === "1";
const party = new Party({ unit: UNIT, sound, isMuted });

function goHome() { bgm.stop(); irisTransition(() => { location.href = "../index.html"; }); }
document.getElementById("homeBtn").addEventListener("click", goHome);
document.getElementById("homeBtn2").addEventListener("click", goHome);

function randInt(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// 0.60 → "0.6", 1.00 → "1" 처럼 교과서에서 쓰는 모양으로 다듬는다
function fmt(v) {
  let s = (Math.round(v * 1000) / 1000).toFixed(2);
  if (s.includes(".")) s = s.replace(/0+$/, "").replace(/\.$/, "");
  return s;
}

// ---------------------------------------------------------------------------
// 문제 만들기 — 소수의 곱셈에서 학생이 가장 많이 틀리는 곳은 "소수점의 자리"다.
// 그래서 오답 보기를 소수점만 어긋난 수로 깔아 둔다.
// 부동소수점 오차를 피하려고 정수로 곱한 뒤 마지막에만 나눈다.
// ---------------------------------------------------------------------------
function genRound(level) {
  const optCount = level === 3 ? 4 : 3;
  let ai, bi, scale, aText, bText;
  if (level === 1) {
    // (소수 한 자리) × (자연수)
    ai = randInt(2, 9);          // 0.2 ~ 0.9
    bi = randInt(2, 9);          // 2 ~ 9
    scale = 10;
    aText = fmt(ai / 10); bText = String(bi);
  } else if (level === 2) {
    // (소수 한 자리) × (소수 한 자리)
    ai = randInt(2, 9);
    bi = randInt(11, 29);        // 1.1 ~ 2.9
    scale = 100;
    aText = fmt(ai / 10); bText = fmt(bi / 10);
  } else {
    ai = randInt(12, 48);        // 1.2 ~ 4.8
    bi = randInt(11, 39);        // 1.1 ~ 3.9
    scale = 100;
    aText = fmt(ai / 10); bText = fmt(bi / 10);
  }
  const answer = (ai * bi) / scale;

  // 매트에 적히는 수와 실제 값이 어긋나면 안 되므로, 두 자리로 적어도
  // 그대로 되읽히는 수만 보기로 쓴다 (0.027을 "0.03"으로 적는 일이 없게)
  const exact = (v) => Math.abs(parseFloat(fmt(v)) - v) < 1e-9;

  // 오답 — 소수점이 한 칸씩 밀린 수를 먼저 넣는다
  const opts = [answer];
  for (const c of shuffle([answer * 10, answer / 10, answer * 100, answer / 100])) {
    if (opts.length >= optCount) break;
    const v = Math.round(c * 1000) / 1000;
    if (v <= 0 || v > 300 || !exact(v)) continue;
    if (opts.some((o) => Math.abs(o - v) < 1e-9)) continue;
    opts.push(v);
  }
  // 그래도 모자라면 계산 실수처럼 보이는 수로 채운다
  let guard = 0;
  while (opts.length < optCount && guard++ < 80) {
    const slip = ((ai + randInt(-2, 2)) * bi) / scale;
    const v = Math.round(slip * 1000) / 1000;
    if (v <= 0 || !exact(v) || opts.some((o) => Math.abs(o - v) < 1e-9)) continue;
    opts.push(v);
  }

  return {
    aText, bText, answer,
    options: shuffle(opts),
    question: `${aText} × ${bText} = ?`,
    hint: level === 1
      ? "소수점 아래 자리 수를 세어 곱의 소수점을 찍어요"
      : "두 수의 소수점 아래 자리 수를 더한 만큼 곱에도 찍어요",
  };
}

const poseTracker = new PoseTracker();
const motion = new PoseMotion();
let pointerInput = null;

async function init() {
  if (!isMuted()) bgm.play(showSoundHint);
  if (mode === "motion") {
    try {
      await startCamera(video, { width: 640, height: 480 });
      if (!isMuted()) bgm.play(showSoundHint);
    } catch (e) {
      document.getElementById("loadingText").textContent = "⚠️ 카메라를 찾을 수 없어요. 카메라 권한을 확인해주세요.";
      return;
    }
    document.getElementById("loadingText").textContent = "전신 인식 모델을 불러오는 중…";
    await poseTracker.init();
  } else {
    pointerInput = new PointerInput(canvas);
  }
  document.getElementById("loadingPanel").style.display = "none";

  await showRuleCard({
    unit: UNIT,
    title: "소수 멀리뛰기",
    lines: [
      "위에 <b>소수의 곱셈</b> 문제가 나와요. 답을 계산해요.",
      mode === "motion"
        ? "<b>손을 들어 좌우로 움직여</b> 답이 적힌 착지 매트를 겨눠요. 금색 테두리가 생겨요."
        : "답이 적힌 착지 매트를 겨눠요. 금색 테두리가 생겨요.",
      mode === "motion"
        ? "겨눴으면 <b>힘껏 점프!</b> (앉아서 한다면 <b>두 팔을 위로 확 뻗어도</b> 돼요) 세게 뛸수록 높이 날아요."
        : "겨눴으면 <b>화면을 눌러</b> 도약!",
      "맞으면 재보가 <b>멋지게 착지</b>하고 심판이 깃발을 들어요.",
      "오답 매트는 <b>소수점만 살짝 어긋난 수</b>예요. 자리 수를 잘 세어 보세요!",
    ],
  });

  document.getElementById("raiseIcon").textContent = mode === "motion" ? "🙋" : "👆";
  document.getElementById("raiseText").textContent = mode === "motion" ? "손을 들어 주세요!" : "화면을 터치(클릭)하면 시작!";
  document.getElementById("raisePanel").style.display = "flex";
  state = "raise";
  requestAnimationFrame(loop);
}

let state = "loading";
const holdFill = document.getElementById("holdFill");
const startGate = new StartGate(mode, holdFill);

let autoDiff, count, playEndAt;
let round = null, mats = [], roundAt, resolving;
let aimIdx = -1, lockUntil = 0;
let poseLm = null;        // 이번 프레임의 전신 랜드마크
let aimX = null;          // 손목으로 겨눈 좌우 위치
let jumpPower = 0;        // 방금 도약한 세기 (연출용)
let crouch = 0;           // 도약 직전 웅크림 표시
let jump = null, flag = 0;
let confetti = [], sparks = [];
const shake = new ScreenShake();
let recorder, comboShot, fallbackShot, autoRec, recordedBlob = null;
const recIndicator = document.getElementById("recIndicator");
let cursors = [];
let lastFrameAt = 0;

// 어깨 너비의 이만큼 솟구치면 "뛰었다"고 본다. 서서 점프하면 어깨가, 앉아서 하면 두 팔이 솟는다.
const JUMP_POWER = 0.17;

// 모래밭 영역 — 매트는 이 안에 나란히 놓인다
function pit() {
  const { w, h } = dims;
  return { x: w * 0.30, y: h * 0.60, w: w * 0.66, h: h * 0.26 };
}

function layoutMats() {
  const p = pit();
  const n = round.options.length;
  const gap = p.w * 0.035;
  const mw = (p.w - gap * (n + 1)) / n;
  const mh = p.h * 0.52;
  mats = round.options.map((value, i) => ({
    value,
    x: p.x + gap * (i + 1) + mw * i + mw / 2,
    y: p.y + p.h * 0.52,
    w: mw, h: mh,
    bad: 0, good: 0,
  }));
}

function newRound() {
  round = genRound(autoDiff.level);
  layoutMats();
  resolving = false;
  aimIdx = -1;
  jump = null;
  flag = 0;
  jumpPower = 1;
  crouch = 0;
  motion.reset();
  roundAt = performance.now();
}

function startCountdown() {
  state = "countdown";
  document.getElementById("countdownPanel").style.display = "flex";
  const numEl = document.getElementById("countNum");
  let n = 3;
  numEl.textContent = n;
  if (!isMuted()) sound.countBeep();
  const iv = setInterval(() => {
    n--;
    if (n <= 0) {
      clearInterval(iv);
      document.getElementById("countdownPanel").style.display = "none";
      if (!isMuted()) sound.go();
      beginPlay();
    } else {
      numEl.textContent = n;
      if (!isMuted()) sound.countBeep();
    }
  }, 700);
}

function beginPlay() {
  state = "playing";
  const prev = HighScore.get(UNIT);
  autoDiff = new AutoDifficulty(levelFromUrl(AutoDifficulty.startLevelFromHighScore(prev)));
  count = 0;
  party.reset();
  confetti = []; sparks = [];
  playEndAt = performance.now() + 60000;
  lastFrameAt = 0;
  lockUntil = 0;
  newRound();

  recorder = new ClipRecorder(canvas, sound, 24);
  recorder.prepare();
  comboShot = new ComboShot(canvas);
  fallbackShot = new ComboShot(canvas);
  autoRec = scheduleAutoRecording(recorder, {
    onStartVisual: () => {
      recIndicator.style.display = "flex";
      setTimeout(() => { if (!comboShot.captured) fallbackShot.capture(canvas); }, 1500);
    },
    onEndVisual: () => { recIndicator.style.display = "none"; },
    onDone: (blob) => { recordedBlob = blob; },
    fallbackMs: 8000,
  });
}

// 도움닫기 → 도약 — 고른 매트로 재보가 포물선을 그리며 날아간다
function launch(mat, ok) {
  const { w, h } = dims;
  jump = { fromX: w * 0.13, fromY: h * 0.74, toX: mat.x, toY: mat.y - mat.h * 0.5, at: performance.now(), ok, power: jumpPower };
  if (!isMuted()) sound.swoosh();
}

function succeed(mat) {
  resolving = true;
  count++;
  mat.good = 1;
  launch(mat, true);
  autoDiff.reportCorrect();
  autoRec.trigger();
  setTimeout(() => {
    if (state !== "playing") return;
    party.correct(mat.x, mat.y, { base: 11, elapsedMs: performance.now() - roundAt });
    if (party.combo > 0 && party.combo === party.maxCombo) comboShot.capture(canvas);
    shake.trigger(9, 220);
    flag = 1;
    if (!isMuted()) sound.hit("perfect");
    // 모래가 튀어 오른다
    spawnSparkles(sparks, mat.x, mat.y, 26, ["#f2e3b8", "#e8d49a", "#fff"]);
    spawnSparkles(sparks, mat.x - 45, mat.y - 10, 12, ["#f2e3b8", PARTY.gold]);
    spawnSparkles(sparks, mat.x + 45, mat.y - 10, 12, ["#f2e3b8", PARTY.gold]);
    if (party.combo > 0 && party.combo % 5 === 0) {
      spawnConfetti(confetti, mat.x, mat.y - 60, 44);
      if (!isMuted()) sound.fever();
    }
  }, 620);
  setTimeout(() => { if (state === "playing") newRound(); }, 1450);
}

function missed(mat) {
  resolving = true;
  mat.bad = 1;
  launch(mat, false);
  autoDiff.reportWrong();
  lockUntil = performance.now() + 1400;
  setTimeout(() => {
    if (state !== "playing") return;
    party.wrong(mat.x, mat.y, "자리 수를 세어 봐요!");
    shake.trigger(6, 170);
    flag = -1;
    if (!isMuted()) sound.wrong();
    spawnSparkles(sparks, mat.x, mat.y, 14, ["#f2e3b8", CUTE.orangeDark]);
  }, 620);
  setTimeout(() => { if (state === "playing") newRound(); }, 1450);
}

function endGame() {
  state = "result";
  const { medal, label } = medalFor(count, MEDALS);
  const prev = HighScore.get(UNIT);
  const best = Math.max(count, prev ? prev.count : 0);
  if (!prev || count >= prev.count) {
    HighScore.set(UNIT, { count, bestLevel: autoDiff.level, label: `${medal} ${count}${RECORD_SUFFIX}`, at: Date.now() });
  }
  renderPodium({ unit: UNIT, medal, label, coins: party.coins, maxCombo: party.maxCombo, count, suffix: RECORD_SUFFIX, best });

  document.getElementById("statCount").textContent = count + "번";
  document.getElementById("statBest").textContent = best + "번";
  document.getElementById("statCombo").textContent = "🔥" + party.maxCombo;

  const shot = comboShot.captured ? comboShot : fallbackShot;
  const previewVideo = document.getElementById("previewVideo");
  const saveVideoBtn = document.getElementById("saveVideoBtn");
  if (recordedBlob) {
    previewVideo.src = URL.createObjectURL(recordedBlob);
    previewVideo.style.display = "block";
    saveVideoBtn.style.display = "inline-block";
  }
  document.getElementById("savePhotoBtn").onclick = async () => {
    const blob = await shot.toBlob((c, w, h) => drawPhotoOverlay(c, w, h, { title: TITLE, record: count + RECORD_SUFFIX, medal }));
    downloadBlob(blob, `수학체육올림픽5_소수멀리뛰기_${formatFileTimestamp()}.png`);
  };
  document.getElementById("saveVideoBtn").onclick = () => {
    if (recordedBlob) downloadBlob(recordedBlob, `수학체육올림픽5_소수멀리뛰기_${formatFileTimestamp()}.${recorder.extension}`);
  };
  document.getElementById("resultPanel").style.display = "flex";
  if (!isMuted()) sound.success();
}

document.getElementById("retryBtn").addEventListener("click", () => {
  document.getElementById("resultPanel").style.display = "none";
  document.getElementById("raisePanel").style.display = "flex";
  startGate.since = 0; startGate.ready = false; holdFill.style.width = "0%";
  state = "raise";
});

document.getElementById("raisePanel").addEventListener("click", () => {
  if (state === "raise" && mode !== "motion") goReady();
});

function goReady() {
  state = "ready";
  document.getElementById("raisePanel").style.display = "none";
  document.getElementById("readyPanel").style.display = "flex";
  if (!isMuted()) sound.click();
  setTimeout(() => {
    document.getElementById("readyPanel").style.display = "none";
    startCountdown();
  }, 500);
}

// ── 조준: 손목 좌우 위치로 매트를 고른다 ──────────────────────────────────
function updateAim() {
  aimIdx = -1;
  if (resolving) { aimX = null; return; }
  if (mode === "motion") {
    const f = motion.last;
    if (!f) { aimX = null; return; }
    // 더 높이 든 손으로 겨눈다 — 한 손만 들어도, 두 손을 들어도 자연스럽다
    aimX = (f.lw.y < f.rw.y) ? f.lw.x : f.rw.x;
  } else {
    const p = cursors[0];
    aimX = p ? p.x : null;
  }
  if (aimX === null) return;
  let best = Infinity;
  for (let i = 0; i < mats.length; i++) {
    const d = Math.abs(aimX - mats[i].x);
    if (d < best) { best = d; aimIdx = i; }
  }
}

// ── 도약: 실제로 뛰거나(어깨가 솟음) 두 팔을 힘껏 위로 뻗으면 날아오른다 ──
function detectJump(now) {
  if (resolving || now < lockUntil || aimIdx < 0) return;
  if (mode !== "motion") {
    if (pointerInput && pointerInput.consumeJustDown()) leap(1);
    return;
  }
  const j = motion.jump();
  if (!j) return;
  crouch = Math.max(0, Math.min(1, -j.power * 3));   // 내려가는 중이면 웅크림으로 표시
  if (j.power > JUMP_POWER) leap(j.power / JUMP_POWER);
}

function leap(power) {
  const mat = mats[aimIdx];
  if (!mat) return;
  jumpPower = Math.max(1, Math.min(2.2, power));
  motion.reset();
  crouch = 0;
  if (Math.abs(mat.value - round.answer) < 1e-9) succeed(mat);
  else missed(mat);
}

// ── 도움닫기 트랙과 모래밭 ──
function drawField(ctx) {
  const { w, h } = dims;
  const p = pit();

  ctx.save();
  ctx.fillStyle = "#c96f4a";
  ctx.fillRect(0, h * 0.70, p.x, h * 0.10);
  ctx.strokeStyle = "rgba(255,255,255,0.7)";
  ctx.lineWidth = fluidPx(dims, 2.5, { min: 2, max: 4 });
  ctx.setLineDash([12, 10]);
  ctx.beginPath();
  ctx.moveTo(0, h * 0.75); ctx.lineTo(p.x, h * 0.75);
  ctx.stroke();
  ctx.setLineDash([]);
  // 발구름판
  ctx.fillStyle = "#f7f3e6";
  ctx.fillRect(p.x - w * 0.035, h * 0.70, w * 0.035, h * 0.10);
  ctx.restore();

  // 모래밭
  drawStickerRect(ctx, p.x + p.w / 2, p.y + p.h / 2, p.w, p.h,
    fluidPx(dims, 14, { min: 10, max: 20 }), "#f0e0b6",
    { lineWidth: fluidPx(dims, 4, { min: 3, max: 6 }), drop: fluidPx(dims, 4, { min: 3, max: 7 }) });
}

function drawMats(ctx, now) {
  for (let i = 0; i < mats.length; i++) {
    const m = mats[i];
    let color = LANE_COLORS[i % LANE_COLORS.length];
    if (m.good > 0) color = CUTE.green;
    else if (m.bad > 0) color = CUTE.orangeDark;
    drawStickerRect(ctx, m.x, m.y, m.w, m.h, Math.min(m.w, m.h) * 0.22, color, {
      lineWidth: fluidPx(dims, 4, { min: 3, max: 6 }), drop: fluidPx(dims, 4, { min: 3, max: 7 }),
    });
    const fs = Math.min(m.h * 0.52, m.w * 0.42);
    drawChunkyText(ctx, fmt(m.value), m.x, m.y, fs, "#fff",
      { outline: CUTE.ink, outlineWidth: Math.max(3, fs * 0.18) });

    // 지금 뛰면 착지할 매트 — 테두리와 화살표로 미리 알려 준다
    if (i === aimIdx && !resolving) {
      const pulse = 0.5 + 0.5 * Math.sin(now / 160);
      ctx.save();
      ctx.strokeStyle = PARTY.gold;
      ctx.lineWidth = fluidPx(dims, 6, { min: 4, max: 9 });
      ctx.lineJoin = "round";
      ctx.strokeRect(m.x - m.w / 2 - 6, m.y - m.h / 2 - 6, m.w + 12, m.h + 12);
      const ay = m.y - m.h * (1.1 + pulse * 0.12);
      ctx.fillStyle = PARTY.gold;
      ctx.beginPath();
      ctx.moveTo(m.x, ay + m.h * 0.32);
      ctx.lineTo(m.x - m.w * 0.10, ay);
      ctx.lineTo(m.x + m.w * 0.10, ay);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }
}

// ── 재보 — 평소엔 트랙에서 대기, 고르면 포물선을 그리며 날아간다 ──
function drawAthlete(ctx, now, remain) {
  const { w, h } = dims;
  const r = fluidPx(dims, 26, { min: 19, max: 36 });
  let x = w * 0.13, y = h * 0.74, spin = 0;
  if (jump) {
    const t = Math.min(1, (now - jump.at) / 620);
    x = jump.fromX + (jump.toX - jump.fromX) * t;
    y = jump.fromY + (jump.toY - jump.fromY) * t - Math.sin(Math.PI * t) * h * 0.26 * (jump.power || 1);
    spin = t * Math.PI * (jump.ok ? 2 : 0.6);
  } else {
    y += Math.sin(now / 260) * r * 0.10 + crouch * r * 0.5;   // 제자리에서 통통, 웅크리면 내려앉는다
  }
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(spin);
  ctx.translate(-x, -y);
  drawMascot(ctx, x, y, r, CHAR, party.currentMood(remain));
  ctx.restore();
}

// ── 심판 깃발 ──
function drawJudge(ctx) {
  const { w, h } = dims;
  const r = fluidPx(dims, 20, { min: 15, max: 28 });
  const jx = w * 0.955, jy = h * 0.50;
  drawSticker(ctx, jx, jy, r, CUTE.cream, { lineWidth: Math.max(2.5, r * 0.14) });
  ctx.save();
  ctx.font = `${r * 1.1}px sans-serif`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("👨‍⚖️", jx, jy);
  if (flag !== 0) {
    ctx.font = `${r * 1.3}px sans-serif`;
    ctx.fillText(flag > 0 ? "🚩" : "🏳️", jx, jy - r * 1.5);
  }
  ctx.restore();
}

function loop(tsMs) {
  requestAnimationFrame(loop);
  if (mode === "motion" && video.readyState < 2) return;
  const { ctx, w, h } = dims;
  ctx.save();
  shake.apply(ctx);
  if (mode === "motion") drawMirroredVideo(ctx, video, w, h);
  else drawPartyBackdrop(ctx, dims);
  drawDrifters(ctx, drifters, dims, 1 / 60);
  drawBunting(ctx, dims);
  drawCrowd(ctx, dims, party.cheerUntil);

  let result = null;
  poseLm = null;
  if (mode === "motion") {
    result = poseTracker.detect(video, tsMs);
    poseLm = posePoints(result);
    motion.push(tsMs, poseLm, w, h, video);
    if (state === "raise") {
      if (startGate.update(tsMs, isArmRaised(poseLm))) goReady();
    }
  }
  cursors = getCursors(mode, result, w, h, video, pointerInput);

  if (state === "playing") stepGame();

  // 손목 위치를 표시해 준다 — 내 손이 어디로 인식되는지 보이면 조준이 쉬워진다
  if (mode === "motion") {
    const f = motion.last;
    if (f) {
      const r = fluidPx(dims, 26, { min: 18, max: 36 });
      const aimHand = (f.lw.y < f.rw.y) ? "lw" : "rw";
      for (const k of ["lw", "rw"]) {
        drawSticker(ctx, f[k].x, f[k].y, k === aimHand ? r : r * 0.7,
          k === aimHand ? PARTY.gold : "rgba(255,255,255,0.75)", { lineWidth: Math.max(3, r * 0.14) });
      }
    } else if (state === "playing") {
      drawChunkyText(ctx, "카메라에 몸이 보이게 한 걸음 물러서 주세요!", w * 0.5, h * 0.5,
        fluidPx(dims, 22, { min: 16, max: 30 }), "#fff",
        { outline: CUTE.ink, outlineWidth: fluidPx(dims, 6, { min: 4, max: 8 }) });
    }
  } else {
    for (const c of cursors) drawGloveCursor(ctx, c.x, c.y, fluidPx(dims, 44, { min: 32, max: 62 }), { active: aimIdx >= 0 });
  }
  ctx.restore();
}

function stepGame() {
  const { ctx, w, h } = dims;
  // 홀드·게이지는 프레임 수가 아니라 실제 흐른 시간으로 쌓아야 한다.
  // 느린 기기에서 프레임이 떨어지면 제한 시간만 실시간으로 흐르고 게이지는 안 차서 불리해진다.
  const dt = lastFrameAt ? Math.min(0.06, (performance.now() - lastFrameAt) / 1000) : 1 / 60;
  lastFrameAt = performance.now();
  const remain = Math.max(0, playEndAt - performance.now());
  if (remain <= 0) { endGame(); return; }
  const now = performance.now();

  updateAim();
  if (now - roundAt > 300) detectJump(now);
  for (const m of mats) {
    if (m.good > 0) m.good = Math.max(0, m.good - dt * 0.7);
    if (m.bad > 0) m.bad = Math.max(0, m.bad - dt * 0.7);
  }

  drawField(ctx);
  drawMats(ctx, now);
  drawAthlete(ctx, now, remain);
  drawJudge(ctx);

  const hudBottom = party.drawHud(ctx, dims, { remainMs: remain, count, suffix: "번" });

  drawCuteBanner(ctx, dims, [
    { text: round.question, size: 30, chunky: true, color: PARTY.gold },
    { text: round.hint, size: 14, color: CUTE.ink },
  ], fluidPx, { top: hudBottom });

  const guide = mode === "motion"
    ? (aimIdx >= 0 ? "🏃 겨눴어요! 이제 힘껏 점프!" : "손을 들어 좌우로 움직여 매트를 겨눠요")
    : "답이 적힌 매트를 겨누고 눌러요!";
  drawChunkyText(ctx, guide, w * 0.5, h * 0.95, fluidPx(dims, 16, { min: 12, max: 22 }),
    aimIdx >= 0 ? PARTY.gold : "#fff",
    { outline: CUTE.ink, outlineWidth: fluidPx(dims, 5, { min: 3.5, max: 7 }) });

  party.update(dt);
  confetti = updateConfetti(confetti, dt); drawConfetti(ctx, confetti);
  sparks = updateSparkles(sparks, dt); drawSparkles(ctx, sparks);
  party.drawFx(ctx, dims);
  party.drawFeverFrame(ctx, dims);

  drawVignette(ctx, w, h, 0.16);
  drawLevelStars(ctx, dims, autoDiff.level, fluidPx);
}

init();
</script>
