<script type="module">
import {
  HighScore, requestWakeLock, SoundKit, FileAudioLoop,
  HandTracker, ClipRecorder, downloadBlob,
  drawMirroredVideo, fitCanvasToScreen, isHandRaised, getCursors,
  AutoDifficulty, levelFromUrl, medalFor,
  scheduleAutoRecording, ComboShot, drawPhotoOverlay,
  ScreenShake, InputMode, PointerInput, StartGate,
  startCamera, formatFileTimestamp, fluidPx, showSoundHint,
  drawVignette, spawnConfetti, updateConfetti, drawConfetti,
} from "../js/engine.js?v=3";
import {
  CUTE, bob, drawSticker, drawStickerRect, drawChunkyText,
  spawnSparkles, updateSparkles, drawSparkles, makeDrifters, drawDrifters,
  drawBunting, drawGloveCursor, drawLevelStars, drawCuteBanner,
} from "../js/cute.js?v=6";
import {
  PARTY, CHARACTERS, Party, HandPair, drawTwoHandHint,
  drawPartyBackdrop, drawCrowd, drawMascot,
  showRuleCard, renderPodium, irisTransition,
} from "../js/party.js?v=2";
requestWakeLock();

const UNIT = "f1";
const TITLE = "어림 게이트";
const RECORD_SUFFIX = "개 처리";
const MEDALS = { bronze: 10, silver: 18, gold: 26 };
const CHAR = CHARACTERS[UNIT];
const mode = InputMode.get();

const video = document.getElementById("video");
const canvas = document.getElementById("gameCanvas");
let dims = fitCanvasToScreen(canvas);
let drifters = makeDrifters(10, dims.w, dims.h);
window.addEventListener("resize", () => {
  dims = fitCanvasToScreen(canvas);
  drifters = makeDrifters(10, dims.w, dims.h);
});

const sound = new SoundKit();
const bgm = new FileAudioLoop("../assets/sounds/subbgm.mp3", 0.32);
const isMuted = () => localStorage.getItem("smo_muted") === "1";
const party = new Party({ unit: UNIT, sound, isMuted });
const hands = new HandPair();

function goHome() { bgm.stop(); irisTransition(() => { location.href = "../index.html"; }); }
document.getElementById("homeBtn").addEventListener("click", goHome);
document.getElementById("homeBtn2").addEventListener("click", goHome);

function randInt(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// ---------------------------------------------------------------------------
// 조건 만들기 — 조건은 곧 "수직선 위의 한 구간"이다.
// 학생은 그 구간을 두 손으로 만들어야 하므로, 조건마다 정답 구간 [lo, hi]를 함께 들고 다닌다.
// ---------------------------------------------------------------------------
const PLACES = { 10: "십의 자리", 100: "백의 자리" };

// 정답 범위 vs 학생 범위의 교집합/합집합 비율 (Jaccard Index)
// 범위가 정확할수록 1.0에 가깝고, 작거나 크면 감점한다
function computeRangeAccuracy(studLo, studHi, correctLo, correctHi) {
  if (studLo === null || studHi === null) return 0;
  const inter = Math.max(0, Math.min(studHi, correctHi) - Math.max(studLo, correctLo));
  const union = (studHi - studLo) + (correctHi - correctLo) - inter;
  if (union <= 0) return 0;
  return Math.min(1.0, inter / union);
}

function genCondition(level) {
  if (level === 1) {
    // 이상 / 이하 / 초과 / 미만 — 정수 눈금이라 경계 포함 여부가 그대로 구간 끝이 된다
    const scale = { vMin: 0, vMax: 60, snap: 1, tick: 5, labelEvery: 10 };
    const a = randInt(8, 26), b = a + randInt(10, 22);
    const lowIncl = Math.random() < 0.5;
    const highIncl = Math.random() < 0.5;
    const lo = lowIncl ? a : a + 1;
    const hi = highIncl ? b : b - 1;
    return {
      ...scale, lo, hi,
      text: `${a} ${lowIncl ? "이상" : "초과"} ${b} ${highIncl ? "이하" : "미만"}인 수`,
      hint: "이상·이하는 그 수를 포함! 초과·미만은 포함하지 않아요",
    };
  }
  if (level === 2) {
    // 올림 / 버림 — 문 폭을 딱 맞추는 것이 곧 개념
    const op = Math.random() < 0.5 ? "올림" : "버림";
    const p = Math.random() < 0.5 ? 10 : 100;
    const scale = p === 10
      ? { vMin: 100, vMax: 400, snap: 1, tick: 10, labelEvery: 50 }
      : { vMin: 0, vMax: 1000, snap: 10, tick: 50, labelEvery: 200 };
    const target = p === 10 ? randInt(13, 38) * 10 : randInt(2, 9) * 100;
    // 올림해서 target이 되는 수: (target-p, target]  /  버림해서 target이 되는 수: [target, target+p)
    const lo = op === "올림" ? target - p + 1 : target;
    const hi = op === "올림" ? target : target + p - 1;
    return {
      ...scale, lo, hi,
      text: `${op}하여 ${PLACES[p]}까지 나타내면 ${target}이 되는 수`,
      hint: op === "올림" ? "남은 자리가 0이 아니면 무조건 올려요" : "남은 자리는 무조건 버려요",
    };
  }
  // ⭐3 반올림 — 정답 구간이 target을 가운데 두고 양쪽으로 절반씩 벌어진다
  const p = 100;
  const target = randInt(2, 9) * 100;
  return {
    vMin: 0, vMax: 1000, snap: 10, tick: 50, labelEvery: 200,
    lo: target - p / 2, hi: target + p / 2 - 1,
    text: `반올림하여 ${PLACES[p]}까지 나타내면 ${target}이 되는 수`,
    hint: "바로 아래 자리가 5보다 작으면 버리고, 5이거나 크면 올려요",
  };
}

// 한 조건마다 카드 한 묶음 — 정답 수와 오답 수를 섞고, 오답은 경계 바로 바깥에 몰아둔다
function genCards(cond, n) {
  const out = [];
  const inside = () => randInt(cond.lo, cond.hi);
  const outside = () => {
    for (let i = 0; i < 80; i++) {
      // 경계 바로 바깥(±1~2칸)이 대부분이라 찍어서는 못 맞힌다
      const near = Math.random() < 0.7;
      const v = near
        ? (Math.random() < 0.5 ? cond.lo - randInt(1, 2) * cond.snap : cond.hi + randInt(1, 2) * cond.snap)
        : randInt(cond.vMin, cond.vMax);
      if (v < cond.vMin || v > cond.vMax) continue;
      if (v >= cond.lo && v <= cond.hi) continue;
      return Math.round(v / cond.snap) * cond.snap;
    }
    return cond.vMax;
  };
  for (let i = 0; i < n; i++) {
    const good = i % 2 === 0;
    out.push({ v: good ? inside() : outside(), good });
  }
  return shuffle(out);
}

const handTracker = new HandTracker();
let pointerInput = null;

async function init() {
  if (!isMuted()) bgm.play(showSoundHint);
  if (mode === "motion") {
    try {
      await startCamera(video, { width: 640, height: 480 });
      if (!isMuted()) bgm.play(showSoundHint);
    } catch (e) {
      document.getElementById("loadingText").textContent = "⚠️ 카메라를 찾을 수 없어요. 카메라 권한을 확인해주세요.";
      return;
    }
    document.getElementById("loadingText").textContent = "AI 모델을 불러오는 중…";
    await handTracker.init(2);
  } else {
    pointerInput = new PointerInput(canvas);
  }
  document.getElementById("loadingPanel").style.display = "none";

  await showRuleCard({
    unit: UNIT,
    title: "어림 게이트",
    lines: [
      mode === "motion"
        ? "<b>양손을 벌리면</b> 그 사이가 문이 돼요. 손 위치가 곧 문기둥이에요."
        : mode === "touch"
          ? "<b>두 손가락</b>으로 문기둥을 하나씩 잡고 벌려요."
          : "문기둥을 <b>드래그</b>해서 옮겨요.",
      "조건에 맞는 수는 <b>문 안으로 통과</b>, 아닌 수는 <b>막아내요.</b> 둘 다 점수예요!",
      "<b>문의 폭이 정확할수록 높은 점수!</b> 너무 크거나 작으면 점수가 낮아져요. 조건과 <b>정확히 같은 폭</b>일 때 만점이에요.",
      "문 위에 <b>지금 만든 범위</b>가 숫자로 계속 보여요. 그걸 보고 정확히 맞추세요!",
    ],
  });

  document.getElementById("raiseIcon").textContent = mode === "motion" ? "🙌" : "👆";
  document.getElementById("raiseText").textContent = mode === "motion" ? "두 손을 들어 주세요!" : "화면을 터치(클릭)하면 시작!";
  document.getElementById("raisePanel").style.display = "flex";
  state = "raise";
  requestAnimationFrame(loop);
}

let state = "loading";
const holdFill = document.getElementById("holdFill");
const startGate = new StartGate(mode, holdFill);

let autoDiff, count, playEndAt;
let cond, cards, nextSpawnAt, waveLeft;
let gateLo = null, gateHi = null;       // 지금 만든 구간 (값)
let grabbed = null;                     // 마우스/한손가락으로 잡은 기둥
let confetti = [], sparks = [];
const shake = new ScreenShake();
let recorder, comboShot, fallbackShot, autoRec, recordedBlob = null;
const recIndicator = document.getElementById("recIndicator");
let cursors = [];
let lastFrameAt = 0;

const GY = () => dims.h * 0.76;                 // 문이 서 있는 바닥선
// 카드는 문제 배너 아래에서 나타나야 한다 — 더 위에서 떨어뜨리면 절반을 배너에 가려 안 보인다
const TOPY = () => dims.h * 0.37;
const X0 = () => dims.w * 0.07;
const X1 = () => dims.w * 0.93;
const vToX = (v) => X0() + ((v - cond.vMin) / (cond.vMax - cond.vMin)) * (X1() - X0());
const xToV = (x) => cond.vMin + ((x - X0()) / (X1() - X0())) * (cond.vMax - cond.vMin);
const snapV = (v) => Math.round(Math.max(cond.vMin, Math.min(cond.vMax, v)) / cond.snap) * cond.snap;
const fallMs = () => [3800, 3200, 2700][autoDiff.level - 1];

function newWave() {
  cond = genCondition(autoDiff.level);
  cards = [];
  waveLeft = 6;
  nextSpawnAt = performance.now() + 700;
  // 새 조건이 나오면 기존 문 폭은 유지하되 값만 새 눈금에 맞춘다
  gateLo = null; gateHi = null;
}

function startCountdown() {
  state = "countdown";
  document.getElementById("countdownPanel").style.display = "flex";
  const numEl = document.getElementById("countNum");
  let n = 3;
  numEl.textContent = n;
  if (!isMuted()) sound.countBeep();
  const iv = setInterval(() => {
    n--;
    if (n <= 0) {
      clearInterval(iv);
      document.getElementById("countdownPanel").style.display = "none";
      if (!isMuted()) sound.go();
      beginPlay();
    } else {
      numEl.textContent = n;
      if (!isMuted()) sound.countBeep();
    }
  }, 700);
}

function beginPlay() {
  state = "playing";
  const prev = HighScore.get(UNIT);
  autoDiff = new AutoDifficulty(levelFromUrl(AutoDifficulty.startLevelFromHighScore(prev)));
  count = 0;
  party.reset();
  hands.reset();
  confetti = []; sparks = [];
  playEndAt = performance.now() + 60000;
  lastFrameAt = 0;
  newWave();

  recorder = new ClipRecorder(canvas, sound, 24);
  recorder.prepare();
  comboShot = new ComboShot(canvas);
  fallbackShot = new ComboShot(canvas);
  autoRec = scheduleAutoRecording(recorder, {
    onStartVisual: () => {
      recIndicator.style.display = "flex";
      setTimeout(() => { if (!comboShot.captured) fallbackShot.capture(canvas); }, 1500);
    },
    onEndVisual: () => { recIndicator.style.display = "none"; },
    onDone: (blob) => { recordedBlob = blob; },
    fallbackMs: 8000,
  });
}

// 카드가 문 높이에 닿았을 때의 판정
//
// 통과시킨 것뿐 아니라 **잘 막아낸 것도 점수**로 친다. 범위가 정확할수록 높은 점수를 준다.
// 범위가 너무 크거나 작으면 일부 카드를 놓치거나 들여보내게 되어 자동으로 감점된다.
// 결국 조건과 정확히 같은 폭으로 만들어야 최고 점수를 받는다.
function resolveCard(c) {
  c.done = true;
  const passed = gateLo !== null && c.v >= gateLo && c.v <= gateHi;
  const x = vToX(c.v);
  const py = GY() - fluidPx(dims, 70, { min: 50, max: 100 });

  if (c.good === passed) {
    count++;
    c.result = c.good ? "ok" : "blocked";

    // 범위 정확도에 따라 점수 계산: 정확할수록 높음
    const rangeAccuracy = computeRangeAccuracy(gateLo, gateHi, cond.lo, cond.hi);
    const basePoints = c.good ? 10 : 7;
    const finalPoints = Math.round(basePoints * rangeAccuracy);

    party.correct(x, py, { base: finalPoints, elapsedMs: 2500 });
    if (party.combo > 0 && party.combo === party.maxCombo) comboShot.capture(canvas);
    autoDiff.reportCorrect();
    autoRec.trigger();
    spawnSparkles(sparks, x, GY(), c.good ? 18 : 10, ["#fff", PARTY.gold, CUTE.green]);
    if (c.good) spawnConfetti(confetti, x, GY(), 18);
  } else if (passed) {
    c.result = "leak";                       // 들어오면 안 되는 수를 들여보냈다
    party.wrong(x, py, "조건 밖이에요!");
    autoDiff.reportWrong();
    shake.trigger(5, 160);
  } else {
    c.result = "miss";                       // 받아야 할 수를 놓쳤다
    party.wrong(x, py, "놓쳤어요!");
    autoDiff.reportWrong();
  }
}

function endGame() {
  state = "result";
  const { medal, label } = medalFor(count, MEDALS);
  const prev = HighScore.get(UNIT);
  const best = Math.max(count, prev ? prev.count : 0);
  if (!prev || count >= prev.count) {
    HighScore.set(UNIT, { count, bestLevel: autoDiff.level, label: `${medal} ${count}${RECORD_SUFFIX}`, at: Date.now() });
  }
  renderPodium({ unit: UNIT, medal, label, coins: party.coins, maxCombo: party.maxCombo, count, suffix: RECORD_SUFFIX, best });

  document.getElementById("statCount").textContent = count + "개";
  document.getElementById("statBest").textContent = best + "개";
  document.getElementById("statCombo").textContent = "🔥" + party.maxCombo;

  const shot = comboShot.captured ? comboShot : fallbackShot;
  const previewVideo = document.getElementById("previewVideo");
  const saveVideoBtn = document.getElementById("saveVideoBtn");
  if (recordedBlob) {
    previewVideo.src = URL.createObjectURL(recordedBlob);
    previewVideo.style.display = "block";
    saveVideoBtn.style.display = "inline-block";
  }
  document.getElementById("savePhotoBtn").onclick = async () => {
    const blob = await shot.toBlob((c, w, h) => drawPhotoOverlay(c, w, h, { title: TITLE, record: count + RECORD_SUFFIX, medal }));
    downloadBlob(blob, `수학체육올림픽5_어림게이트_${formatFileTimestamp()}.png`);
  };
  document.getElementById("saveVideoBtn").onclick = () => {
    if (recordedBlob) downloadBlob(recordedBlob, `수학체육올림픽5_어림게이트_${formatFileTimestamp()}.${recorder.extension}`);
  };
  document.getElementById("resultPanel").style.display = "flex";
  if (!isMuted()) sound.success();
}

document.getElementById("retryBtn").addEventListener("click", () => {
  document.getElementById("resultPanel").style.display = "none";
  document.getElementById("raisePanel").style.display = "flex";
  startGate.since = 0; startGate.ready = false; holdFill.style.width = "0%";
  state = "raise";
});

document.getElementById("raisePanel").addEventListener("click", () => {
  if (state === "raise" && mode !== "motion") goReady();
});

function goReady() {
  state = "ready";
  document.getElementById("raisePanel").style.display = "none";
  document.getElementById("readyPanel").style.display = "flex";
  if (!isMuted()) sound.click();
  setTimeout(() => {
    document.getElementById("readyPanel").style.display = "none";
    startCountdown();
  }, 500);
}

function loop(tsMs) {
  requestAnimationFrame(loop);
  if (mode === "motion" && video.readyState < 2) return;
  const { ctx, w, h } = dims;
  ctx.save();
  shake.apply(ctx);
  if (mode === "motion") drawMirroredVideo(ctx, video, w, h);
  else drawPartyBackdrop(ctx, dims);
  drawDrifters(ctx, drifters, dims, 1 / 60);
  drawBunting(ctx, dims);
  drawCrowd(ctx, dims, party.cheerUntil);

  let result = null;
  if (mode === "motion") {
    result = handTracker.detect(video, tsMs);
    if (state === "raise") {
      // 양손 종목이므로 시작도 두 손을 들어야 한다 — 첫 동작부터 "두 손 게임"임을 알린다
      let raised = 0;
      if (result && result.landmarks) for (const lm of result.landmarks) if (isHandRaised(lm)) raised++;
      if (startGate.update(tsMs, raised >= 2)) goReady();
    }
  }
  cursors = getCursors(mode, result, w, h, video, pointerInput);
  hands.update(cursors);

  if (state === "playing") stepGame();

  for (const c of cursors) drawGloveCursor(ctx, c.x, c.y, fluidPx(dims, 42, { min: 30, max: 58 }), { active: gateLo !== null });
  ctx.restore();
}

// ── 입력: 두 손(또는 두 손가락) x 위치가 그대로 문기둥이 된다 ──────────────
function updateGate() {
  const lox = X0(), hix = X1();
  const clamp = (x) => Math.max(lox, Math.min(hix, x));

  if (mode === "motion") {
    if (hands.both) {
      gateLo = snapV(xToV(clamp(hands.left.x)));
      gateHi = snapV(xToV(clamp(hands.right.x)));
    }
    return;
  }

  const pts = pointerInput ? pointerInput.points : [];
  if (pts.length >= 2) {
    const s = [...pts].sort((a, b) => a.x - b.x);
    gateLo = snapV(xToV(clamp(s[0].x)));
    gateHi = snapV(xToV(clamp(s[s.length - 1].x)));
    grabbed = null;
    return;
  }
  if (pts.length === 1) {
    // 손가락(마우스)이 하나면 가까운 기둥을 잡아 옮긴다
    if (gateLo === null) {
      const c = snapV(xToV(clamp(pts[0].x)));
      const span = (cond.vMax - cond.vMin) * 0.12;
      gateLo = snapV(c - span); gateHi = snapV(c + span);
      return;
    }
    if (!pointerInput.down) { grabbed = null; return; }
    if (!grabbed) {
      grabbed = Math.abs(pts[0].x - vToX(gateLo)) <= Math.abs(pts[0].x - vToX(gateHi)) ? "lo" : "hi";
    }
    const v = snapV(xToV(clamp(pts[0].x)));
    if (grabbed === "lo") gateLo = Math.min(v, gateHi); else gateHi = Math.max(v, gateLo);
  }
}

function stepGame() {
  const { ctx, w, h } = dims;
  // 홀드·게이지는 프레임 수가 아니라 실제 흐른 시간으로 쌓아야 한다.
  // 느린 기기에서 프레임이 떨어지면 제한 시간만 실시간으로 흐르고 게이지는 안 차서 불리해진다.
  const dt = lastFrameAt ? Math.min(0.06, (performance.now() - lastFrameAt) / 1000) : 1 / 60;
  lastFrameAt = performance.now();
  const remain = Math.max(0, playEndAt - performance.now());
  if (remain <= 0) { endGame(); return; }
  const now = performance.now();

  updateGate();
  if (gateLo !== null && gateLo > gateHi) { const t = gateLo; gateLo = gateHi; gateHi = t; }

  // 카드 등장
  if (waveLeft > 0 && now >= nextSpawnAt) {
    const batch = genCards(cond, 1);
    cards.push({ ...batch[0], born: now, done: false });
    waveLeft--;
    nextSpawnAt = now + (autoDiff.level === 3 ? 720 : 900);
  }
  // 한 묶음을 다 처리했으면 다음 조건으로
  if (waveLeft === 0 && cards.every((c) => c.done) && cards.length > 0) {
    if (!cards.pendingSwap) {
      cards.pendingSwap = true;
      setTimeout(() => { if (state === "playing") newWave(); }, 650);
    }
  }

  const gy = GY(), topy = TOPY();
  for (const c of cards) {
    if (c.done) continue;
    const t = (now - c.born) / fallMs();
    c.y = topy + (gy - topy) * t;
    if (t >= 1) resolveCard(c);
  }

  // ── 그리기 ──────────────────────────────────────────────
  // 바닥(수직선)
  ctx.save();
  ctx.fillStyle = "rgba(140,233,154,0.42)";
  ctx.fillRect(0, gy, w, h - gy);
  ctx.strokeStyle = CUTE.ink;
  ctx.lineWidth = fluidPx(dims, 4, { min: 3, max: 6 });
  ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(w, gy); ctx.stroke();
  // 눈금과 숫자 — 손을 어디에 둘지 판단하는 유일한 근거이므로 진하게 그린다
  const labelSize = fluidPx(dims, 14, { min: 10, max: 19 });
  for (let v = cond.vMin; v <= cond.vMax + 1e-9; v += cond.tick) {
    const x = vToX(v);
    const isLabel = Math.abs(v % cond.labelEvery) < 1e-9;
    ctx.beginPath();
    ctx.moveTo(x, gy);
    ctx.lineTo(x, gy + (isLabel ? fluidPx(dims, 15, { min: 11, max: 21 }) : fluidPx(dims, 8, { min: 6, max: 11 })));
    ctx.lineWidth = isLabel ? fluidPx(dims, 3, { min: 2.2, max: 4.5 }) : fluidPx(dims, 1.8, { min: 1.2, max: 2.6 });
    ctx.strokeStyle = CUTE.ink;
    ctx.stroke();
    if (isLabel) {
      ctx.fillStyle = CUTE.ink;
      ctx.font = `900 ${labelSize}px sans-serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "top";
      ctx.fillText(String(Math.round(v)), x, gy + fluidPx(dims, 19, { min: 14, max: 25 }));
    }
  }
  ctx.restore();

  // 문 (두 기둥 + 위쪽 들보)
  const postW = fluidPx(dims, 16, { min: 12, max: 24 });
  const postH = fluidPx(dims, 110, { min: 78, max: 150 });
  if (gateLo !== null) {
    const lx = vToX(gateLo), hx = vToX(gateHi);
    // 문 안쪽을 밝게 칠해 "여기가 내가 만든 범위"임을 한눈에 보이게
    ctx.save();
    const g = ctx.createLinearGradient(0, gy - postH, 0, gy);
    g.addColorStop(0, "rgba(255,207,63,0.10)");
    g.addColorStop(1, "rgba(255,207,63,0.42)");
    ctx.fillStyle = g;
    ctx.fillRect(lx, gy - postH, hx - lx, postH);
    ctx.restore();

    for (const [x, v] of [[lx, gateLo], [hx, gateHi]]) {
      drawStickerRect(ctx, x, gy - postH / 2, postW, postH, postW * 0.4, CUTE.red, {
        lineWidth: fluidPx(dims, 3.5, { min: 2.5, max: 5 }), drop: 3,
      });
      drawChunkyText(ctx, String(v), x, gy - postH - fluidPx(dims, 14, { min: 10, max: 19 }),
        fluidPx(dims, 20, { min: 14, max: 26 }), "#fff",
        { outline: CUTE.ink, outlineWidth: fluidPx(dims, 5, { min: 3.5, max: 7 }) });
    }
    // 들보 + 지금 만든 범위 표시
    drawStickerRect(ctx, (lx + hx) / 2, gy - postH, Math.max(postW, hx - lx), postW * 0.85, postW * 0.35, CUTE.redDark, {
      lineWidth: fluidPx(dims, 3, { min: 2, max: 4.5 }), drop: 2,
    });
    drawChunkyText(ctx, `내 문: ${gateLo} ~ ${gateHi}`, (lx + hx) / 2, gy - postH - fluidPx(dims, 40, { min: 28, max: 55 }),
      fluidPx(dims, 19, { min: 14, max: 25 }), PARTY.gold,
      { outline: CUTE.ink, outlineWidth: fluidPx(dims, 5, { min: 3.5, max: 7 }) });
  }

  // 떨어지는 수 카드
  const cw = fluidPx(dims, 62, { min: 46, max: 88 });
  const ch = fluidPx(dims, 40, { min: 30, max: 56 });
  for (const c of cards) {
    if (c.done) {
      // 결과가 잠깐 남아 왜 그렇게 됐는지 보이게 한다
      if (now - c.born > fallMs() + 700) continue;
      const x = vToX(c.v);
      const col = c.result === "ok" ? CUTE.green : c.result === "blocked" ? CUTE.cream : CUTE.red;
      drawStickerRect(ctx, x, gy - ch * 0.6, cw, ch, ch * 0.3, col, { lineWidth: 3.5, drop: 3 });
      drawChunkyText(ctx, String(c.v), x, gy - ch * 0.6, ch * 0.56,
        col === CUTE.cream ? CUTE.ink : "#fff", { outline: col === CUTE.cream ? "#fff" : CUTE.ink, outlineWidth: 3.5 });
      continue;
    }
    const x = vToX(c.v);
    drawStickerRect(ctx, x, c.y, cw, ch, ch * 0.3, CUTE.cream, {
      lineWidth: fluidPx(dims, 4, { min: 3, max: 6 }), drop: fluidPx(dims, 5, { min: 3, max: 8 }),
    });
    drawChunkyText(ctx, String(c.v), x, c.y, ch * 0.58, CUTE.ink, { outline: "#ffffff", outlineWidth: 4 });
  }

  // 깡총이 — 수직선 아래 잔디에서 응원 (눈금 숫자를 가리지 않는 자리)
  const cr = fluidPx(dims, 24, { min: 18, max: 33 });
  drawMascot(ctx, w * 0.9, gy + (h - gy) * 0.5, cr, CHAR, party.currentMood(remain));

  const hudBottom = party.drawHud(ctx, dims, { remainMs: remain, count, suffix: "개" });
  drawCuteBanner(ctx, dims, [
    { text: cond.text, size: 25, chunky: true, color: PARTY.gold },
    { text: cond.hint, size: 14, color: CUTE.ink },
  ], fluidPx, { top: hudBottom });

  if (mode === "motion" && !hands.both) drawTwoHandHint(ctx, dims, fluidPx);

  party.update(dt);
  confetti = updateConfetti(confetti, dt); drawConfetti(ctx, confetti);
  sparks = updateSparkles(sparks, dt); drawSparkles(ctx, sparks);
  party.drawFx(ctx, dims);
  party.drawFeverFrame(ctx, dims);

  drawVignette(ctx, w, h, 0.16);
  drawLevelStars(ctx, dims, autoDiff.level, fluidPx);
}

init();
</script>
</body>
