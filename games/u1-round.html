<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>베이스 송구 · 종목 1</title>
<link rel="stylesheet" href="../css/style.css?v=6">
</head>
<body>

<div class="game-stage">
  <video id="video" playsinline muted style="display:none"></video>
  <canvas id="gameCanvas"></canvas>

  <div class="hud">
    <div class="rec" id="recIndicator" style="display:none"><span class="dot"></span>REC</div>
    <button class="home-btn" id="homeBtn">🏠</button>
  </div>

  <div class="overlay-panel" id="loadingPanel">
    <h2>⚾ 베이스 송구</h2>
    <p id="loadingText">준비 중…</p>
  </div>

  <div class="overlay-panel" id="rulePanel" style="display:none">
    <div class="rule-card">
      <div class="rule-head">
        <div class="rule-char">🐰</div>
        <div>
          <div class="rule-name">깡총이</div>
          <h2 class="rule-title">베이스 송구</h2>
        </div>
      </div>
      <p class="rule-cheer"></p>
      <ul class="rule-list"></ul>
      <div class="rule-timer"><div class="rule-timer-fill"></div></div>
      <button class="rule-go">좋아, 시작!</button>
    </div>
  </div>

  <div class="overlay-panel" id="raisePanel" style="display:none">
    <div class="raise-icon" id="raiseIcon">🙋</div>
    <h2 id="raiseText">손을 들어 주세요!</h2>
    <div class="hold-bar"><div class="hold-fill" id="holdFill"></div></div>
  </div>

  <div class="overlay-panel ready-flash" id="readyPanel" style="display:none">
    <h2>✋ 좋아요! 준비됐어요</h2>
  </div>

  <div class="overlay-panel" id="countdownPanel" style="display:none">
    <div class="countdown-num" id="countNum">3</div>
  </div>

  <div class="overlay-panel" id="resultPanel" style="display:none">
    <div id="podium"></div>
    <div class="result-stats">
      <div class="stat-box"><div class="num" id="statCount">0번</div><div class="label">잡은 아웃</div></div>
      <div class="stat-box"><div class="num" id="statBest">0번</div><div class="label">최고 기록</div></div>
      <div class="stat-box"><div class="num" id="statCombo">0</div><div class="label">최고 콤보</div></div>
    </div>
    <video class="preview" id="previewVideo" controls playsinline style="display:none"></video>
    <div class="action-row">
      <button class="ghost-btn" id="savePhotoBtn">📸 사진</button>
      <button class="ghost-btn" id="saveVideoBtn" style="display:none">🎬 3초 영상</button>
      <button class="big-btn" id="retryBtn">🔁 한 번 더</button>
      <button class="ghost-btn" id="homeBtn2">🏠 종목 선택</button>
    </div>
  </div>
</div>

<script type="module">
import {
  HighScore, requestWakeLock, SoundKit, FileAudioLoop,
  HandTracker, ClipRecorder, downloadBlob,
  drawMirroredVideo, fitCanvasToScreen, isHandRaised, getCursors,
  AutoDifficulty, levelFromUrl, medalFor,
  scheduleAutoRecording, ComboShot, drawPhotoOverlay,
  ScreenShake, InputMode, PointerInput, StartGate,
  startCamera, formatFileTimestamp, fluidPx, showSoundHint,
  drawVignette, spawnConfetti, updateConfetti, drawConfetti,
} from "../js/engine.js?v=4";
import {
  CUTE, LANE_COLORS, bob, drawSticker, drawStickerRect, drawChunkyText,
  spawnSparkles, updateSparkles, drawSparkles, makeDrifters, drawDrifters,
  drawBunting, drawGloveCursor, drawLevelStars, drawCuteBanner,
} from "../js/cute.js?v=7";
import {
  PARTY, CHARACTERS, Party, drawPartyBackdrop, drawCrowd, drawMascot,
  showRuleCard, renderPodium, irisTransition,
} from "../js/party.js?v=2";
requestWakeLock();

const UNIT = "f1";
const TITLE = "베이스 송구";
const RECORD_SUFFIX = "번 아웃";
const MEDALS = { bronze: 5, silver: 9, gold: 13 };
const CHAR = CHARACTERS[UNIT];
const mode = InputMode.get();

const video = document.getElementById("video");
const canvas = document.getElementById("gameCanvas");
let dims = fitCanvasToScreen(canvas);
let drifters = makeDrifters(10, dims.w, dims.h);
window.addEventListener("resize", () => {
  dims = fitCanvasToScreen(canvas);
  drifters = makeDrifters(10, dims.w, dims.h);
  if (round) layoutGates();
});

const sound = new SoundKit();
const bgm = new FileAudioLoop("../assets/sounds/subbgm.mp3", 0.32);
const isMuted = () => localStorage.getItem("smo_muted") === "1";
const party = new Party({ unit: UNIT, sound, isMuted });

function goHome() { bgm.stop(); irisTransition(() => { location.href = "../index.html"; }); }
document.getElementById("homeBtn").addEventListener("click", goHome);
document.getElementById("homeBtn2").addEventListener("click", goHome);

function randInt(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// ---------------------------------------------------------------------------
// 베이스 만들기 — 베이스들은 수직선을 빈틈없이 나눠 가지므로,
// 어떤 수가 내려와도 보낼 곳이 정확히 하나다. "어디에도 못 보내는" 일이 없다.
// ---------------------------------------------------------------------------
function genRound(level) {
  if (level === 1) {
    // 이상·이하·초과·미만 — 경계를 포함하는지가 곧 정답을 가른다
    const t = randInt(15, 45);
    const incl = Math.random() < 0.5;
    const gates = incl
      ? [{ label: `${t} 이하`, test: (n) => n <= t }, { label: `${t} 초과`, test: (n) => n > t }]
      : [{ label: `${t} 미만`, test: (n) => n < t }, { label: `${t} 이상`, test: (n) => n >= t }];
    // 경계 근처 수를 자주 내보내야 이상/초과의 차이를 실제로 쓰게 된다
    const n = Math.max(1, t + randInt(-5, 5));
    return {
      n, gates, fallMs: 5000,
      title: "숫자를 알맞은 베이스로 보내요!",
      hint: incl ? "이하는 그 수를 포함해요. 초과는 포함하지 않아요" : "미만은 그 수를 포함하지 않아요. 이상은 포함해요",
    };
  }
  if (level === 2) {
    // 올림 / 버림 — 십의 자리까지
    const up = Math.random() < 0.5;
    const base = randInt(1, 4) * 10;                 // 베이스 3개의 시작값
    const vals = [base + 10, base + 20, base + 30];
    const gates = vals.map((v) => ({
      label: `${up ? "올림" : "버림"} → ${v}`,
      test: (n) => (up ? Math.ceil(n / 10) * 10 : Math.floor(n / 10) * 10) === v,
    }));
    // 세 베이스 중 하나에 반드시 들어가는 수를 고른다
    const pick = vals[randInt(0, 2)];
    const n = up ? randInt(pick - 9, pick) : randInt(pick, pick + 9);
    return {
      n, gates, fallMs: 4600,
      title: `${up ? "올림" : "버림"}하여 십의 자리까지!`,
      hint: up ? "남은 자리가 0이 아니면 무조건 올려요" : "남은 자리는 무조건 버려요",
    };
  }
  // ⭐3 반올림 — 베이스 4개
  const vals = [10, 20, 30, 40];
  const gates = vals.map((v) => ({
    label: `반올림 → ${v}`,
    test: (n) => Math.round(n / 10) * 10 === v,
  }));
  const pick = vals[randInt(0, 3)];
  const n = randInt(Math.max(5, pick - 5), pick + 4);
  return {
    n, gates, fallMs: 4200,
    title: "반올림하여 십의 자리까지!",
    hint: "바로 아래 자리가 5보다 작으면 버리고, 5이거나 크면 올려요",
  };
}

const handTracker = new HandTracker();
let pointerInput = null;

async function init() {
  if (!isMuted()) bgm.play(showSoundHint);
  if (mode === "motion") {
    try {
      await startCamera(video, { width: 640, height: 480 });
      if (!isMuted()) bgm.play(showSoundHint);
    } catch (e) {
      document.getElementById("loadingText").textContent = "⚠️ 카메라를 찾을 수 없어요. 카메라 권한을 확인해주세요.";
      return;
    }
    document.getElementById("loadingText").textContent = "AI 모델을 불러오는 중…";
    await handTracker.init(1);
  } else {
    pointerInput = new PointerInput(canvas);
  }
  document.getElementById("loadingPanel").style.display = "none";

  await showRuleCard({
    unit: UNIT,
    title: "베이스 송구",
    lines: [
      "야수가 된 거예요! 위에서 <b>숫자 공</b>이 날아와요. 아래에는 <b>베이스</b>가 여러 개 있어요.",
      mode === "motion"
        ? "<b>손을 좌우로 움직이면</b> 공이 따라와요. 조건에 맞는 베이스 위로 옮기세요!"
        : "<b>화면에서 좌우로 움직이면</b> 공이 따라와요. 조건에 맞는 베이스 위로 옮기세요!",
      mode === "motion"
        ? "베이스를 정했으면 <b>손을 아래로 쑥 내려</b> 공을 송구해요! (그냥 두면 저절로 내려가요)"
        : "베이스를 정했으면 <b>화면을 눌러</b> 공을 송구해요! (그냥 두면 저절로 내려가요)",
      "베이스마다 <b>수의 범위 조건</b>이 붙어 있어요. 알맞은 곳으로 보내면 <b>아웃!</b>",
      "⭐1 <b>이상·이하·초과·미만</b> → ⭐2 <b>올림·버림</b> → ⭐3 <b>반올림</b>",
    ],
  });

  document.getElementById("raiseIcon").textContent = mode === "motion" ? "🙋" : "👆";
  document.getElementById("raiseText").textContent = mode === "motion" ? "손을 들어 주세요!" : "화면을 터치(클릭)하면 시작!";
  document.getElementById("raisePanel").style.display = "flex";
  state = "raise";
  requestAnimationFrame(loop);
}

let state = "loading";
const holdFill = document.getElementById("holdFill");
const startGate = new StartGate(mode, holdFill);

let autoDiff, count, playEndAt;
let round = null, gates = [], ball = null, roundAt, resolving;
let netShake = 0, judgedIdx = -1, judgedOk = false;
let handTrail = [];          // 최근 손 높이 — 아래로 내리는 동작을 잡는다
let dropFlash = 0;           // 떨어뜨린 순간의 표시
let confetti = [], sparks = [];
const shake = new ScreenShake();
let recorder, comboShot, fallbackShot, autoRec, recordedBlob = null;
const recIndicator = document.getElementById("recIndicator");
let cursors = [];
let lastFrameAt = 0;

// 베이스가 놓인 줄 — 공이 이 높이에 닿으면 판정한다
function goalLineY() { return dims.h * 0.76; }
// 공이 나오는 높이 — 문제 배너에 가리면 숫자를 못 읽으므로 그 아래에서 시작한다
function ballStartY() { return dims.h * 0.36; }

function layoutGates() {
  const { w } = dims;
  const n = round.gates.length;
  const fieldX = w * 0.04, fieldW = w * 0.92;
  const gw = fieldW / n;
  gates = round.gates.map((g, i) => ({
    ...g,
    x: fieldX + gw * i + gw / 2,
    w: gw * 0.94,
  }));
}

function newRound() {
  round = genRound(autoDiff.level);
  layoutGates();
  ball = { n: round.n, x: dims.w / 2, y: ballStartY(), r: 0, dropped: false };
  resolving = false;
  judgedIdx = -1;
  handTrail = [];
  dropFlash = 0;
  roundAt = performance.now();
}

function startCountdown() {
  state = "countdown";
  document.getElementById("countdownPanel").style.display = "flex";
  const numEl = document.getElementById("countNum");
  let n = 3;
  numEl.textContent = n;
  if (!isMuted()) sound.countBeep();
  const iv = setInterval(() => {
    n--;
    if (n <= 0) {
      clearInterval(iv);
      document.getElementById("countdownPanel").style.display = "none";
      if (!isMuted()) sound.go();
      beginPlay();
    } else {
      numEl.textContent = n;
      if (!isMuted()) sound.countBeep();
    }
  }, 700);
}

function beginPlay() {
  state = "playing";
  const prev = HighScore.get(UNIT);
  autoDiff = new AutoDifficulty(levelFromUrl(AutoDifficulty.startLevelFromHighScore(prev)));
  count = 0;
  party.reset();
  confetti = []; sparks = [];
  playEndAt = performance.now() + 60000;
  lastFrameAt = 0;
  newRound();

  recorder = new ClipRecorder(canvas, sound, 24);
  recorder.prepare();
  comboShot = new ComboShot(canvas);
  fallbackShot = new ComboShot(canvas);
  autoRec = scheduleAutoRecording(recorder, {
    onStartVisual: () => {
      recIndicator.style.display = "flex";
      setTimeout(() => { if (!comboShot.captured) fallbackShot.capture(canvas); }, 1500);
    },
    onEndVisual: () => { recIndicator.style.display = "none"; },
    onDone: (blob) => { recordedBlob = blob; },
    fallbackMs: 8000,
  });
}

function judge() {
  resolving = true;
  // 베이스가 수직선을 빈틈없이 나눠 가지므로 가장 가까운 베이스가 곧 공이 간 베이스다
  let idx = 0, bestD = Infinity;
  for (let i = 0; i < gates.length; i++) {
    const d = Math.abs(ball.x - gates[i].x);
    if (d < bestD) { bestD = d; idx = i; }
  }
  judgedIdx = idx;
  const g = gates[idx];
  const ok = g.test(ball.n);
  judgedOk = ok;
  netShake = 1;

  if (ok) {
    count++;
    party.correct(g.x, goalLineY(), { base: 11, elapsedMs: performance.now() - roundAt });
    if (party.combo > 0 && party.combo === party.maxCombo) comboShot.capture(canvas);
    autoDiff.reportCorrect();
    autoRec.trigger();
    shake.trigger(9, 220);
    if (!isMuted()) sound.hit("perfect");
    spawnSparkles(sparks, g.x, goalLineY(), 30, ["#fff", PARTY.gold, CUTE.green, CUTE.green]);
    spawnSparkles(sparks, g.x - 50, goalLineY() - 20, 12, [PARTY.gold, CUTE.green]);
    spawnSparkles(sparks, g.x + 50, goalLineY() - 20, 12, [PARTY.gold, CUTE.green]);
    if (party.combo > 0 && party.combo % 5 === 0) {
      spawnConfetti(confetti, g.x, goalLineY() - 60, 44);
      if (!isMuted()) sound.fever();
    }
  } else {
    party.wrong(g.x, goalLineY(), "세이프! 다시 봐요");
    autoDiff.reportWrong();
    shake.trigger(6, 170);
    if (!isMuted()) sound.wrong();
    spawnSparkles(sparks, g.x, goalLineY(), 12, [CUTE.orangeDark, "#fff"]);
  }
  setTimeout(() => { if (state === "playing") newRound(); }, 1100);
}

function endGame() {
  state = "result";
  const { medal, label } = medalFor(count, MEDALS);
  const prev = HighScore.get(UNIT);
  const best = Math.max(count, prev ? prev.count : 0);
  if (!prev || count >= prev.count) {
    HighScore.set(UNIT, { count, bestLevel: autoDiff.level, label: `${medal} ${count}${RECORD_SUFFIX}`, at: Date.now() });
  }
  renderPodium({ unit: UNIT, medal, label, coins: party.coins, maxCombo: party.maxCombo, count, suffix: RECORD_SUFFIX, best });

  document.getElementById("statCount").textContent = count + "번";
  document.getElementById("statBest").textContent = best + "번";
  document.getElementById("statCombo").textContent = "🔥" + party.maxCombo;

  const shot = comboShot.captured ? comboShot : fallbackShot;
  const previewVideo = document.getElementById("previewVideo");
  const saveVideoBtn = document.getElementById("saveVideoBtn");
  if (recordedBlob) {
    previewVideo.src = URL.createObjectURL(recordedBlob);
    previewVideo.style.display = "block";
    saveVideoBtn.style.display = "inline-block";
  }
  document.getElementById("savePhotoBtn").onclick = async () => {
    const blob = await shot.toBlob((c, w, h) => drawPhotoOverlay(c, w, h, { title: TITLE, record: count + RECORD_SUFFIX, medal }));
    downloadBlob(blob, `수학체육올림픽5_베이스송구_${formatFileTimestamp()}.png`);
  };
  document.getElementById("saveVideoBtn").onclick = () => {
    if (recordedBlob) downloadBlob(recordedBlob, `수학체육올림픽5_베이스송구_${formatFileTimestamp()}.${recorder.extension}`);
  };
  document.getElementById("resultPanel").style.display = "flex";
  if (!isMuted()) sound.success();
}

document.getElementById("retryBtn").addEventListener("click", () => {
  document.getElementById("resultPanel").style.display = "none";
  document.getElementById("raisePanel").style.display = "flex";
  startGate.since = 0; startGate.ready = false; holdFill.style.width = "0%";
  state = "raise";
});

document.getElementById("raisePanel").addEventListener("click", () => {
  if (state === "raise" && mode !== "motion") goReady();
});

function goReady() {
  state = "ready";
  document.getElementById("raisePanel").style.display = "none";
  document.getElementById("readyPanel").style.display = "flex";
  if (!isMuted()) sound.click();
  setTimeout(() => {
    document.getElementById("readyPanel").style.display = "none";
    startCountdown();
  }, 500);
}

// ── 송구: 손을 아래로 내리거나 화면을 누르면 곧장 베이스로 ──
function dropBall() {
  if (resolving || !ball || ball.dropped) return;
  ball.dropped = true;
  dropFlash = 1;
  if (!isMuted()) sound.swoosh();
}

function detectDrop(now) {
  if (resolving || !ball || ball.dropped) return;
  if (mode === "motion") {
    const p = cursors[0];
    if (!p) { handTrail = []; return; }
    handTrail.push({ t: now, y: p.y });
    while (handTrail.length && now - handTrail[0].t > 240) handTrail.shift();
    // 240 ms 안에 화면 높이의 9% 이상 손을 내리면 "떨어뜨렸다"고 본다
    if (handTrail.length >= 3 && p.y - handTrail[0].y > dims.h * 0.09) {
      dropBall();
      handTrail = [];
    }
    return;
  }
  if (pointerInput && pointerInput.consumeJustDown()) dropBall();
}

// ── 베이스 (필드형 경쟁: 알맞은 베이스로 공을 보낸다) ──
function drawGates(ctx, now) {
  const { w, h } = dims;
  const gy = goalLineY();
  const gh = h * 0.15;
  for (let i = 0; i < gates.length; i++) {
    const g = gates[i];
    const judged = i === judgedIdx;
    const shakeX = judged && netShake > 0 ? Math.sin(now / 24) * netShake * 5 : 0;

    ctx.save();
    ctx.translate(shakeX, 0);
    // 흙 구역 — 베이스가 놓인 자리
    ctx.fillStyle = judged
      ? (judgedOk ? "rgba(81,207,102,0.30)" : "rgba(255,140,90,0.28)")
      : "rgba(201,111,74,0.30)";
    ctx.fillRect(g.x - g.w / 2, gy, g.w, gh);
    // 구역을 가르는 하얀 라인
    ctx.strokeStyle = "rgba(255,255,255,0.85)";
    ctx.lineWidth = fluidPx(dims, 3, { min: 2, max: 4.5 });
    ctx.beginPath();
    ctx.moveTo(g.x - g.w / 2, gy); ctx.lineTo(g.x - g.w / 2, gy + gh);
    ctx.moveTo(g.x + g.w / 2, gy); ctx.lineTo(g.x + g.w / 2, gy + gh);
    ctx.moveTo(g.x - g.w / 2, gy); ctx.lineTo(g.x + g.w / 2, gy);
    ctx.stroke();

    // 베이스 — 하얀 마름모
    const bs = Math.min(g.w * 0.30, gh * 0.46);
    const bx = g.x, by = gy + gh * 0.55;
    ctx.beginPath();
    ctx.moveTo(bx, by - bs); ctx.lineTo(bx + bs, by);
    ctx.lineTo(bx, by + bs); ctx.lineTo(bx - bs, by);
    ctx.closePath();
    ctx.fillStyle = judged ? (judgedOk ? CUTE.green : CUTE.orangeDark) : "#fdfdf6";
    ctx.fill();
    ctx.strokeStyle = CUTE.ink;
    ctx.lineWidth = fluidPx(dims, 3.5, { min: 2.5, max: 5 });
    ctx.lineJoin = "round";
    ctx.stroke();
    ctx.restore();

    // 조건 표지판
    const fs = Math.min(fluidPx(dims, 19, { min: 13, max: 26 }), g.w * 0.17);
    drawStickerRect(ctx, g.x, gy - fs * 1.5, g.w * 0.96, fs * 2.1, fs * 0.5,
      judged ? (judgedOk ? CUTE.green : CUTE.orangeDark) : LANE_COLORS[i % LANE_COLORS.length],
      { lineWidth: Math.max(2.5, fs * 0.16), drop: fs * 0.2 });
    drawChunkyText(ctx, g.label, g.x, gy - fs * 1.5, fs, "#fff",
      { outline: CUTE.ink, outlineWidth: Math.max(2.5, fs * 0.2) });
  }
}

// ── 숫자 공 ──
function drawBall(ctx, now) {
  const r = fluidPx(dims, 34, { min: 24, max: 48 });
  ball.r = r;
  const squash = resolving ? 1 + Math.sin(Math.min(1, (now - roundAt) / 200) * Math.PI) * 0.1 : 1;
  drawSticker(ctx, ball.x, ball.y, r * squash, judgedIdx >= 0 ? (judgedOk ? CUTE.green : CUTE.orangeDark) : CUTE.cream,
    { lineWidth: Math.max(3, r * 0.14) });
  drawChunkyText(ctx, String(ball.n), ball.x, ball.y, r * 0.95, CUTE.ink,
    { outline: "#fff", outlineWidth: Math.max(3, r * 0.18) });

  // 떨어뜨리는 중이면 위로 꼬리가 늘어져 속도가 보인다
  if (ball.dropped && !resolving) {
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = PARTY.gold;
    ctx.lineWidth = r * 0.5;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(ball.x, ball.y - r * 0.4);
    ctx.lineTo(ball.x, ball.y - r * 2.1);
    ctx.stroke();
    ctx.restore();
  }

  // 어느 베이스로 향하는지 바닥에 그림자로 알려 준다
  ctx.save();
  ctx.globalAlpha = 0.25;
  ctx.fillStyle = CUTE.ink;
  ctx.beginPath();
  ctx.ellipse(ball.x, goalLineY() - 6, r * 0.8, r * 0.22, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // 아직 안 떨어뜨렸으면 "내릴 수 있다"는 것을 화살표로 알려 준다
  if (!ball.dropped && !resolving) {
    const t = (performance.now() % 900) / 900;
    const ay = ball.y + r * 1.5 + t * r * 0.7;
    ctx.save();
    ctx.globalAlpha = 0.75 * (1 - t);
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = Math.max(3, r * 0.16);
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(ball.x - r * 0.42, ay);
    ctx.lineTo(ball.x, ay + r * 0.42);
    ctx.lineTo(ball.x + r * 0.42, ay);
    ctx.stroke();
    ctx.restore();
  }
}

function loop(tsMs) {
  requestAnimationFrame(loop);
  if (mode === "motion" && video.readyState < 2) return;
  const { ctx, w, h } = dims;
  ctx.save();
  shake.apply(ctx);
  if (mode === "motion") drawMirroredVideo(ctx, video, w, h);
  else drawPartyBackdrop(ctx, dims);
  drawDrifters(ctx, drifters, dims, 1 / 60);
  drawBunting(ctx, dims);
  drawCrowd(ctx, dims, party.cheerUntil);

  let result = null;
  if (mode === "motion") {
    result = handTracker.detect(video, tsMs);
    if (state === "raise") {
      let raised = false;
      if (result && result.landmarks) for (const lm of result.landmarks) if (isHandRaised(lm)) raised = true;
      if (startGate.update(tsMs, raised)) goReady();
    }
  }
  cursors = getCursors(mode, result, w, h, video, pointerInput);

  if (state === "playing") stepGame();

  for (const c of cursors) drawGloveCursor(ctx, c.x, c.y, fluidPx(dims, 44, { min: 32, max: 62 }), { active: !resolving });
  ctx.restore();
}

function stepGame() {
  const { ctx, w, h } = dims;
  // 홀드·게이지는 프레임 수가 아니라 실제 흐른 시간으로 쌓아야 한다.
  // 느린 기기에서 프레임이 떨어지면 제한 시간만 실시간으로 흐르고 게이지는 안 차서 불리해진다.
  const dt = lastFrameAt ? Math.min(0.06, (performance.now() - lastFrameAt) / 1000) : 1 / 60;
  lastFrameAt = performance.now();
  const remain = Math.max(0, playEndAt - performance.now());
  if (remain <= 0) { endGame(); return; }
  const now = performance.now();

  if (!resolving) {
    // 손을 따라 좌우로 — 급하게 튀지 않도록 부드럽게 따라붙는다
    const p = cursors[0];
    if (p) {
      const margin = ball.r || dims.w * 0.04;
      const target = Math.max(margin, Math.min(w - margin, p.x));
      ball.x += (target - ball.x) * Math.min(1, dt * 9);
    }
    detectDrop(now);
    if (ball.dropped) {
      // 송구하면 곧장 베이스로 — 기다리지 않고 바로 결과를 본다
      ball.y += dims.h * 2.6 * dt;
    } else {
      const startY = ballStartY();
      ball.y = startY + (goalLineY() - startY) * Math.min(1, (now - roundAt) / round.fallMs);
    }
    if (ball.y >= goalLineY() - 1) { ball.y = goalLineY(); judge(); }
  }
  if (netShake > 0) netShake = Math.max(0, netShake - dt * 2.2);
  if (dropFlash > 0) dropFlash = Math.max(0, dropFlash - dt * 3);

  drawGates(ctx, now);
  drawBall(ctx, now);

  // 깡총이
  const br = fluidPx(dims, 22, { min: 16, max: 30 });
  drawMascot(ctx, w * 0.95, h * 0.40, br, CHAR, party.currentMood(remain));

  const hudBottom = party.drawHud(ctx, dims, { remainMs: remain, count, suffix: "아웃" });

  drawCuteBanner(ctx, dims, [
    { text: round.title, size: 24, chunky: true, color: PARTY.gold },
    { text: round.hint, size: 14, color: CUTE.ink },
  ], fluidPx, { top: hudBottom });

  drawChunkyText(ctx,
    mode === "motion" ? "좌우로 베이스를 고르고, 손을 내려 송구해요!" : "좌우로 베이스를 고르고, 눌러서 송구해요!",
    w * 0.5, h * 0.96, fluidPx(dims, 15, { min: 11, max: 20 }), "#fff",
    { outline: CUTE.ink, outlineWidth: fluidPx(dims, 5, { min: 3.5, max: 7 }) });

  party.update(dt);
  confetti = updateConfetti(confetti, dt); drawConfetti(ctx, confetti);
  sparks = updateSparkles(sparks, dt); drawSparkles(ctx, sparks);
  party.drawFx(ctx, dims);
  party.drawFeverFrame(ctx, dims);

  drawVignette(ctx, w, h, 0.16);
  drawLevelStars(ctx, dims, autoDiff.level, fluidPx);
}

init();
</script>
