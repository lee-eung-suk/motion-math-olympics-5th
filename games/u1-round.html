<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>어림 멀리뛰기 · 종목 1</title>
<link rel="stylesheet" href="../css/style.css?v=5">
</head>
<body>

<div class="game-stage">
  <video id="video" playsinline muted style="display:none"></video>
  <canvas id="gameCanvas"></canvas>

  <div class="hud">
    <div class="rec" id="recIndicator" style="display:none"><span class="dot"></span>REC</div>
    <button class="home-btn" id="homeBtn">🏠</button>
  </div>

  <div class="overlay-panel" id="loadingPanel">
    <h2>🦘 어림 멀리뛰기</h2>
    <p id="loadingText">준비 중…</p>
  </div>

  <div class="overlay-panel" id="rulePanel" style="display:none">
    <div class="rule-card">
      <div class="rule-head">
        <div class="rule-char">🐰</div>
        <div>
          <div class="rule-name">깡총이</div>
          <h2 class="rule-title">어림 멀리뛰기</h2>
        </div>
      </div>
      <p class="rule-cheer"></p>
      <ul class="rule-list"></ul>
      <div class="rule-timer"><div class="rule-timer-fill"></div></div>
      <button class="rule-go">좋아, 시작!</button>
    </div>
  </div>

  <div class="overlay-panel" id="raisePanel" style="display:none">
    <div class="raise-icon" id="raiseIcon">🙋</div>
    <h2 id="raiseText">손을 들어 주세요!</h2>
    <div class="hold-bar"><div class="hold-fill" id="holdFill"></div></div>
  </div>

  <div class="overlay-panel ready-flash" id="readyPanel" style="display:none">
    <h2>✋ 좋아요! 준비됐어요</h2>
  </div>

  <div class="overlay-panel" id="countdownPanel" style="display:none">
    <div class="countdown-num" id="countNum">3</div>
  </div>

  <div class="overlay-panel" id="resultPanel" style="display:none">
    <div id="podium"></div>
    <div class="result-stats">
      <div class="stat-box"><div class="num" id="statCount">0번</div><div class="label">기록</div></div>
      <div class="stat-box"><div class="num" id="statBest">0번</div><div class="label">최고 기록</div></div>
      <div class="stat-box"><div class="num" id="statCombo">0</div><div class="label">최고 콤보</div></div>
    </div>
    <video class="preview" id="previewVideo" controls playsinline style="display:none"></video>
    <div class="action-row">
      <button class="ghost-btn" id="savePhotoBtn">📸 사진</button>
      <button class="ghost-btn" id="saveVideoBtn" style="display:none">🎬 3초 영상</button>
      <button class="big-btn" id="retryBtn">🔁 한 번 더</button>
      <button class="ghost-btn" id="homeBtn2">🎲 보드로</button>
    </div>
  </div>
</div>

<script type="module">
import {
  HighScore, requestWakeLock, SoundKit, FileAudioLoop,
  HandTracker, ClipRecorder, downloadBlob,
  drawMirroredVideo, fitCanvasToScreen, isHandRaised, getCursors,
  AutoDifficulty, levelFromUrl, medalFor,
  scheduleAutoRecording, ComboShot, drawPhotoOverlay,
  ScreenShake, InputMode, PointerInput, StartGate,
  startCamera, formatFileTimestamp, fluidPx, showSoundHint,
  drawVignette, spawnConfetti, updateConfetti, drawConfetti,
} from "../js/engine.js?v=2";
import {
  CUTE, bob, drawSticker, drawStickerRect, drawChunkyText,
  spawnSparkles, updateSparkles, drawSparkles, makeDrifters, drawDrifters,
  drawBunting, drawGloveCursor, drawLevelStars, drawCuteBanner,
} from "../js/cute.js?v=5";
import {
  PARTY, CHARACTERS, Board, Party, drawPartyBackdrop, drawCrowd, drawMascot,
  showRuleCard, renderPodium, irisTransition,
} from "../js/party.js?v=1";
requestWakeLock();

const UNIT = "f1";
const TITLE = "어림 멀리뛰기";
const RECORD_SUFFIX = "번 성공";
const MEDALS = { bronze: 3, silver: 5, gold: 8 };
const CHAR = CHARACTERS[UNIT];
const mode = InputMode.get();

const video = document.getElementById("video");
const canvas = document.getElementById("gameCanvas");
let dims = fitCanvasToScreen(canvas);
let drifters = makeDrifters(12, dims.w, dims.h);
window.addEventListener("resize", () => {
  dims = fitCanvasToScreen(canvas);
  drifters = makeDrifters(12, dims.w, dims.h);
  if (state === "playing") layoutMats();
});

const sound = new SoundKit();
const bgm = new FileAudioLoop("../assets/sounds/subbgm.mp3", 0.32);
const isMuted = () => localStorage.getItem("smo_muted") === "1";
const party = new Party({ unit: UNIT, sound, isMuted });

function goHome() { bgm.stop(); irisTransition(() => { location.href = "../index.html"; }); }
document.getElementById("homeBtn").addEventListener("click", goHome);
document.getElementById("homeBtn2").addEventListener("click", goHome);

function randInt(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// ---------------------------------------------------------------------------
// 문제 만들기 — 착지 매트 4개에 수를 하나씩 적어두고, 조건을 만족하는 매트에 착지시킨다.
// 매트에 "범위"가 아니라 "수 하나"를 적는 게 핵심이다. 범위를 적어두면 눈으로 짝만
// 맞추면 되지만, 수 하나면 그 수가 조건 안에 드는지 스스로 판단해야 한다.
// ---------------------------------------------------------------------------

// ⭐1단계: 이상 / 이하 / 초과 / 미만
function genRange() {
  // 서로 충분히 떨어진 네 수를 뽑아 경계값을 만들 자리를 확보한다
  const vals = [];
  let v = randInt(6, 14);
  for (let i = 0; i < 4; i++) { vals.push(v); v += randInt(6, 13); }
  const answerIdx = randInt(0, 3);
  const a = vals[answerIdx];
  const lo = vals[answerIdx - 1], hi = vals[answerIdx + 1];

  // 아래쪽 경계: "a 이상"(경계 포함) 또는 "lo 초과"(경계 제외) — 둘 다 답만 남긴다
  let lowText = null;
  if (lo !== undefined) {
    lowText = Math.random() < 0.5 ? `${a} 이상` : `${lo} 초과`;
  }
  // 위쪽 경계: "a 이하"(경계 포함) 또는 "hi 미만"(경계 제외)
  let highText = null;
  if (hi !== undefined) {
    highText = Math.random() < 0.5 ? `${a} 이하` : `${hi} 미만`;
  }
  // 양쪽이 다 있으면 한쪽만 쓰기도 한다 (맨 끝 매트가 답이면 자동으로 한쪽만 생긴다)
  if (lowText && highText && Math.random() < 0.35) {
    if (Math.random() < 0.5) highText = null; else lowText = null;
  }
  // 한쪽만 남겼는데 그 조건으로 답이 하나로 안 좁혀지면 다시 만든다
  const passes = (x) => (!lowText || checkLow(x, lowText)) && (!highText || checkHigh(x, highText));
  function checkLow(x, t) {
    const n = parseInt(t, 10);
    return t.includes("이상") ? x >= n : x > n;
  }
  function checkHigh(x, t) {
    const n = parseInt(t, 10);
    return t.includes("이하") ? x <= n : x < n;
  }
  if (vals.filter(passes).length !== 1) return genRange();

  // "20 초과 33 미만인 수"처럼 교과서와 같은 말투로 잇는다
  const question = [lowText, highText].filter(Boolean).join(" ") + "인 수";
  return { vals, answerIdx, question, hint: "이상·이하는 그 수를 포함하고, 초과·미만은 포함하지 않아요" };
}

// ⭐2·3단계: 올림 / 버림 / 반올림
const PLACES = { 10: "십의 자리", 100: "백의 자리" };
function roundTo(op, x, p) {
  if (op === "올림") return Math.ceil(x / p) * p;
  if (op === "버림") return Math.floor(x / p) * p;
  return Math.round(x / p) * p;
}
function genRounding(level) {
  const op = level === 2 ? (Math.random() < 0.5 ? "올림" : "버림")
    : (Math.random() < 0.6 ? "반올림" : (Math.random() < 0.5 ? "올림" : "버림"));
  const p = level === 2 ? (Math.random() < 0.5 ? 10 : 100) : 100;
  const lo = p === 10 ? 120 : 250, hi = p === 10 ? 480 : 950;

  const answer = randInt(lo, hi);
  const target = roundTo(op, answer, p);
  const vals = [answer];
  // 오답은 "경계 바로 바깥" 위주로 — 아이들이 실제로 헷갈리는 자리에서만 갈린다
  let guard = 0;
  while (vals.length < 4 && guard++ < 400) {
    const cand = Math.random() < 0.6
      ? target + randInt(-1, 1) * p + randInt(-Math.floor(p / 2), Math.floor(p / 2))
      : randInt(lo, hi);
    if (cand < 10 || cand > hi + p) continue;
    if (roundTo(op, cand, p) === target) continue;   // 정답이 둘이 되면 안 된다
    if (vals.some((v) => Math.abs(v - cand) < p * 0.25)) continue;
    vals.push(cand);
  }
  if (vals.length < 4) return genRounding(level);

  const order = shuffle(vals.map((v, i) => ({ v, isAns: i === 0 })));
  return {
    vals: order.map((o) => o.v),
    answerIdx: order.findIndex((o) => o.isAns),
    question: `${op}하여 ${PLACES[p]}까지 나타내면 ${target}이 되는 수`,
    hint: op === "반올림" ? "바로 아래 자리 숫자가 5보다 작으면 버리고, 5이거나 크면 올려요" : `${op}은 남은 자리가 0이 아니면 ${op === "올림" ? "무조건 올려요" : "무조건 버려요"}`,
  };
}

function genRound(level) {
  const r = level === 1 ? genRange() : genRounding(level);
  // 매트는 왼쪽부터 수가 커지도록 놓아 "멀리 뛸수록 큰 수"라는 감각을 준다
  const idx = r.vals.map((v, i) => ({ v, i })).sort((a, b) => a.v - b.v);
  const sortedVals = idx.map((o) => o.v);
  const newAnswer = idx.findIndex((o) => o.i === r.answerIdx);
  return { ...r, vals: sortedVals, answerIdx: newAnswer };
}

const handTracker = new HandTracker();
let pointerInput = null;

async function init() {
  if (!isMuted()) bgm.play(showSoundHint);
  if (mode === "motion") {
    try {
      await startCamera(video, { width: 640, height: 480 });
      if (!isMuted()) bgm.play(showSoundHint);
    } catch (e) {
      document.getElementById("loadingText").textContent = "⚠️ 카메라를 찾을 수 없어요. 카메라 권한을 확인해주세요.";
      return;
    }
    document.getElementById("loadingText").textContent = "AI 모델을 불러오는 중…";
    await handTracker.init(1);
  } else {
    pointerInput = new PointerInput(canvas);
  }
  document.getElementById("loadingPanel").style.display = "none";

  await showRuleCard({
    unit: UNIT,
    title: "어림 멀리뛰기",
    lines: [
      "조건에 맞는 수가 적힌 <b>착지 매트</b>를 찾아요.",
      mode === "motion"
        ? "손을 좌우로 움직여 <b>조준</b>하고, 그 자리에 <b>잠깐 멈추면</b> 깡총이가 뛰어요."
        : "화면을 <b>콕 누르면</b> 그 자리로 깡총이가 뛰어요.",
      "<b>이상·이하</b>는 그 수를 포함! <b>초과·미만</b>은 포함하지 않아요.",
    ],
  });

  document.getElementById("raiseIcon").textContent = mode === "motion" ? "🙋" : "👆";
  document.getElementById("raiseText").textContent = mode === "motion" ? "손을 들어 주세요!" : "화면을 터치(클릭)하면 시작!";
  document.getElementById("raisePanel").style.display = "flex";
  state = "raise";
  requestAnimationFrame(loop);
}

let state = "loading";
const holdFill = document.getElementById("holdFill");
const startGate = new StartGate(mode, holdFill);

let autoDiff, count, playEndAt;
let round, mats, phase, roundAt, jump = null, resultMark = null;
let aimX = 0, holdSince = 0, holdAnchor = 0;
let confetti = [], sparks = [];
const shake = new ScreenShake();
let recorder, comboShot, fallbackShot, autoRec, recordedBlob = null;
const recIndicator = document.getElementById("recIndicator");
let cursors = [];

const GROUND = () => dims.h * 0.80;
const matW = () => fluidPx(dims, 88, { min: 62, max: 130 });
const matH = () => fluidPx(dims, 34, { min: 26, max: 50 });

function layoutMats() {
  const { w } = dims;
  const x0 = w * 0.26, x1 = w * 0.90;
  mats = round.vals.map((v, i) => ({
    v, i,
    x: x0 + ((i + 0.5) / round.vals.length) * (x1 - x0),
    y: GROUND(),
  }));
}

function newRound() {
  round = genRound(autoDiff.level);
  layoutMats();
  phase = "aim";
  roundAt = performance.now();
  jump = null; resultMark = null;
  holdSince = 0;
  aimX = dims.w * 0.55;
}

function startCountdown() {
  state = "countdown";
  document.getElementById("countdownPanel").style.display = "flex";
  const numEl = document.getElementById("countNum");
  let n = 3;
  numEl.textContent = n;
  if (!isMuted()) sound.countBeep();
  const iv = setInterval(() => {
    n--;
    if (n <= 0) {
      clearInterval(iv);
      document.getElementById("countdownPanel").style.display = "none";
      if (!isMuted()) sound.go();
      beginPlay();
    } else {
      numEl.textContent = n;
      if (!isMuted()) sound.countBeep();
    }
  }, 700);
}

function beginPlay() {
  state = "playing";
  const prev = HighScore.get(UNIT);
  autoDiff = new AutoDifficulty(levelFromUrl(AutoDifficulty.startLevelFromHighScore(prev)));
  count = 0;
  party.reset();
  confetti = []; sparks = [];
  playEndAt = performance.now() + 60000;
  newRound();

  recorder = new ClipRecorder(canvas, sound, 24);
  recorder.prepare();
  comboShot = new ComboShot(canvas);
  fallbackShot = new ComboShot(canvas);
  autoRec = scheduleAutoRecording(recorder, {
    onStartVisual: () => {
      recIndicator.style.display = "flex";
      setTimeout(() => { if (!comboShot.captured) fallbackShot.capture(canvas); }, 1500);
    },
    onEndVisual: () => { recIndicator.style.display = "none"; },
    onDone: (blob) => { recordedBlob = blob; },
    fallbackMs: 8000,
  });
}

// 조준한 x에서 가장 가까운 매트로 뛴다 — 매트 사이에 애매하게 걸쳐도 억울하지 않다
function launch(x) {
  if (phase !== "aim") return;
  let best = mats[0], bd = Infinity;
  for (const m of mats) { const d = Math.abs(m.x - x); if (d < bd) { bd = d; best = m; } }
  phase = "fly";
  jump = { from: { x: dims.w * 0.11, y: GROUND() }, to: { x: best.x, y: GROUND() }, start: performance.now(), dur: 780, mat: best };
  if (!isMuted()) sound.swoosh();
}

function resolveJump() {
  const m = jump.mat;
  const ok = m.i === round.answerIdx;
  phase = "done";
  resultMark = { mat: m, ok, at: performance.now() };
  if (ok) {
    count++;
    party.correct(m.x, m.y - matH() * 2.2, { base: 10, elapsedMs: performance.now() - roundAt });
    if (party.combo > 0 && party.combo === party.maxCombo) comboShot.capture(canvas);
    autoDiff.reportCorrect();
    autoRec.trigger();
    shake.trigger(7, 160);
    spawnSparkles(sparks, m.x, m.y, 24, ["#fff", PARTY.gold, CUTE.green]);
    spawnConfetti(confetti, m.x, m.y - matH(), 32);
  } else {
    party.wrong(m.x, m.y - matH() * 2.2, "다시 어림해 봐!");
    autoDiff.reportWrong();
    shake.trigger(4, 150);
  }
  setTimeout(() => { if (state === "playing") newRound(); }, ok ? 900 : 1250);
}

function endGame() {
  state = "result";
  const { medal, label } = medalFor(count, MEDALS);
  const prev = HighScore.get(UNIT);
  const best = Math.max(count, prev ? prev.count : 0);
  if (!prev || count >= prev.count) {
    HighScore.set(UNIT, { count, bestLevel: autoDiff.level, label: `${medal} ${count}${RECORD_SUFFIX}`, at: Date.now() });
  }
  const earnedStar = medal !== "🏅";
  Board.finishGame(UNIT, { coins: party.coins, earnedStar });
  renderPodium({ unit: UNIT, medal, label, coins: party.coins, maxCombo: party.maxCombo, count, suffix: RECORD_SUFFIX, best });

  document.getElementById("statCount").textContent = count + "번";
  document.getElementById("statBest").textContent = best + "번";
  document.getElementById("statCombo").textContent = "🔥" + party.maxCombo;

  const shot = comboShot.captured ? comboShot : fallbackShot;
  const previewVideo = document.getElementById("previewVideo");
  const saveVideoBtn = document.getElementById("saveVideoBtn");
  if (recordedBlob) {
    previewVideo.src = URL.createObjectURL(recordedBlob);
    previewVideo.style.display = "block";
    saveVideoBtn.style.display = "inline-block";
  }
  document.getElementById("savePhotoBtn").onclick = async () => {
    const blob = await shot.toBlob((c, w, h) => drawPhotoOverlay(c, w, h, { title: TITLE, record: count + RECORD_SUFFIX, medal }));
    downloadBlob(blob, `수학체육올림픽5_어림멀리뛰기_${formatFileTimestamp()}.png`);
  };
  document.getElementById("saveVideoBtn").onclick = () => {
    if (recordedBlob) downloadBlob(recordedBlob, `수학체육올림픽5_어림멀리뛰기_${formatFileTimestamp()}.${recorder.extension}`);
  };
  document.getElementById("resultPanel").style.display = "flex";
  if (!isMuted()) sound.success();
}

document.getElementById("retryBtn").addEventListener("click", () => {
  document.getElementById("resultPanel").style.display = "none";
  document.getElementById("raisePanel").style.display = "flex";
  startGate.since = 0; startGate.ready = false; holdFill.style.width = "0%";
  state = "raise";
});

document.getElementById("raisePanel").addEventListener("click", () => {
  if (state === "raise" && mode !== "motion") goReady();
});

function goReady() {
  state = "ready";
  document.getElementById("raisePanel").style.display = "none";
  document.getElementById("readyPanel").style.display = "flex";
  if (!isMuted()) sound.click();
  setTimeout(() => {
    document.getElementById("readyPanel").style.display = "none";
    startCountdown();
  }, 500);
}

function loop(tsMs) {
  requestAnimationFrame(loop);
  if (mode === "motion" && video.readyState < 2) return;
  const { ctx, w, h } = dims;
  ctx.save();
  shake.apply(ctx);
  if (mode === "motion") drawMirroredVideo(ctx, video, w, h);
  else drawPartyBackdrop(ctx, dims);
  drawDrifters(ctx, drifters, dims, 1 / 60);
  drawBunting(ctx, dims);
  drawCrowd(ctx, dims, party.cheerUntil);

  let result = null;
  if (mode === "motion") {
    result = handTracker.detect(video, tsMs);
    if (state === "raise") {
      let raised = false;
      if (result && result.landmarks) for (const lm of result.landmarks) if (isHandRaised(lm)) raised = true;
      if (startGate.update(tsMs, raised)) goReady();
    }
  }
  cursors = getCursors(mode, result, w, h, video, pointerInput);

  if (state === "playing") stepGame();

  for (const c of cursors) drawGloveCursor(ctx, c.x, c.y, fluidPx(dims, 44, { min: 32, max: 62 }), { active: phase === "aim" && holdSince > 0 });
  ctx.restore();
}

function stepGame() {
  const { ctx, w, h } = dims;
  const dt = 1 / 60;
  const remain = Math.max(0, playEndAt - performance.now());
  if (remain <= 0) { endGame(); return; }
  const now = performance.now();
  // 문제가 바뀌자마자 손이 우연히 놓인 자리로 발사되면 억울하다 — 0.8초 잠근다
  const armed = now - roundAt > 800;

  // ── 입력 ────────────────────────────────────────────────
  if (phase === "aim") {
    if (cursors.length > 0) {
      aimX = Math.max(w * 0.2, Math.min(w * 0.95, cursors[0].x));
      if (mode === "motion") {
        // 손을 한자리에 잠깐 멈추면 발사 (0.45초)
        if (holdSince === 0 || Math.abs(aimX - holdAnchor) > w * 0.03) {
          holdSince = now; holdAnchor = aimX;
        } else if (armed && now - holdSince > 450) {
          launch(aimX);
        }
      }
    } else if (mode === "motion") {
      holdSince = 0;
    }
    if (mode !== "motion" && pointerInput && pointerInput.consumeJustDown() && armed) {
      launch(aimX);
    }
  }

  if (phase === "fly") {
    const t = Math.min(1, (now - jump.start) / jump.dur);
    if (t >= 1) resolveJump();
  }

  // ── 그리기 ──────────────────────────────────────────────
  const gy = GROUND();
  // 모래 트랙
  ctx.save();
  ctx.fillStyle = "rgba(255,236,199,0.82)";
  ctx.fillRect(0, gy, w, h - gy);
  ctx.strokeStyle = "rgba(34,48,92,0.35)";
  ctx.lineWidth = fluidPx(dims, 4, { min: 3, max: 6 });
  ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(w, gy); ctx.stroke();
  ctx.restore();

  // 도약대
  drawStickerRect(ctx, w * 0.11, gy + matH() * 0.2, matW() * 0.7, matH() * 0.9,
    fluidPx(dims, 10, { min: 7, max: 14 }), CUTE.redDark, { lineWidth: 3.5 });

  // 착지 매트 — 전부 같은 색이라 겉모습으로는 정답을 알 수 없다
  const mw = matW(), mh = matH();
  for (const m of mats) {
    const isHit = resultMark && resultMark.mat === m;
    const fill = isHit ? (resultMark.ok ? CUTE.green : CUTE.red) : CUTE.cream;
    drawStickerRect(ctx, m.x, m.y + mh * 0.34, mw, mh, fluidPx(dims, 12, { min: 8, max: 16 }), fill, {
      lineWidth: fluidPx(dims, 4, { min: 3, max: 6 }), drop: fluidPx(dims, 5, { min: 3, max: 8 }),
    });
    drawChunkyText(ctx, String(m.v), m.x, m.y + mh * 0.34, Math.min(mh * 0.72, mw * 0.42),
      isHit ? "#fff" : CUTE.ink, { outline: isHit ? CUTE.ink : "#ffffff", outlineWidth: Math.max(3, mh * 0.16) });
  }

  // 조준선 — 어디로 뛸지 항상 보인다
  if (phase === "aim") {
    ctx.save();
    ctx.strokeStyle = "rgba(255,207,63,0.9)";
    ctx.lineWidth = fluidPx(dims, 4, { min: 3, max: 6 });
    ctx.setLineDash([10, 8]);
    ctx.beginPath(); ctx.moveTo(aimX, h * 0.30); ctx.lineTo(aimX, gy); ctx.stroke();
    ctx.restore();
    drawSticker(ctx, aimX, gy - mh * 1.5, fluidPx(dims, 13, { min: 9, max: 18 }), PARTY.gold, { lineWidth: 3 });
    ctx.save();
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = `${fluidPx(dims, 22, { min: 16, max: 30 })}px sans-serif`;
    ctx.fillText("🎯", aimX, gy - mh * 1.5);
    ctx.restore();

    // 모션 모드 홀드 게이지
    if (mode === "motion" && holdSince > 0) {
      const t = Math.min(1, (performance.now() - holdSince) / 450);
      const rr = fluidPx(dims, 26, { min: 18, max: 36 });
      ctx.save();
      ctx.beginPath();
      ctx.arc(aimX, gy - mh * 1.5, rr, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * t);
      ctx.strokeStyle = PARTY.gold; ctx.lineWidth = fluidPx(dims, 6, { min: 4, max: 9 });
      ctx.lineCap = "round"; ctx.stroke();
      ctx.restore();
    }
  }

  // 깡총이 — 대기 중엔 웅크렸다 폈다, 날 때는 포물선을 그린다
  const cr = fluidPx(dims, 27, { min: 20, max: 38 });
  if (phase === "fly") {
    const t = Math.min(1, (now - jump.start) / jump.dur);
    const x = jump.from.x + (jump.to.x - jump.from.x) * t;
    const arc = Math.sin(Math.PI * t) * h * 0.30;
    drawMascot(ctx, x, jump.from.y - cr - arc, cr, CHAR, "happy");
  } else {
    const crouch = phase === "aim" && holdSince > 0 ? 0.8 : 1;
    ctx.save();
    ctx.translate(w * 0.11, gy - cr);
    ctx.scale(1 / crouch, crouch);
    ctx.translate(-w * 0.11, -(gy - cr));
    drawMascot(ctx, w * 0.11, gy - cr, cr, CHAR, party.currentMood(remain));
    ctx.restore();
  }

  // 상단: HUD 알약 + 문제 배너
  const hudBottom = party.drawHud(ctx, dims, { remainMs: remain, count, suffix: "번" });
  drawCuteBanner(ctx, dims, [
    { text: round.question, size: 26, chunky: true, color: PARTY.gold },
    { text: round.hint, size: 14, color: CUTE.ink },
  ], fluidPx, { top: hudBottom });

  // 오답이면 왜 틀렸는지 그 자리에서 알려 준다 (정답 매트는 알려주지 않는다)
  if (resultMark && !resultMark.ok) {
    drawChunkyText(ctx, `${resultMark.mat.v}은(는) 조건에 맞지 않아요`, w / 2, gy - mh * 3.4,
      fluidPx(dims, 20, { min: 14, max: 26 }), "#fff", { outline: CUTE.red, outlineWidth: fluidPx(dims, 6, { min: 4, max: 8 }) });
  }

  party.update(dt);
  confetti = updateConfetti(confetti, dt); drawConfetti(ctx, confetti);
  sparks = updateSparkles(sparks, dt); drawSparkles(ctx, sparks);
  party.drawFx(ctx, dims);
  party.drawFeverFrame(ctx, dims);

  drawVignette(ctx, w, h, 0.16);
  drawLevelStars(ctx, dims, autoDiff.level, fluidPx);
}

init();
</script>

</html>
