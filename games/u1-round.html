<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>수직선 달리기 · 종목 1</title>
<link rel="stylesheet" href="../css/style.css?v=8">
</head>
<body>

<div class="game-stage">
  <video id="video" playsinline muted style="display:none"></video>
  <canvas id="gameCanvas"></canvas>

  <div class="hud">
    <div class="rec" id="recIndicator" style="display:none"><span class="dot"></span>REC</div>
    <button class="home-btn" id="homeBtn">🏠</button>
  </div>

  <div class="overlay-panel" id="loadingPanel">
    <h2>🏃 수직선 달리기</h2>
    <p id="loadingText">준비 중…</p>
  </div>

  <div class="overlay-panel" id="rulePanel" style="display:none">
    <div class="rule-card">
      <div class="rule-head">
        <div class="rule-char">⚾</div>
        <div>
          <div class="rule-name"></div>
          <h2 class="rule-title">수직선 달리기</h2>
        </div>
      </div>
      <p class="rule-cheer"></p>
      <ul class="rule-list"></ul>
      <div class="rule-timer"><div class="rule-timer-fill"></div></div>
      <button class="rule-go">좋아, 시작!</button>
    </div>
  </div>

  <div class="overlay-panel" id="raisePanel" style="display:none">
    <div class="raise-icon" id="raiseIcon">🙋</div>
    <h2 id="raiseText">손을 들어 주세요!</h2>
    <div class="hold-bar"><div class="hold-fill" id="holdFill"></div></div>
  </div>

  <div class="overlay-panel ready-flash" id="readyPanel" style="display:none">
    <h2>✋ 좋아요! 준비됐어요</h2>
  </div>

  <div class="overlay-panel" id="countdownPanel" style="display:none">
    <div class="countdown-num" id="countNum">3</div>
  </div>

  <div class="overlay-panel" id="resultPanel" style="display:none">
    <div id="podium"></div>
    <div class="result-stats">
      <div class="stat-box"><div class="num" id="statCount">0번</div><div class="label">맞힌 수</div></div>
      <div class="stat-box"><div class="num" id="statBest">0번</div><div class="label">최고 기록</div></div>
      <div class="stat-box"><div class="num" id="statCombo">0</div><div class="label">최고 콤보</div></div>
    </div>
    <video class="preview" id="previewVideo" controls playsinline style="display:none"></video>
    <div class="action-row">
      <button class="ghost-btn" id="savePhotoBtn">📸 사진</button>
      <button class="ghost-btn" id="saveVideoBtn" style="display:none">🎬 3초 영상</button>
      <button class="big-btn" id="retryBtn">🔁 한 번 더</button>
      <button class="ghost-btn" id="homeBtn2">🏠 종목 선택</button>
    </div>
  </div>
</div>

<script type="module">
import {
  HighScore, requestWakeLock, SoundKit, FileAudioLoop,
  ClipRecorder, downloadBlob,
  drawMirroredVideo, fitCanvasToScreen, getCursors,
  PoseTracker, PoseMotion, posePoints, isArmRaised,
  AutoDifficulty, levelFromUrl, medalFor,
  scheduleAutoRecording, ComboShot, drawPhotoOverlay,
  ScreenShake, InputMode, PointerInput, StartGate,
  startCamera, formatFileTimestamp, fluidPx, showSoundHint,
  drawVignette, spawnConfetti, updateConfetti, drawConfetti,
} from "../js/engine.js?v=4";
import {
  CUTE, LANE_COLORS, bob, drawSticker, drawStickerRect, drawChunkyText,
  spawnSparkles, updateSparkles, drawSparkles, makeDrifters, drawDrifters,
  drawBunting, drawGloveCursor, drawLevelStars, drawCuteBanner,
} from "../js/cute.js?v=7";
import {
  PARTY, CHARACTERS, Party, drawPartyBackdrop, drawCrowd, drawAthlete as drawPlayer,
  showRuleCard, renderPodium, irisTransition,
} from "../js/party.js?v=2";
requestWakeLock();

const UNIT = "f1";
const TITLE = "수직선 달리기";
const RECORD_SUFFIX = "개 정답";
const MEDALS = { bronze: 5, silver: 9, gold: 13 };
const CHAR = CHARACTERS[UNIT];
const mode = InputMode.get();

const video = document.getElementById("video");
const canvas = document.getElementById("gameCanvas");
let dims = fitCanvasToScreen(canvas);
let drifters = makeDrifters(10, dims.w, dims.h);
window.addEventListener("resize", () => {
  dims = fitCanvasToScreen(canvas);
  drifters = makeDrifters(10, dims.w, dims.h);

});

const sound = new SoundKit();
const bgm = new FileAudioLoop("../assets/sounds/subbgm.mp3", 0.32);
const isMuted = () => localStorage.getItem("smo_muted") === "1";
const party = new Party({ unit: UNIT, sound, isMuted });

function goHome() { bgm.stop(); irisTransition(() => { location.href = "../index.html"; }); }
document.getElementById("homeBtn").addEventListener("click", goHome);
document.getElementById("homeBtn2").addEventListener("click", goHome);

function randInt(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// ---------------------------------------------------------------------------
// 조건 만들기 — 조건은 곧 "수직선 위의 한 구간"이다.
// 학생은 그 구간 안으로 몸을 옮겨 서야 하므로, 조건마다 정답 구간 [lo, hi]를 들고 다닌다.
// ---------------------------------------------------------------------------
const NMAX = 100;

function genRound(level) {
  if (level === 1) {
    // 이상·이하·초과·미만 — 경계를 포함하는지가 그대로 답을 가른다
    const a = randInt(12, 60);
    const b = a + randInt(12, 30);
    const lowIncl = Math.random() < 0.5;
    const highIncl = Math.random() < 0.5;
    const lo = lowIncl ? a : a + 1;
    const hi = highIncl ? b : b - 1;
    const wantSmall = Math.random() < 0.5;
    const target = wantSmall ? lo : hi;
    return {
      lo: target - 1, hi: target + 1, target,          // 경계 판단이 핵심이라 ±1만 봐준다
      text: `${a} ${lowIncl ? "이상" : "초과"} ${b} ${highIncl ? "이하" : "미만"}인 수 중 가장 ${wantSmall ? "작은" : "큰"} 수`,
      hint: "이상·이하는 그 수를 포함해요. 초과·미만은 포함하지 않아요",
    };
  }
  if (level === 2) {
    // 올림 / 버림 하여 십의 자리까지
    const up = Math.random() < 0.5;
    const v = randInt(2, 9) * 10;
    return {
      lo: up ? v - 9 : v, hi: up ? v : v + 9, target: null,
      text: `${up ? "올림" : "버림"}하여 십의 자리까지 나타내면 ${v}이 되는 수`,
      hint: up ? "남은 자리가 0이 아니면 무조건 올려요" : "남은 자리는 무조건 버려요",
    };
  }
  // ⭐3 반올림 — 구간이 목표를 가운데 두고 양쪽으로 벌어진다
  const v = randInt(2, 9) * 10;
  return {
    lo: v - 5, hi: v + 4, target: null,
    text: `반올림하여 십의 자리까지 나타내면 ${v}이 되는 수`,
    hint: "바로 아래 자리가 5보다 작으면 버리고, 5이거나 크면 올려요",
  };
}

const poseTracker = new PoseTracker();
const motion = new PoseMotion();
let pointerInput = null;

async function init() {
  if (!isMuted()) bgm.play(showSoundHint);
  if (mode === "motion") {
    try {
      await startCamera(video, { width: 640, height: 480 });
      if (!isMuted()) bgm.play(showSoundHint);
    } catch (e) {
      document.getElementById("loadingText").textContent = "⚠️ 카메라를 찾을 수 없어요. 카메라 권한을 확인해주세요.";
      return;
    }
    document.getElementById("loadingText").textContent = "AI 모델을 불러오는 중…";
    await poseTracker.init();
  } else {
    pointerInput = new PointerInput(canvas);
  }
  document.getElementById("loadingPanel").style.display = "none";

  await showRuleCard({
    unit: UNIT,
    title: "수직선 달리기",
    lines: [
      "화면 아래에 <b>0부터 100까지의 수직선</b>이 있어요. 조건이 위에 나와요.",
      mode === "motion"
        ? "<b>몸을 좌우로 움직이면</b> 내가 선 자리의 수가 바뀌어요. 보기는 없어요 — <b>내가 선 자리가 곧 답</b>이에요!"
        : "<b>좌우로 움직이면</b> 내가 가리키는 수가 바뀌어요.",
      mode === "motion"
        ? "조건에 맞는 수에 섰으면 <b>제자리에서 점프!</b> (앉아서 한다면 두 팔을 위로 확 뻗어요)"
        : "조건에 맞는 수에 맞췄으면 <b>화면을 눌러</b> 확정!",
      "⭐1 <b>이상·이하·초과·미만</b> → ⭐2 <b>올림·버림</b> → ⭐3 <b>반올림</b>",
    ],
  });

  document.getElementById("raiseIcon").textContent = mode === "motion" ? "🙋" : "👆";
  document.getElementById("raiseText").textContent = mode === "motion" ? "손을 들어 주세요!" : "화면을 터치(클릭)하면 시작!";
  document.getElementById("raisePanel").style.display = "flex";
  state = "raise";
  requestAnimationFrame(loop);
}

let state = "loading";
const holdFill = document.getElementById("holdFill");
const startGate = new StartGate(mode, holdFill);

let autoDiff, count, playEndAt;
let round = null, roundAt, resolving;
let value = 50;              // 지금 내 몸이 가리키는 수 (0~100)
let judged = null;           // 확정한 수
let judgedOk = false;
let netShake = 0;
// 어깨 너비의 이만큼 솟구치면 "뛰었다"고 본다 (확정 동작)
const JUMP_POWER = 0.17;
// 몸을 좌우로 어깨 너비의 이만큼 옮기면 수직선 끝까지 간다.
// 기울이기만 해도, 한 걸음 옮겨도 닿을 만큼으로 잡았다.
const SPAN = 1.8;
let confetti = [], sparks = [];
const shake = new ScreenShake();
let recorder, comboShot, fallbackShot, autoRec, recordedBlob = null;
const recIndicator = document.getElementById("recIndicator");
let cursors = [];
let lastFrameAt = 0;


// 수직선이 놓인 줄
function lineY() { return dims.h * 0.66; }
function lineX0() { return dims.w * 0.08; }
function lineX1() { return dims.w * 0.92; }
function nToX(n) { return lineX0() + (Math.max(0, Math.min(NMAX, n)) / NMAX) * (lineX1() - lineX0()); }

function newRound() {
  round = genRound(autoDiff.level);
  resolving = false;
  judged = null;
  netShake = 0;
  motion.reset();
  roundAt = performance.now();
}

function startCountdown() {
  state = "countdown";
  document.getElementById("countdownPanel").style.display = "flex";
  const numEl = document.getElementById("countNum");
  let n = 3;
  numEl.textContent = n;
  if (!isMuted()) sound.countBeep();
  const iv = setInterval(() => {
    n--;
    if (n <= 0) {
      clearInterval(iv);
      document.getElementById("countdownPanel").style.display = "none";
      if (!isMuted()) sound.go();
      beginPlay();
    } else {
      numEl.textContent = n;
      if (!isMuted()) sound.countBeep();
    }
  }, 700);
}

function beginPlay() {
  state = "playing";
  const prev = HighScore.get(UNIT);
  autoDiff = new AutoDifficulty(levelFromUrl(AutoDifficulty.startLevelFromHighScore(prev)));
  count = 0;
  party.reset();
  confetti = []; sparks = [];
  playEndAt = performance.now() + 60000;
  lastFrameAt = 0;
  newRound();

  recorder = new ClipRecorder(canvas, sound, 24);
  recorder.prepare();
  comboShot = new ComboShot(canvas);
  fallbackShot = new ComboShot(canvas);
  autoRec = scheduleAutoRecording(recorder, {
    onStartVisual: () => {
      recIndicator.style.display = "flex";
      setTimeout(() => { if (!comboShot.captured) fallbackShot.capture(canvas); }, 1500);
    },
    onEndVisual: () => { recIndicator.style.display = "none"; },
    onDone: (blob) => { recordedBlob = blob; },
    fallbackMs: 8000,
  });
}

function judge() {
  resolving = true;
  judged = Math.round(value);
  const ok = judged >= round.lo && judged <= round.hi;
  judgedOk = ok;
  netShake = 1;
  const x = nToX(judged), y = lineY();

  if (ok) {
    count++;
    party.correct(x, y - dims.h * 0.10, { base: 11, elapsedMs: performance.now() - roundAt });
    if (party.combo > 0 && party.combo === party.maxCombo) comboShot.capture(canvas);
    autoDiff.reportCorrect();
    autoRec.trigger();
    shake.trigger(9, 220);
    if (!isMuted()) sound.hit("perfect");
    spawnSparkles(sparks, x, y, 30, ["#fff", PARTY.gold, CUTE.green, CUTE.green]);
    spawnSparkles(sparks, x - 50, y - 20, 12, [PARTY.gold, CUTE.green]);
    spawnSparkles(sparks, x + 50, y - 20, 12, [PARTY.gold, CUTE.green]);
    if (party.combo > 0 && party.combo % 5 === 0) {
      spawnConfetti(confetti, x, y - 60, 44);
      if (!isMuted()) sound.fever();
    }
  } else {
    party.wrong(x, y - dims.h * 0.10, "조건을 다시 봐요!");
    autoDiff.reportWrong();
    shake.trigger(6, 170);
    if (!isMuted()) sound.wrong();
    spawnSparkles(sparks, x, y, 12, [CUTE.orangeDark, "#fff"]);
  }
  setTimeout(() => { if (state === "playing") newRound(); }, 1400);
}

function endGame() {
  state = "result";
  const { medal, label } = medalFor(count, MEDALS);
  const prev = HighScore.get(UNIT);
  const best = Math.max(count, prev ? prev.count : 0);
  if (!prev || count >= prev.count) {
    HighScore.set(UNIT, { count, bestLevel: autoDiff.level, label: `${medal} ${count}${RECORD_SUFFIX}`, at: Date.now() });
  }
  renderPodium({ unit: UNIT, medal, label, coins: party.coins, maxCombo: party.maxCombo, count, suffix: RECORD_SUFFIX, best });

  document.getElementById("statCount").textContent = count + "개";
  document.getElementById("statBest").textContent = best + "개";
  document.getElementById("statCombo").textContent = "🔥" + party.maxCombo;

  const shot = comboShot.captured ? comboShot : fallbackShot;
  const previewVideo = document.getElementById("previewVideo");
  const saveVideoBtn = document.getElementById("saveVideoBtn");
  if (recordedBlob) {
    previewVideo.src = URL.createObjectURL(recordedBlob);
    previewVideo.style.display = "block";
    saveVideoBtn.style.display = "inline-block";
  }
  document.getElementById("savePhotoBtn").onclick = async () => {
    const blob = await shot.toBlob((c, w, h) => drawPhotoOverlay(c, w, h, { title: TITLE, record: count + RECORD_SUFFIX, medal }));
    downloadBlob(blob, `수학체육올림픽5_수직선달리기_${formatFileTimestamp()}.png`);
  };
  document.getElementById("saveVideoBtn").onclick = () => {
    if (recordedBlob) downloadBlob(recordedBlob, `수학체육올림픽5_수직선달리기_${formatFileTimestamp()}.${recorder.extension}`);
  };
  document.getElementById("resultPanel").style.display = "flex";
  if (!isMuted()) sound.success();
}

document.getElementById("retryBtn").addEventListener("click", () => {
  document.getElementById("resultPanel").style.display = "none";
  document.getElementById("raisePanel").style.display = "flex";
  startGate.since = 0; startGate.ready = false; holdFill.style.width = "0%";
  state = "raise";
});

document.getElementById("raisePanel").addEventListener("click", () => {
  if (state === "raise" && mode !== "motion") goReady();
});

function goReady() {
  state = "ready";
  document.getElementById("raisePanel").style.display = "none";
  document.getElementById("readyPanel").style.display = "flex";
  if (!isMuted()) sound.click();
  setTimeout(() => {
    document.getElementById("readyPanel").style.display = "none";
    startCountdown();
  }, 500);
}

// ── 몸의 좌우 위치가 곧 수 ───────────────────────────────────────────────
// 보기를 고르는 게 아니라, 수직선 위 어디에 서느냐가 그대로 답이 된다.
function updateValue() {
  if (resolving) return;
  if (mode !== "motion") {
    const p = cursors[0];
    if (p) value = Math.max(0, Math.min(NMAX, ((p.x - lineX0()) / (lineX1() - lineX0())) * NMAX));
    return;
  }
  const f = motion.last;
  if (!f) return;
  // 화면 한가운데가 50. 어깨 너비의 SPAN배만큼 옮기면 끝까지 간다 —
  // 기울이기만 해도, 한 걸음 옮겨도 닿는다.
  const rel = (f.sc.x - dims.w / 2) / (f.unit * SPAN);
  value = Math.max(0, Math.min(NMAX, 50 + rel * 50));
}

// ── 확정: 제자리에서 점프 ──
function detectConfirm(now) {
  if (resolving) return;
  if (mode !== "motion") {
    if (pointerInput && pointerInput.consumeJustDown()) judge();
    return;
  }
  const j = motion.jump();
  if (j && j.power > JUMP_POWER) judge();
}

// ── 수직선 ──
function drawNumberLine(ctx, now) {
  const { w, h } = dims;
  const y = lineY();
  const x0 = lineX0(), x1 = lineX1();

  // 판정이 끝난 뒤에만 정답 구간을 보여 준다 (미리 보이면 답을 알려 주는 셈)
  if (judged !== null) {
    const a = nToX(round.lo), b = nToX(round.hi);
    ctx.save();
    ctx.fillStyle = "rgba(81,207,102,0.28)";
    ctx.fillRect(a, y - h * 0.09, Math.max(b - a, 6), h * 0.09);
    ctx.strokeStyle = CUTE.greenDark;
    ctx.lineWidth = fluidPx(dims, 3, { min: 2, max: 4.5 });
    ctx.strokeRect(a, y - h * 0.09, Math.max(b - a, 6), h * 0.09);
    ctx.restore();
    drawChunkyText(ctx, round.target !== null ? `정답 ${round.target}` : `정답 ${round.lo}~${round.hi}`,
      (a + b) / 2, y - h * 0.13, fluidPx(dims, 18, { min: 13, max: 24 }), "#fff",
      { outline: CUTE.greenDark, outlineWidth: fluidPx(dims, 5, { min: 3.5, max: 7 }) });
  }

  // 축과 눈금
  ctx.save();
  ctx.strokeStyle = CUTE.ink;
  ctx.lineWidth = fluidPx(dims, 4, { min: 3, max: 6 });
  ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
  const fs = fluidPx(dims, 15, { min: 11, max: 20 });
  for (let n = 0; n <= NMAX; n += 5) {
    const big = n % 10 === 0;
    const x = nToX(n);
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x, y + (big ? fs * 0.95 : fs * 0.45));
    ctx.lineWidth = big ? fluidPx(dims, 2.8, { min: 2, max: 4 }) : fluidPx(dims, 1.5, { min: 1, max: 2.2 });
    ctx.stroke();
    if (big) {
      ctx.fillStyle = CUTE.ink;
      ctx.font = `900 ${fs}px sans-serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "top";
      ctx.fillText(String(n), x, y + fs * 1.15);
    }
  }
  ctx.restore();

  // 내 위치 표시 — 선수와 큰 숫자
  const shown = judged !== null ? judged : Math.round(value);
  const mx = nToX(shown);
  const shakeX = judged !== null && netShake > 0 ? Math.sin(now / 24) * netShake * 5 : 0;
  const pr = fluidPx(dims, 26, { min: 19, max: 36 });
  drawPlayer(ctx, mx + shakeX, y - pr * 1.5, pr, CHAR, party.currentMood(1e9));
  ctx.save();
  ctx.setLineDash([7, 6]);
  ctx.strokeStyle = judged !== null ? (judgedOk ? CUTE.greenDark : CUTE.orangeDark) : PARTY.gold;
  ctx.lineWidth = fluidPx(dims, 3, { min: 2, max: 4.5 });
  ctx.beginPath(); ctx.moveTo(mx + shakeX, y - pr * 0.6); ctx.lineTo(mx + shakeX, y); ctx.stroke();
  ctx.restore();
  drawChunkyText(ctx, String(shown), mx + shakeX, y - pr * 3.1,
    fluidPx(dims, 34, { min: 24, max: 46 }),
    judged !== null ? (judgedOk ? CUTE.green : CUTE.orangeDark) : "#fff",
    { outline: CUTE.ink, outlineWidth: fluidPx(dims, 7, { min: 5, max: 10 }) });
}

function loop(tsMs) {
  requestAnimationFrame(loop);
  if (mode === "motion" && video.readyState < 2) return;
  const { ctx, w, h } = dims;
  ctx.save();
  shake.apply(ctx);
  if (mode === "motion") drawMirroredVideo(ctx, video, w, h);
  else drawPartyBackdrop(ctx, dims);
  drawDrifters(ctx, drifters, dims, 1 / 60);
  drawBunting(ctx, dims);
  drawCrowd(ctx, dims, party.cheerUntil);

  let result = null;
  if (mode === "motion") {
    result = poseTracker.detect(video, tsMs);
    motion.push(tsMs, posePoints(result), w, h, video);
    if (state === "raise") {
      if (startGate.update(tsMs, isArmRaised(posePoints(result)))) goReady();
    }
  }
  cursors = getCursors(mode, result, w, h, video, pointerInput);

  if (state === "playing") stepGame();

  if (mode === "motion") {
    const f = motion.last;
    if (f) {
      const sw = motion.swing();
      const ready = sw && sw.speed > THROW_SPEED * 0.5;
      const r = fluidPx(dims, 26, { min: 18, max: 36 });
      const throwHand = (f.lw.y < f.rw.y) ? "lw" : "rw";
      for (const k of ["lw", "rw"]) {
        drawSticker(ctx, f[k].x, f[k].y, k === throwHand ? r : r * 0.7,
          k === throwHand ? (ready ? PARTY.gold : CUTE.cream) : "rgba(255,255,255,0.7)",
          { lineWidth: Math.max(3, r * 0.14) });
      }
    } else if (state === "playing") {
      drawChunkyText(ctx, "카메라에 몸이 보이게 한 걸음 물러서 주세요!", w * 0.5, h * 0.5,
        fluidPx(dims, 22, { min: 16, max: 30 }), "#fff",
        { outline: CUTE.ink, outlineWidth: fluidPx(dims, 6, { min: 4, max: 8 }) });
    }
  } else {
    for (const c of cursors) drawGloveCursor(ctx, c.x, c.y, fluidPx(dims, 44, { min: 32, max: 62 }), { active: !resolving });
  }
  ctx.restore();
}

function stepGame() {
  const { ctx, w, h } = dims;
  // 홀드·게이지는 프레임 수가 아니라 실제 흐른 시간으로 쌓아야 한다.
  // 느린 기기에서 프레임이 떨어지면 제한 시간만 실시간으로 흐르고 게이지는 안 차서 불리해진다.
  const dt = lastFrameAt ? Math.min(0.06, (performance.now() - lastFrameAt) / 1000) : 1 / 60;
  lastFrameAt = performance.now();
  const remain = Math.max(0, playEndAt - performance.now());
  if (remain <= 0) { endGame(); return; }
  const now = performance.now();

  updateValue();
  if (now - roundAt > 300) detectConfirm(now);
  if (netShake > 0) netShake = Math.max(0, netShake - dt * 2.2);

  drawNumberLine(ctx, now);

  const hudBottom = party.drawHud(ctx, dims, { remainMs: remain, count, suffix: "개" });

  drawCuteBanner(ctx, dims, [
    { text: round.text, size: 22, chunky: true, color: PARTY.gold },
    { text: round.hint, size: 14, color: CUTE.ink },
  ], fluidPx, { top: hudBottom });

  drawChunkyText(ctx,
    mode === "motion" ? "몸을 좌우로 움직여 수를 맞추고, 제자리에서 점프!" : "좌우로 움직여 수를 맞추고 눌러요!",
    w * 0.5, h * 0.96, fluidPx(dims, 15, { min: 11, max: 20 }), "#fff",
    { outline: CUTE.ink, outlineWidth: fluidPx(dims, 5, { min: 3.5, max: 7 }) });

  party.update(dt);
  confetti = updateConfetti(confetti, dt); drawConfetti(ctx, confetti);
  sparks = updateSparkles(sparks, dt); drawSparkles(ctx, sparks);
  party.drawFx(ctx, dims);
  party.drawFeverFrame(ctx, dims);

  drawVignette(ctx, w, h, 0.16);
  drawLevelStars(ctx, dims, autoDiff.level, fluidPx);
}

init();
</script>
