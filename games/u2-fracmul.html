<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>백스윙 투척 · 종목 2</title>
<link rel="stylesheet" href="../css/style.css?v=6">
</head>
<body>

<div class="game-stage">
  <video id="video" playsinline muted style="display:none"></video>
  <canvas id="gameCanvas"></canvas>

  <div class="hud">
    <div class="rec" id="recIndicator" style="display:none"><span class="dot"></span>REC</div>
    <button class="home-btn" id="homeBtn">🏠</button>
  </div>

  <div class="overlay-panel" id="loadingPanel">
    <h2>🥎 백스윙 투척</h2>
    <p id="loadingText">준비 중…</p>
  </div>

  <div class="overlay-panel" id="rulePanel" style="display:none">
    <div class="rule-card">
      <div class="rule-head">
        <div class="rule-char">🐿️</div>
        <div>
          <div class="rule-name">도토리</div>
          <h2 class="rule-title">백스윙 투척</h2>
        </div>
      </div>
      <p class="rule-cheer"></p>
      <ul class="rule-list"></ul>
      <div class="rule-timer"><div class="rule-timer-fill"></div></div>
      <button class="rule-go">좋아, 시작!</button>
    </div>
  </div>

  <div class="overlay-panel" id="raisePanel" style="display:none">
    <div class="raise-icon" id="raiseIcon">🙋</div>
    <h2 id="raiseText">손을 들어 주세요!</h2>
    <div class="hold-bar"><div class="hold-fill" id="holdFill"></div></div>
  </div>

  <div class="overlay-panel ready-flash" id="readyPanel" style="display:none">
    <h2>✋ 좋아요! 준비됐어요</h2>
  </div>

  <div class="overlay-panel" id="countdownPanel" style="display:none">
    <div class="countdown-num" id="countNum">3</div>
  </div>

  <div class="overlay-panel" id="resultPanel" style="display:none">
    <div id="podium"></div>
    <div class="result-stats">
      <div class="stat-box"><div class="num" id="statCount">0번</div><div class="label">명중</div></div>
      <div class="stat-box"><div class="num" id="statBest">0번</div><div class="label">최고 기록</div></div>
      <div class="stat-box"><div class="num" id="statCombo">0</div><div class="label">최고 콤보</div></div>
    </div>
    <video class="preview" id="previewVideo" controls playsinline style="display:none"></video>
    <div class="action-row">
      <button class="ghost-btn" id="savePhotoBtn">📸 사진</button>
      <button class="ghost-btn" id="saveVideoBtn" style="display:none">🎬 3초 영상</button>
      <button class="big-btn" id="retryBtn">🔁 한 번 더</button>
      <button class="ghost-btn" id="homeBtn2">🏠 종목 선택</button>
    </div>
  </div>
</div>

<script type="module">
import {
  HighScore, requestWakeLock, SoundKit, FileAudioLoop,
  HandTracker, ClipRecorder, downloadBlob,
  drawMirroredVideo, fitCanvasToScreen, isHandRaised, getCursors,
  AutoDifficulty, levelFromUrl, medalFor,
  scheduleAutoRecording, ComboShot, drawPhotoOverlay,
  ScreenShake, InputMode, PointerInput, StartGate, SmoothedPoint,
  startCamera, formatFileTimestamp, fluidPx, showSoundHint,
  drawVignette, spawnConfetti, updateConfetti, drawConfetti,
} from "../js/engine.js?v=4";
import {
  CUTE, bob, drawSticker, drawStickerRect, drawChunkyText,
  spawnSparkles, updateSparkles, drawSparkles, makeDrifters, drawDrifters,
  drawBunting, drawGloveCursor, drawLevelStars, drawCuteBanner,
} from "../js/cute.js?v=7";
import {
  PARTY, CHARACTERS, Party, drawPartyBackdrop, drawCrowd, drawMascot,
  showRuleCard, renderPodium, irisTransition,
} from "../js/party.js?v=2";
requestWakeLock();

const UNIT = "f2";
const TITLE = "백스윙 투척";
const RECORD_SUFFIX = "번 명중";
const MEDALS = { bronze: 3, silver: 6, gold: 9 };
const CHAR = CHARACTERS[UNIT];
const mode = InputMode.get();

const video = document.getElementById("video");
const canvas = document.getElementById("gameCanvas");
let dims = fitCanvasToScreen(canvas);
let drifters = makeDrifters(10, dims.w, dims.h);
window.addEventListener("resize", () => {
  dims = fitCanvasToScreen(canvas);
  drifters = makeDrifters(10, dims.w, dims.h);
});

const sound = new SoundKit();
const bgm = new FileAudioLoop("../assets/sounds/subbgm.mp3", 0.32);
const isMuted = () => localStorage.getItem("smo_muted") === "1";
const party = new Party({ unit: UNIT, sound, isMuted });

function goHome() { bgm.stop(); irisTransition(() => { location.href = "../index.html"; }); }
document.getElementById("homeBtn").addEventListener("click", goHome);
document.getElementById("homeBtn2").addEventListener("click", goHome);

function randInt(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }
function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }

// ---------------------------------------------------------------------------
// 문제 만들기 — 식의 값이 곧 던져야 할 거리(m). 눈금이 0.5 m이므로 답도 0.5의 배수로.
// ---------------------------------------------------------------------------
const MAXM = 12;
function fracText(n, d) { return `${n}/${d}`; }
function mixedText(w, n, d) { return w > 0 ? `${w}와 ${n}/${d}` : fracText(n, d); }

// 교과서 문제는 늘 기약분수로 제시되므로 3/6 같은 꼴이 나오지 않게 한다
function properFrac(maxD) {
  for (let i = 0; i < 60; i++) {
    const d = randInt(2, maxD);
    const n = randInt(1, d - 1);
    if (gcd(n, d) === 1) return { n, d };
  }
  return { n: 1, d: 2 };
}

// 언제나 (진분수) × (자연수) 한 가지 꼴만 낸다.
// 자연수를 분모의 배수로 잡으므로 답이 늘 자연수가 되어, 머릿속으로 바로 셀 수 있다.
// (분수 × 분수는 답이 1보다 작아지기 일쑤라 눈금에 맞추기 어려워 빼 두었다)
function genRound(level) {
  const maxD = level === 1 ? 4 : (level === 2 ? 5 : 6);   // 분모 크기로만 난이도를 올린다
  const maxV = level === 1 ? 6 : (level === 2 ? 9 : 12);  // 답(=던질 거리)의 상한
  for (let tries = 0; tries < 300; tries++) {
    const { n, d } = properFrac(maxD);
    // c = d × k 이면 (n/d) × c = n × k 로 딱 떨어진다
    const kMax = Math.min(Math.floor(maxV / n), Math.floor(20 / d));
    if (kMax < 1) continue;
    const k = randInt(1, kMax);
    const c = d * k;
    const value = n * k;
    if (c < 2 || value < 1 || value > maxV) continue;
    return { text: `${fracText(n, d)} × ${c}`, value };
  }
  return { text: "1/2 × 4", value: 2 };
}

const handTracker = new HandTracker();
let pointerInput = null;

async function init() {
  if (!isMuted()) bgm.play(showSoundHint);
  if (mode === "motion") {
    try {
      await startCamera(video, { width: 640, height: 480 });
      if (!isMuted()) bgm.play(showSoundHint);
    } catch (e) {
      document.getElementById("loadingText").textContent = "⚠️ 카메라를 찾을 수 없어요. 카메라 권한을 확인해주세요.";
      return;
    }
    document.getElementById("loadingText").textContent = "AI 모델을 불러오는 중…";
    await handTracker.init(1);
  } else {
    pointerInput = new PointerInput(canvas);
  }
  document.getElementById("loadingPanel").style.display = "none";

  await showRuleCard({
    unit: UNIT,
    title: "백스윙 투척",
    lines: [
      "식을 계산해서 <b>몇 m 던져야 하는지</b> 알아내요.",
      mode === "motion"
        ? "손을 <b>뒤(왼쪽)로 당길수록</b> 멀리 날아가요. 당긴 만큼 착지점이 눈금에 표시돼요."
        : "화면을 누른 채 <b>왼쪽으로 당겼다가 놓으면</b> 날아가요.",
      mode === "motion"
        ? "계산한 거리에 맞춰 당긴 뒤, <b>팔을 앞으로 확 휘두르면</b> 발사!"
        : "계산한 거리에 맞춰 당긴 뒤 <b>손을 떼면</b> 발사!",
      "문제는 늘 <b>(분수) × (자연수)</b> 꼴이고, <b>답은 자연수</b>예요. 편하게 계산해요!",
    ],
  });

  document.getElementById("raiseIcon").textContent = mode === "motion" ? "🙋" : "👆";
  document.getElementById("raiseText").textContent = mode === "motion" ? "손을 들어 주세요!" : "화면을 터치(클릭)하면 시작!";
  document.getElementById("raisePanel").style.display = "flex";
  state = "raise";
  requestAnimationFrame(loop);
}

let state = "loading";
const holdFill = document.getElementById("holdFill");
const startGate = new StartGate(mode, holdFill);

let autoDiff, count, playEndAt;
let round, phase, roundAt, ball = null, resultMark = null;
let pull = 0;                          // 지금 당긴 거리(m)
let trail = [];                        // 최근 손 위치 — 앞으로 휘두르는 순간을 잡는다
let ballTrail = [];                    // 날아가는 공이 지나온 자리 — 잔상으로 그린다
let wasDown = false;
const smooth = new SmoothedPoint(4);
let confetti = [], sparks = [];
const shake = new ScreenShake();
let recorder, comboShot, fallbackShot, autoRec, recordedBlob = null;
const recIndicator = document.getElementById("recIndicator");
let cursors = [];
let lastFrameAt = 0;

const RULER_Y = () => dims.h * 0.74;
const RX0 = () => dims.w * 0.13;
const RX1 = () => dims.w * 0.95;
const mToX = (m) => RX0() + (m / MAXM) * (RX1() - RX0());
// 당김 구간: 오른쪽(기준선)에서 왼쪽 끝까지 당기면 최대 사거리
const PULL_ZERO = () => dims.w * 0.62;
const PULL_FULL = () => dims.w * 0.08;
const xToPull = (x) => {
  const t = (PULL_ZERO() - x) / (PULL_ZERO() - PULL_FULL());
  return Math.max(0, Math.min(1, t)) * MAXM;
};

function newRound() {
  round = genRound(autoDiff.level);
  phase = "aim";
  roundAt = performance.now();
  ball = null; resultMark = null;
  pull = 0; trail = []; smooth.reset(); wasDown = false;
}

function startCountdown() {
  state = "countdown";
  document.getElementById("countdownPanel").style.display = "flex";
  const numEl = document.getElementById("countNum");
  let n = 3;
  numEl.textContent = n;
  if (!isMuted()) sound.countBeep();
  const iv = setInterval(() => {
    n--;
    if (n <= 0) {
      clearInterval(iv);
      document.getElementById("countdownPanel").style.display = "none";
      if (!isMuted()) sound.go();
      beginPlay();
    } else {
      numEl.textContent = n;
      if (!isMuted()) sound.countBeep();
    }
  }, 700);
}

function beginPlay() {
  state = "playing";
  const prev = HighScore.get(UNIT);
  autoDiff = new AutoDifficulty(levelFromUrl(AutoDifficulty.startLevelFromHighScore(prev)));
  count = 0;
  party.reset();
  confetti = []; sparks = [];
  playEndAt = performance.now() + 60000;
  lastFrameAt = 0;
  newRound();

  recorder = new ClipRecorder(canvas, sound, 24);
  recorder.prepare();
  comboShot = new ComboShot(canvas);
  fallbackShot = new ComboShot(canvas);
  autoRec = scheduleAutoRecording(recorder, {
    onStartVisual: () => {
      recIndicator.style.display = "flex";
      setTimeout(() => { if (!comboShot.captured) fallbackShot.capture(canvas); }, 1500);
    },
    onEndVisual: () => { recIndicator.style.display = "none"; },
    onDone: (blob) => { recordedBlob = blob; },
    fallbackMs: 8000,
  });
}

function fire(power) {
  if (phase !== "aim") return;
  const landed = Math.round(power * 2) / 2;
  if (landed < 0.5) return;                 // 살짝 흔든 것까지 발사로 치면 억울하다
  phase = "fly";
  ball = { landed, start: performance.now(), dur: 1000 };
  ballTrail = [];
  if (!isMuted()) sound.shot();
}

// 착지 직전을 느리게 — 마지막 25%의 시간이 거리의 12%만 소화한다
function flightT(u) {
  return u < 0.75 ? (u / 0.75) * 0.88 : 0.88 + ((u - 0.75) / 0.25) * 0.12;
}

function resolveShot() {
  const err = Math.abs(ball.landed - round.value);
  const ok = err < 0.26;
  // 성공 안에서도 정중앙이면 더 크게 축하한다 (합격선 0.26 m는 그대로)
  const tier = err < 0.1 ? "perfect" : (ok ? "good" : "miss");
  phase = "done";
  resultMark = { landed: ball.landed, ok, tier, at: performance.now() };
  const x = mToX(ball.landed), y = RULER_Y();
  const py = y - fluidPx(dims, 60, { min: 44, max: 84 });
  if (ok) {
    count++;
    party.correct(x, py, { base: 12, elapsedMs: performance.now() - roundAt });
    if (party.combo > 0 && party.combo === party.maxCombo) comboShot.capture(canvas);
    autoDiff.reportCorrect();
    autoRec.trigger();
    if (!isMuted()) sound.hit(tier);
    shake.trigger(tier === "perfect" ? 11 : 7, tier === "perfect" ? 240 : 160);
    spawnSparkles(sparks, x, y, tier === "perfect" ? 38 : 26, ["#fff", PARTY.gold, CUTE.green]);
    // 콤보가 쌓일수록 불꽃이 커진다
    const boost = Math.min(30, party.combo * 4);
    spawnConfetti(confetti, x, y, (tier === "perfect" ? 48 : 34) + boost);
    if (tier === "perfect") {
      spawnSparkles(sparks, x - 60, y - 40, 14, [PARTY.gold, "#fff"]);
      spawnSparkles(sparks, x + 60, y - 40, 14, [PARTY.gold, "#fff"]);
    }
  } else {
    party.wrong(x, py, "아깝다!");
    autoDiff.reportWrong();
    shake.trigger(4, 150);
  }
  setTimeout(() => { if (state === "playing") newRound(); }, ok ? 950 : 1500);
}

function endGame() {
  state = "result";
  const { medal, label } = medalFor(count, MEDALS);
  const prev = HighScore.get(UNIT);
  const best = Math.max(count, prev ? prev.count : 0);
  if (!prev || count >= prev.count) {
    HighScore.set(UNIT, { count, bestLevel: autoDiff.level, label: `${medal} ${count}${RECORD_SUFFIX}`, at: Date.now() });
  }
  renderPodium({ unit: UNIT, medal, label, coins: party.coins, maxCombo: party.maxCombo, count, suffix: RECORD_SUFFIX, best });

  document.getElementById("statCount").textContent = count + "번";
  document.getElementById("statBest").textContent = best + "번";
  document.getElementById("statCombo").textContent = "🔥" + party.maxCombo;

  const shot = comboShot.captured ? comboShot : fallbackShot;
  const previewVideo = document.getElementById("previewVideo");
  const saveVideoBtn = document.getElementById("saveVideoBtn");
  if (recordedBlob) {
    previewVideo.src = URL.createObjectURL(recordedBlob);
    previewVideo.style.display = "block";
    saveVideoBtn.style.display = "inline-block";
  }
  document.getElementById("savePhotoBtn").onclick = async () => {
    const blob = await shot.toBlob((c, w, h) => drawPhotoOverlay(c, w, h, { title: TITLE, record: count + RECORD_SUFFIX, medal }));
    downloadBlob(blob, `수학체육올림픽5_백스윙투척_${formatFileTimestamp()}.png`);
  };
  document.getElementById("saveVideoBtn").onclick = () => {
    if (recordedBlob) downloadBlob(recordedBlob, `수학체육올림픽5_백스윙투척_${formatFileTimestamp()}.${recorder.extension}`);
  };
  document.getElementById("resultPanel").style.display = "flex";
  if (!isMuted()) sound.success();
}

document.getElementById("retryBtn").addEventListener("click", () => {
  document.getElementById("resultPanel").style.display = "none";
  document.getElementById("raisePanel").style.display = "flex";
  startGate.since = 0; startGate.ready = false; holdFill.style.width = "0%";
  state = "raise";
});

document.getElementById("raisePanel").addEventListener("click", () => {
  if (state === "raise" && mode !== "motion") goReady();
});

function goReady() {
  state = "ready";
  document.getElementById("raisePanel").style.display = "none";
  document.getElementById("readyPanel").style.display = "flex";
  if (!isMuted()) sound.click();
  setTimeout(() => {
    document.getElementById("readyPanel").style.display = "none";
    startCountdown();
  }, 500);
}

function loop(tsMs) {
  requestAnimationFrame(loop);
  if (mode === "motion" && video.readyState < 2) return;
  const { ctx, w, h } = dims;
  ctx.save();
  shake.apply(ctx);
  if (mode === "motion") drawMirroredVideo(ctx, video, w, h);
  else drawPartyBackdrop(ctx, dims);
  drawDrifters(ctx, drifters, dims, 1 / 60);
  drawBunting(ctx, dims);
  drawCrowd(ctx, dims, party.cheerUntil);

  let result = null;
  if (mode === "motion") {
    result = handTracker.detect(video, tsMs);
    if (state === "raise") {
      let raised = false;
      if (result && result.landmarks) for (const lm of result.landmarks) if (isHandRaised(lm)) raised = true;
      if (startGate.update(tsMs, raised)) goReady();
    }
  }
  cursors = getCursors(mode, result, w, h, video, pointerInput);

  if (state === "playing") stepGame();

  for (const c of cursors) drawGloveCursor(ctx, c.x, c.y, fluidPx(dims, 44, { min: 32, max: 62 }), { active: pull > 0.4 });
  ctx.restore();
}

// ── 입력: 뒤로 당겼다가 앞으로 휘두르면 발사 ────────────────────────────────
function updatePull(now) {
  const armed = now - roundAt > 700;
  if (mode === "motion") {
    if (cursors.length === 0) return;
    const p = smooth.push(cursors[0].x, cursors[0].y);
    trail.push({ t: now, x: p.x, pull: xToPull(p.x) });
    while (trail.length && now - trail[0].t > 260) trail.shift();
    pull = xToPull(p.x);

    // 260ms 안에 화면 폭의 12% 이상 오른쪽으로 움직였으면 "던졌다"고 본다
    if (armed && trail.length >= 3) {
      const oldest = trail[0];
      if (p.x - oldest.x > dims.w * 0.12) {
        fire(oldest.pull);                  // 세기는 "당겼던 그 순간"의 값
        trail = []; smooth.reset(); pull = 0;
      }
    }
    return;
  }

  // 터치/마우스: 누른 채 당겼다가 떼면 발사 (새총)
  // 누르고 떼는 게 한 프레임 안에 다 일어나도 놓치지 않도록 consumeJustDown으로 눌림을 걸어 둔다
  const pts = pointerInput ? pointerInput.points : [];
  const justDown = pointerInput ? pointerInput.consumeJustDown() : false;
  const down = pointerInput && pointerInput.down && pts.length > 0;
  if (justDown) wasDown = true;
  if (pts.length > 0 && (down || justDown)) pull = xToPull(pts[0].x);
  if (wasDown && !down) { wasDown = false; if (armed) fire(pull); pull = 0; }
}

function stepGame() {
  const { ctx, w, h } = dims;
  // 홀드·게이지는 프레임 수가 아니라 실제 흐른 시간으로 쌓아야 한다.
  // 느린 기기에서 프레임이 떨어지면 제한 시간만 실시간으로 흐르고 게이지는 안 차서 불리해진다.
  const dt = lastFrameAt ? Math.min(0.06, (performance.now() - lastFrameAt) / 1000) : 1 / 60;
  lastFrameAt = performance.now();
  const remain = Math.max(0, playEndAt - performance.now());
  if (remain <= 0) { endGame(); return; }
  const now = performance.now();

  if (phase === "aim") updatePull(now);
  if (phase === "fly" && now - ball.start >= ball.dur) resolveShot();

  // ── 그리기 ──────────────────────────────────────────────
  const ry = RULER_Y();
  ctx.save();
  ctx.fillStyle = "rgba(140,233,154,0.45)";
  ctx.fillRect(0, ry, w, h - ry);
  ctx.restore();

  // 거리 눈금자
  ctx.save();
  ctx.strokeStyle = CUTE.ink; ctx.lineWidth = fluidPx(dims, 4, { min: 3, max: 6 });
  ctx.beginPath(); ctx.moveTo(RX0(), ry); ctx.lineTo(RX1(), ry); ctx.stroke();
  const labelSize = fluidPx(dims, 15, { min: 10, max: 20 });
  for (let m = 0; m <= MAXM; m += 0.5) {
    const x = mToX(m);
    const big = Number.isInteger(m);
    ctx.beginPath();
    ctx.moveTo(x, ry);
    ctx.lineTo(x, ry + (big ? fluidPx(dims, 15, { min: 11, max: 21 }) : fluidPx(dims, 8, { min: 6, max: 11 })));
    ctx.lineWidth = big ? fluidPx(dims, 3.2, { min: 2.4, max: 4.6 }) : fluidPx(dims, 1.8, { min: 1.2, max: 2.6 });
    ctx.stroke();
    if (big) {
      ctx.fillStyle = CUTE.ink;
      ctx.font = `900 ${labelSize}px sans-serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "top";
      ctx.fillText(String(m), x, ry + fluidPx(dims, 19, { min: 14, max: 25 }));
    }
  }
  ctx.restore();

  // 캐논 — 당길수록 뒤로 젖혀진다
  const cr = fluidPx(dims, 25, { min: 19, max: 34 });
  const lean = (pull / MAXM) * 0.5;
  const cx = w * 0.06, cy = ry - cr * 0.9;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(-lean);
  drawStickerRect(ctx, cr * 0.6, 0, cr * 2.3, cr * 1.05, cr * 0.4, CUTE.orangeDark, { lineWidth: 3.5 });
  ctx.restore();
  drawMascot(ctx, cx, cy - cr * 1.7, cr, CHAR, party.currentMood(remain));

  // 당기는 중 — 예상 착지점과 포물선 미리보기
  if (phase === "aim" && pull > 0.2) {
    const px = mToX(Math.round(pull * 2) / 2);
    ctx.save();
    ctx.setLineDash([9, 8]);
    ctx.strokeStyle = "rgba(255,207,63,0.95)";
    ctx.lineWidth = fluidPx(dims, 3.5, { min: 2.5, max: 5 });
    ctx.beginPath();
    for (let i = 0; i <= 24; i++) {
      const t = i / 24;
      const x = cx + (px - cx) * t;
      const y = cy - Math.sin(Math.PI * t) * h * 0.30;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.restore();
    drawSticker(ctx, px, ry, fluidPx(dims, 12, { min: 9, max: 17 }), PARTY.gold, { lineWidth: 3 });
    drawChunkyText(ctx, `${(Math.round(pull * 2) / 2).toFixed(1)} m`, px, ry - fluidPx(dims, 30, { min: 22, max: 42 }),
      fluidPx(dims, 24, { min: 17, max: 32 }), "#fff",
      { outline: CUTE.ink, outlineWidth: fluidPx(dims, 6, { min: 4, max: 9 }) });

    // 당김 게이지 (뒤로 당긴 정도)
    const gy = ry + fluidPx(dims, 48, { min: 34, max: 68 });
    const gh = fluidPx(dims, 14, { min: 10, max: 20 });
    drawStickerRect(ctx, (PULL_FULL() + PULL_ZERO()) / 2, gy, PULL_ZERO() - PULL_FULL(), gh, gh / 2,
      "rgba(255,255,255,0.7)", { lineWidth: 2.5, drop: 2, gloss: false });
    const fillW = (pull / MAXM) * (PULL_ZERO() - PULL_FULL());
    ctx.save();
    // 세기에 따라 색이 달아오른다 — 정답 여부는 알려 주지 않으므로 난이도는 그대로다
    const k = pull / MAXM;
    ctx.fillStyle = k > 0.72 ? PARTY.gold : (k > 0.38 ? CUTE.orangeDark : CUTE.red);
    ctx.beginPath();
    ctx.roundRect(PULL_ZERO() - fillW, gy - gh / 2, fillW, gh, gh / 2);
    ctx.fill();
    ctx.restore();
  }

  // 날아가는 공 — 잔상을 남기고, 착지 직전에는 느려진다
  if (phase === "fly" || (resultMark && now - resultMark.at < 800)) {
    const u = phase === "fly" ? Math.min(1, (now - ball.start) / ball.dur) : 1;
    const t = flightT(u);
    const bx = cx + (mToX(ball.landed) - cx) * t;
    const by = cy - Math.sin(Math.PI * t) * h * 0.32;
    if (phase === "fly") {
      ballTrail.push({ x: bx, y: Math.min(by, ry) });
      if (ballTrail.length > 14) ballTrail.shift();
    }
    ctx.save();
    for (let i = 0; i < ballTrail.length; i++) {
      const p = ballTrail[i];
      const k = (i + 1) / ballTrail.length;
      ctx.globalAlpha = k * 0.42;
      drawSticker(ctx, p.x, p.y, cr * 0.34 * k, PARTY.gold, { lineWidth: 0, gloss: false, shadow: "rgba(0,0,0,0)" });
    }
    ctx.restore();
    ctx.save();
    ctx.font = `${cr * 1.1}px sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("🥎", bx, Math.min(by, ry));
    ctx.restore();
  }

  if (resultMark) {
    const x = mToX(resultMark.landed);

    // 3중 과녁 — 정답이 어디였는지 짚어 주는 표적. 던진 뒤에만 펼쳐 보여 준다.
    // 합격 범위(0.26 m)를 실제 눈금으로 그리면 7 px 남짓이라 보이지 않으므로,
    // 눈에 들어오는 크기의 표적으로 그린다 (가운데 점이 정답 자리다)
    const tx = mToX(round.value);
    const ringR = fluidPx(dims, 30, { min: 20, max: 44 });
    // resultMark는 이 프레임의 now를 읽은 뒤에 찍히므로 경과가 잠깐 음수가 될 수 있다.
    // 그대로 두면 반지름이 음수가 되어 arc가 예외를 던진다.
    const grow = Math.max(0, Math.min(1, (now - resultMark.at) / 260));
    ctx.save();
    ctx.globalAlpha = 0.85;
    [[1, "rgba(255,255,255,0.85)"], [0.6, "rgba(255,207,63,0.95)"], [0.33, "rgba(81,207,102,0.95)"]].forEach(([k, col]) => {
      ctx.beginPath();
      ctx.arc(tx, ry, ringR * k * grow, 0, Math.PI * 2);
      ctx.strokeStyle = col;
      ctx.lineWidth = fluidPx(dims, 3, { min: 2, max: 4.5 });
      ctx.stroke();
    });
    ctx.restore();

    drawSticker(ctx, x, ry, fluidPx(dims, 13, { min: 9, max: 18 }), resultMark.ok ? CUTE.green : CUTE.red, { lineWidth: 3 });

    if (resultMark.ok) {
      const label = resultMark.tier === "perfect" ? "PERFECT!" : "GOOD!";
      const pop = 1 + Math.sin(Math.max(0, Math.min(1, (now - resultMark.at) / 220)) * Math.PI) * 0.25;
      drawChunkyText(ctx, label, x, ry - fluidPx(dims, 62, { min: 44, max: 88 }),
        fluidPx(dims, resultMark.tier === "perfect" ? 30 : 24, { min: 17, max: 40 }) * pop, "#fff",
        { outline: resultMark.tier === "perfect" ? PARTY.gold : CUTE.green, outlineWidth: fluidPx(dims, 6, { min: 4, max: 9 }) });
    }
    if (!resultMark.ok) {
      const ax = mToX(round.value);
      ctx.save();
      ctx.strokeStyle = CUTE.green; ctx.lineWidth = fluidPx(dims, 4, { min: 3, max: 6 });
      ctx.setLineDash([8, 6]);
      ctx.beginPath(); ctx.moveTo(ax, ry - fluidPx(dims, 52, { min: 38, max: 72 })); ctx.lineTo(ax, ry); ctx.stroke();
      ctx.restore();
      drawChunkyText(ctx, `정답 ${round.value} m`, ax, ry - fluidPx(dims, 64, { min: 46, max: 90 }),
        fluidPx(dims, 18, { min: 13, max: 24 }), "#fff",
        { outline: CUTE.green, outlineWidth: fluidPx(dims, 5, { min: 3.5, max: 7 }) });
    }
  }

  const hudBottom = party.drawHud(ctx, dims, { remainMs: remain, count, suffix: "번" });
  drawCuteBanner(ctx, dims, [
    { text: `${round.text} = ? m`, size: 28, chunky: true, color: PARTY.gold },
    { text: mode === "motion" ? "계산한 거리만큼 당겼다가 앞으로 휘두르세요" : "계산한 거리만큼 당겼다가 손을 떼세요", size: 14, color: CUTE.ink },
  ], fluidPx, { top: hudBottom });

  party.update(dt);
  confetti = updateConfetti(confetti, dt); drawConfetti(ctx, confetti);
  sparks = updateSparkles(sparks, dt); drawSparkles(ctx, sparks);
  party.drawFx(ctx, dims);
  party.drawFeverFrame(ctx, dims);

  drawVignette(ctx, w, h, 0.16);
  drawLevelStars(ctx, dims, autoDiff.level, fluidPx);
}

init();
</script>
</body>
</html>
