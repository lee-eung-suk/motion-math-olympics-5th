<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>대칭 미러 수비 · 종목 3</title>
<link rel="stylesheet" href="../css/style.css?v=6">
</head>
<body>

<div class="game-stage">
  <video id="video" playsinline muted style="display:none"></video>
  <canvas id="gameCanvas"></canvas>

  <div class="hud">
    <div class="rec" id="recIndicator" style="display:none"><span class="dot"></span>REC</div>
    <button class="home-btn" id="homeBtn">🏠</button>
  </div>

  <div class="overlay-panel" id="loadingPanel">
    <h2>🪞 대칭 미러 수비</h2>
    <p id="loadingText">준비 중…</p>
  </div>

  <div class="overlay-panel" id="rulePanel" style="display:none">
    <div class="rule-card">
      <div class="rule-head">
        <div class="rule-char">🐧</div>
        <div>
          <div class="rule-name">미로 & 라로</div>
          <h2 class="rule-title">대칭 미러 수비</h2>
        </div>
      </div>
      <p class="rule-cheer"></p>
      <ul class="rule-list"></ul>
      <div class="rule-timer"><div class="rule-timer-fill"></div></div>
      <button class="rule-go">좋아, 시작!</button>
    </div>
  </div>

  <div class="overlay-panel" id="raisePanel" style="display:none">
    <div class="raise-icon" id="raiseIcon">🙌</div>
    <h2 id="raiseText">두 손을 들어 주세요!</h2>
    <div class="hold-bar"><div class="hold-fill" id="holdFill"></div></div>
  </div>

  <div class="overlay-panel ready-flash" id="readyPanel" style="display:none">
    <h2>✋ 좋아요! 준비됐어요</h2>
  </div>

  <div class="overlay-panel" id="countdownPanel" style="display:none">
    <div class="countdown-num" id="countNum">3</div>
  </div>

  <div class="overlay-panel" id="resultPanel" style="display:none">
    <div id="podium"></div>
    <div class="result-stats">
      <div class="stat-box"><div class="num" id="statCount">0번</div><div class="label">수비 성공</div></div>
      <div class="stat-box"><div class="num" id="statBest">0번</div><div class="label">최고 기록</div></div>
      <div class="stat-box"><div class="num" id="statCombo">0</div><div class="label">최고 콤보</div></div>
    </div>
    <video class="preview" id="previewVideo" controls playsinline style="display:none"></video>
    <div class="action-row">
      <button class="ghost-btn" id="savePhotoBtn">📸 사진</button>
      <button class="ghost-btn" id="saveVideoBtn" style="display:none">🎬 3초 영상</button>
      <button class="big-btn" id="retryBtn">🔁 한 번 더</button>
      <button class="ghost-btn" id="homeBtn2">🏠 종목 선택</button>
    </div>
  </div>
</div>

<script type="module">
import {
  HighScore, requestWakeLock, SoundKit, FileAudioLoop,
  HandTracker, ClipRecorder, downloadBlob,
  drawMirroredVideo, fitCanvasToScreen, isHandRaised, getCursors,
  AutoDifficulty, levelFromUrl, medalFor,
  scheduleAutoRecording, ComboShot, drawPhotoOverlay,
  ScreenShake, InputMode, PointerInput, StartGate,
  startCamera, formatFileTimestamp, fluidPx, showSoundHint,
  drawVignette, spawnConfetti, updateConfetti, drawConfetti,
} from "../js/engine.js?v=3";
import {
  CUTE, bob, drawSticker, drawStickerRect, drawChunkyText,
  spawnSparkles, updateSparkles, drawSparkles, makeDrifters, drawDrifters,
  drawBunting, drawGloveCursor, drawLevelStars, drawCuteBanner,
} from "../js/cute.js?v=7";
import {
  PARTY, CHARACTERS, Party, HandPair, drawTwoHandHint,
  drawPartyBackdrop, drawCrowd, drawMascot,
  showRuleCard, renderPodium, irisTransition,
} from "../js/party.js?v=2";
requestWakeLock();

const UNIT = "f3";
const TITLE = "대칭 미러 수비";
const RECORD_SUFFIX = "번 수비";
const MEDALS = { bronze: 4, silver: 8, gold: 12 };
const CHAR = CHARACTERS[UNIT];
const CHAR2 = { emoji: "🐧", name: "라로", color: CUTE.cyan, cheer: "" };
const mode = InputMode.get();

const video = document.getElementById("video");
const canvas = document.getElementById("gameCanvas");
let dims = fitCanvasToScreen(canvas);
let drifters = makeDrifters(10, dims.w, dims.h);
window.addEventListener("resize", () => {
  dims = fitCanvasToScreen(canvas);
  drifters = makeDrifters(10, dims.w, dims.h);
});

const sound = new SoundKit();
const bgm = new FileAudioLoop("../assets/sounds/subbgm.mp3", 0.32);
const isMuted = () => localStorage.getItem("smo_muted") === "1";
const party = new Party({ unit: UNIT, sound, isMuted });
const hands = new HandPair();

function goHome() { bgm.stop(); irisTransition(() => { location.href = "../index.html"; }); }
document.getElementById("homeBtn").addEventListener("click", goHome);
document.getElementById("homeBtn2").addEventListener("click", goHome);

function randInt(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }

const handTracker = new HandTracker();
let pointerInput = null;

async function init() {
  if (!isMuted()) bgm.play(showSoundHint);
  if (mode === "motion") {
    try {
      await startCamera(video, { width: 640, height: 480 });
      if (!isMuted()) bgm.play(showSoundHint);
    } catch (e) {
      document.getElementById("loadingText").textContent = "⚠️ 카메라를 찾을 수 없어요. 카메라 권한을 확인해주세요.";
      return;
    }
    document.getElementById("loadingText").textContent = "AI 모델을 불러오는 중…";
    await handTracker.init(2);
  } else {
    pointerInput = new PointerInput(canvas);
  }
  document.getElementById("loadingPanel").style.display = "none";

  await showRuleCard({
    unit: UNIT,
    title: "대칭 미러 수비",
    lines: [
      "<b>한 손은 날아온 타구에</b>, <b>다른 손은 그 대칭인 자리에</b> 동시에 대야 아웃!",
      "손을 움직이면 반대편에 <b>거울 손</b>이 같이 움직여요. 그 거울 손을 타구에 맞추면 돼요.",
      "두 손이 대칭이 되면 손 사이에 <b>초록 줄</b>이 켜져요.",
      mode !== "motion" ? "손가락이 하나면 <b>대칭인 자리만</b> 짚으면 돼요 (공을 짚는 게 아니에요)." : "",
    ].filter(Boolean),
  });

  document.getElementById("raiseIcon").textContent = mode === "motion" ? "🙌" : "👆";
  document.getElementById("raiseText").textContent = mode === "motion" ? "두 손을 들어 주세요!" : "화면을 터치(클릭)하면 시작!";
  document.getElementById("raisePanel").style.display = "flex";
  state = "raise";
  requestAnimationFrame(loop);
}

let state = "loading";
const holdFill = document.getElementById("holdFill");
const startGate = new StartGate(mode, holdFill);

let autoDiff, count, playEndAt;
let sym, ball, roundAt, resolving, dwell = 0, missMark = null;
let confetti = [], sparks = [];
const shake = new ScreenShake();
let recorder, comboShot, fallbackShot, autoRec, recordedBlob = null;
const recIndicator = document.getElementById("recIndicator");
let cursors = [];
let lastFrameAt = 0;

function field() {
  return { x0: dims.w * 0.07, x1: dims.w * 0.93, y0: dims.h * 0.33, y1: dims.h * 0.95 };
}
const catchR = () => fluidPx(dims, 54, { min: 42, max: 78 });

// ---------------------------------------------------------------------------
// 대칭 만들기 — 축(선대칭) 또는 중심(점대칭)
// ---------------------------------------------------------------------------
function makeSymmetry(level) {
  const f = field();
  const cx = (f.x0 + f.x1) / 2, cy = (f.y0 + f.y1) / 2;
  let kind, dir = null;
  if (level === 1) kind = "line-v";
  else if (level === 2) kind = Math.random() < 0.5 ? "line-h" : "line-d";
  else kind = Math.random() < 0.7 ? "point" : "line-d";

  if (kind === "line-v") dir = { x: 0, y: 1 };
  if (kind === "line-h") dir = { x: 1, y: 0 };
  if (kind === "line-d") {
    const s = Math.random() < 0.5 ? 1 : -1;
    const n = Math.SQRT1_2;
    dir = { x: n, y: n * s };
  }

  function mirror(p) {
    if (kind === "point") return { x: 2 * cx - p.x, y: 2 * cy - p.y };
    const vx = p.x - cx, vy = p.y - cy;
    const dot = vx * dir.x + vy * dir.y;
    return { x: cx + 2 * dot * dir.x - vx, y: cy + 2 * dot * dir.y - vy };
  }
  const label = kind === "point" ? "점대칭 · 중심을 지나 정반대쪽"
    : kind === "line-v" ? "선대칭 · 세로 대칭축"
    : kind === "line-h" ? "선대칭 · 가로 대칭축"
    : "선대칭 · 비스듬한 대칭축";
  return { kind, dir, cx, cy, mirror, label };
}

function spawnBall(s) {
  const f = field();
  const R = catchR();
  for (let i = 0; i < 240; i++) {
    const p = {
      x: f.x0 + R + Math.random() * (f.x1 - f.x0 - R * 2),
      y: f.y0 + R + Math.random() * (f.y1 - f.y0 - R * 2),
    };
    const m = s.mirror(p);
    if (m.x < f.x0 + R || m.x > f.x1 - R || m.y < f.y0 + R || m.y > f.y1 - R) continue;
    if (Math.hypot(m.x - p.x, m.y - p.y) < R * 2.8) continue;
    return { p, m };
  }
  return null;
}

function newRound() {
  const s = makeSymmetry(autoDiff.level);
  const b = spawnBall(s);
  if (!b) { newRound(); return; }
  sym = s; ball = b;
  resolving = false; dwell = 0; missMark = null;
  roundAt = performance.now();
}

function startCountdown() {
  state = "countdown";
  document.getElementById("countdownPanel").style.display = "flex";
  const numEl = document.getElementById("countNum");
  let n = 3;
  numEl.textContent = n;
  if (!isMuted()) sound.countBeep();
  const iv = setInterval(() => {
    n--;
    if (n <= 0) {
      clearInterval(iv);
      document.getElementById("countdownPanel").style.display = "none";
      if (!isMuted()) sound.go();
      beginPlay();
    } else {
      numEl.textContent = n;
      if (!isMuted()) sound.countBeep();
    }
  }, 700);
}

function beginPlay() {
  state = "playing";
  const prev = HighScore.get(UNIT);
  autoDiff = new AutoDifficulty(levelFromUrl(AutoDifficulty.startLevelFromHighScore(prev)));
  count = 0;
  party.reset();
  hands.reset();
  confetti = []; sparks = [];
  playEndAt = performance.now() + 60000;
  lastFrameAt = 0;
  newRound();

  recorder = new ClipRecorder(canvas, sound, 24);
  recorder.prepare();
  comboShot = new ComboShot(canvas);
  fallbackShot = new ComboShot(canvas);
  autoRec = scheduleAutoRecording(recorder, {
    onStartVisual: () => {
      recIndicator.style.display = "flex";
      setTimeout(() => { if (!comboShot.captured) fallbackShot.capture(canvas); }, 1500);
    },
    onEndVisual: () => { recIndicator.style.display = "none"; },
    onDone: (blob) => { recordedBlob = blob; },
    fallbackMs: 8000,
  });
}

function roundLimitMs() { return [6500, 5800, 5200][autoDiff.level - 1]; }

function succeed() {
  resolving = true;
  count++;
  party.correct(ball.m.x, ball.m.y - catchR(), { base: 11, elapsedMs: performance.now() - roundAt });
  if (party.combo > 0 && party.combo === party.maxCombo) comboShot.capture(canvas);
  autoDiff.reportCorrect();
  autoRec.trigger();
  shake.trigger(7, 160);
  spawnSparkles(sparks, ball.p.x, ball.p.y, 18, ["#fff", PARTY.gold, CUTE.cyan]);
  spawnSparkles(sparks, ball.m.x, ball.m.y, 18, ["#fff", PARTY.gold, CUTE.cyan]);
  spawnConfetti(confetti, (ball.p.x + ball.m.x) / 2, (ball.p.y + ball.m.y) / 2, 26);
  setTimeout(() => { if (state === "playing") newRound(); }, 800);
}

function fail() {
  resolving = true;
  party.wrong(ball.p.x, ball.p.y - catchR(), "대칭인 자리를 봐요!");
  autoDiff.reportWrong();
  shake.trigger(4, 150);
  missMark = performance.now();
  setTimeout(() => { if (state === "playing") newRound(); }, 1400);
}

function endGame() {
  state = "result";
  const { medal, label } = medalFor(count, MEDALS);
  const prev = HighScore.get(UNIT);
  const best = Math.max(count, prev ? prev.count : 0);
  if (!prev || count >= prev.count) {
    HighScore.set(UNIT, { count, bestLevel: autoDiff.level, label: `${medal} ${count}${RECORD_SUFFIX}`, at: Date.now() });
  }
  renderPodium({ unit: UNIT, medal, label, coins: party.coins, maxCombo: party.maxCombo, count, suffix: RECORD_SUFFIX, best });

  document.getElementById("statCount").textContent = count + "번";
  document.getElementById("statBest").textContent = best + "번";
  document.getElementById("statCombo").textContent = "🔥" + party.maxCombo;

  const shot = comboShot.captured ? comboShot : fallbackShot;
  const previewVideo = document.getElementById("previewVideo");
  const saveVideoBtn = document.getElementById("saveVideoBtn");
  if (recordedBlob) {
    previewVideo.src = URL.createObjectURL(recordedBlob);
    previewVideo.style.display = "block";
    saveVideoBtn.style.display = "inline-block";
  }
  document.getElementById("savePhotoBtn").onclick = async () => {
    const blob = await shot.toBlob((c, w, h) => drawPhotoOverlay(c, w, h, { title: TITLE, record: count + RECORD_SUFFIX, medal }));
    downloadBlob(blob, `수학체육올림픽5_대칭수비_${formatFileTimestamp()}.png`);
  };
  document.getElementById("saveVideoBtn").onclick = () => {
    if (recordedBlob) downloadBlob(recordedBlob, `수학체육올림픽5_대칭수비_${formatFileTimestamp()}.${recorder.extension}`);
  };
  document.getElementById("resultPanel").style.display = "flex";
  if (!isMuted()) sound.success();
}

document.getElementById("retryBtn").addEventListener("click", () => {
  document.getElementById("resultPanel").style.display = "none";
  document.getElementById("raisePanel").style.display = "flex";
  startGate.since = 0; startGate.ready = false; holdFill.style.width = "0%";
  state = "raise";
});

document.getElementById("raisePanel").addEventListener("click", () => {
  if (state === "raise" && mode !== "motion") goReady();
});

function goReady() {
  state = "ready";
  document.getElementById("raisePanel").style.display = "none";
  document.getElementById("readyPanel").style.display = "flex";
  if (!isMuted()) sound.click();
  setTimeout(() => {
    document.getElementById("readyPanel").style.display = "none";
    startCountdown();
  }, 500);
}

// 두 손 얻기 — 마우스는 손이 하나뿐이라 반대쪽을 자동으로 미러링해 준다
function getPair() {
  if (mode === "motion") {
    return hands.both ? { a: hands.left, b: hands.right, auto: false } : null;
  }
  const pts = pointerInput ? pointerInput.points : [];
  if (pts.length >= 2) {
    const s = [...pts].sort((x, y) => x.x - y.x);
    return { a: s[0], b: s[s.length - 1], auto: false };
  }
  if (pts.length === 1 && sym) return { a: pts[0], b: sym.mirror(pts[0]), auto: true };
  return null;
}

function loop(tsMs) {
  requestAnimationFrame(loop);
  if (mode === "motion" && video.readyState < 2) return;
  const { ctx, w, h } = dims;
  ctx.save();
  shake.apply(ctx);
  if (mode === "motion") drawMirroredVideo(ctx, video, w, h);
  else drawPartyBackdrop(ctx, dims);
  drawDrifters(ctx, drifters, dims, 1 / 60);
  drawBunting(ctx, dims);
  drawCrowd(ctx, dims, party.cheerUntil);

  let result = null;
  if (mode === "motion") {
    result = handTracker.detect(video, tsMs);
    if (state === "raise") {
      let raised = 0;
      if (result && result.landmarks) for (const lm of result.landmarks) if (isHandRaised(lm)) raised++;
      if (startGate.update(tsMs, raised >= 2)) goReady();
    }
  }
  cursors = getCursors(mode, result, w, h, video, pointerInput);
  hands.update(cursors);

  if (state === "playing") stepGame();

  for (const c of cursors) drawGloveCursor(ctx, c.x, c.y, fluidPx(dims, 42, { min: 30, max: 58 }), { active: dwell > 0 });
  ctx.restore();
}

function stepGame() {
  const { ctx, w, h } = dims;
  // 홀드·게이지는 프레임 수가 아니라 실제 흐른 시간으로 쌓아야 한다.
  // 느린 기기에서 프레임이 떨어지면 제한 시간만 실시간으로 흐르고 게이지는 안 차서 불리해진다.
  const dt = lastFrameAt ? Math.min(0.06, (performance.now() - lastFrameAt) / 1000) : 1 / 60;
  lastFrameAt = performance.now();
  const remain = Math.max(0, playEndAt - performance.now());
  if (remain <= 0) { endGame(); return; }
  const now = performance.now();
  const armed = now - roundAt > 700;
  const R = catchR();
  const f = field();
  const pair = getPair();

  // ── 판정 ────────────────────────────────────────────────
  // 두 손일 때: 한 손이 타구에, 다른 손이 그 대칭 자리에 동시에 있어야 한다.
  // 한 손(마우스)일 때: 반대쪽 손이 자동으로 미러링되므로, 공을 그냥 짚으면 두 조건이
  // 동시에 충족돼 수학이 사라진다. 그래서 이 경우에는 **대칭 자리 쪽만** 인정한다.
  let onBall = false, onMirror = false, symOk = false, good = false;
  if (pair) {
    const near = (p, q) => Math.hypot(p.x - q.x, p.y - q.y) < R;
    if (pair.auto) {
      onMirror = near(pair.a, ball.m);
      good = onMirror;
    } else {
      onBall = near(pair.a, ball.p) || near(pair.b, ball.p);
      onMirror = near(pair.a, ball.m) || near(pair.b, ball.m);
      good = onBall && onMirror;
    }
    // 두 손 자체가 서로 대칭인지 (연결선 표시용)
    const mb = sym.mirror(pair.a);
    symOk = Math.hypot(mb.x - pair.b.x, mb.y - pair.b.y) < R * 0.9;
  }
  if (!resolving && armed) {
    dwell = good ? dwell + dt * 1000 : Math.max(0, dwell - dt * 800);
    if (dwell > 280) succeed();
    else if (now - roundAt > roundLimitMs()) fail();
  }

  // ── 필드 ────────────────────────────────────────────────
  ctx.save();
  ctx.fillStyle = "rgba(140,233,154,0.32)";
  ctx.beginPath(); ctx.roundRect(f.x0, f.y0, f.x1 - f.x0, f.y1 - f.y0, fluidPx(dims, 20, { min: 12, max: 28 }));
  ctx.fill();
  ctx.strokeStyle = "rgba(34,48,92,0.4)"; ctx.lineWidth = fluidPx(dims, 3.5, { min: 2.5, max: 5 });
  ctx.stroke();
  ctx.restore();

  // 대칭축 / 대칭의 중심
  ctx.save();
  ctx.strokeStyle = "rgba(255,143,199,0.95)";
  ctx.lineWidth = fluidPx(dims, 5, { min: 3.5, max: 7 });
  ctx.setLineDash([14, 10]);
  if (sym.kind === "point") {
    ctx.setLineDash([]);
    drawSticker(ctx, sym.cx, sym.cy, fluidPx(dims, 17, { min: 12, max: 23 }), CUTE.pink, { lineWidth: 4 });
    drawChunkyText(ctx, "＋", sym.cx, sym.cy, fluidPx(dims, 22, { min: 16, max: 30 }), "#fff", { outlineWidth: 3 });
  } else {
    const L = Math.hypot(f.x1 - f.x0, f.y1 - f.y0);
    ctx.beginPath();
    ctx.moveTo(sym.cx - sym.dir.x * L, sym.cy - sym.dir.y * L);
    ctx.lineTo(sym.cx + sym.dir.x * L, sym.cy + sym.dir.y * L);
    ctx.stroke();
  }
  ctx.restore();

  // 펭귄 쌍둥이 — 대칭축을 사이에 두고 서로 대칭인 자리에 선다
  const pr = fluidPx(dims, 20, { min: 15, max: 27 });
  const anchor = { x: sym.cx + (f.x1 - f.x0) * 0.38, y: sym.cy - (f.y1 - f.y0) * 0.42 };
  const anchor2 = sym.mirror(anchor);
  drawMascot(ctx, anchor.x, anchor.y, pr, CHAR, party.currentMood(remain));
  drawMascot(ctx, anchor2.x, anchor2.y, pr, CHAR2, party.currentMood(remain));

  // 거울 손 — 내 손의 대칭 위치를 항상 보여 준다. 이게 이 종목의 핵심 학습 장치다.
  if (pair) {
    for (const p of [pair.a, pair.b]) {
      const m = sym.mirror(p);
      ctx.save();
      ctx.globalAlpha = 0.4;
      drawGloveCursor(ctx, m.x, m.y, fluidPx(dims, 38, { min: 28, max: 52 }), { active: true });
      ctx.restore();
    }
    // 두 손이 대칭이면 초록 줄로 이어 준다
    ctx.save();
    ctx.strokeStyle = symOk ? "rgba(81,207,102,0.95)" : "rgba(255,255,255,0.35)";
    ctx.lineWidth = fluidPx(dims, symOk ? 6 : 3, { min: 2, max: 9 });
    ctx.setLineDash(symOk ? [] : [7, 7]);
    ctx.beginPath(); ctx.moveTo(pair.a.x, pair.a.y); ctx.lineTo(pair.b.x, pair.b.y); ctx.stroke();
    ctx.restore();
  }

  // 타구 — 대응점은 그리지 않는다. 스스로 찾아야 한다.
  const br = fluidPx(dims, 27, { min: 21, max: 37 });
  const t = Math.min(1, (now - roundAt) / roundLimitMs());
  drawSticker(ctx, ball.p.x, ball.p.y, br, onBall ? CUTE.green : CUTE.red, { lineWidth: Math.max(3, br * 0.15) });
  ctx.save();
  ctx.font = `${br * 1.1}px sans-serif`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("⚾", ball.p.x, ball.p.y);
  ctx.restore();
  if (!resolving) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(ball.p.x, ball.p.y, br * 1.38, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - t));
    ctx.strokeStyle = t > 0.7 ? CUTE.red : PARTY.gold;
    ctx.lineWidth = fluidPx(dims, 5, { min: 3.5, max: 7 });
    ctx.lineCap = "round"; ctx.stroke();
    ctx.restore();
  }

  // 대응점에 손이 닿아 있으면 게이지가 찬다
  if (dwell > 0 && !resolving) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(ball.m.x, ball.m.y, R * 0.62, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(1, dwell / 280));
    ctx.strokeStyle = CUTE.cyan; ctx.lineWidth = fluidPx(dims, 6, { min: 4, max: 9 });
    ctx.lineCap = "round"; ctx.stroke();
    ctx.restore();
  }

  // 놓쳤을 때만 정답 자리를 보여 준다
  if (missMark) {
    ctx.save();
    ctx.setLineDash([9, 7]);
    ctx.strokeStyle = CUTE.green; ctx.lineWidth = fluidPx(dims, 4, { min: 3, max: 6 });
    ctx.beginPath(); ctx.moveTo(ball.p.x, ball.p.y); ctx.lineTo(ball.m.x, ball.m.y); ctx.stroke();
    ctx.beginPath(); ctx.arc(ball.m.x, ball.m.y, R * 0.7, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
    drawChunkyText(ctx, "여기였어요!", ball.m.x, ball.m.y - R * 0.95, fluidPx(dims, 17, { min: 12, max: 23 }), "#fff",
      { outline: CUTE.green, outlineWidth: fluidPx(dims, 5, { min: 3.5, max: 7 }) });
  }

  const hudBottom = party.drawHud(ctx, dims, { remainMs: remain, count, suffix: "번" });
  drawCuteBanner(ctx, dims, [
    { text: sym.label, size: 24, chunky: true, color: PARTY.gold },
    { text: mode !== "motion" && (!pair || pair.auto)
      ? "타구의 대칭인 자리를 짚어요! (공을 짚는 게 아니에요)"
      : onBall && !onMirror ? "좋아요! 다른 손을 대칭인 자리에!"
      : onMirror && !onBall ? "한 손은 타구 위에 올려요!"
      : "한 손은 타구에, 다른 손은 대칭인 자리에!", size: 14, color: CUTE.ink },
  ], fluidPx, { top: hudBottom });

  if (mode === "motion" && !hands.both) drawTwoHandHint(ctx, dims, fluidPx);

  party.update(dt);
  confetti = updateConfetti(confetti, dt); drawConfetti(ctx, confetti);
  sparks = updateSparkles(sparks, dt); drawSparkles(ctx, sparks);
  party.drawFx(ctx, dims);
  party.drawFeverFrame(ctx, dims);

  drawVignette(ctx, w, h, 0.16);
  drawLevelStars(ctx, dims, autoDiff.level, fluidPx);
}

init();
</script>
</body>
</html>
